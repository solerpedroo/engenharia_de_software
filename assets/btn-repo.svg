<svg xmlns="http://www.w3.org/2000/svg" width="170" height="36" viewBox="0 0 170 36">
  <style>
    .bg  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; letter-spacing: 0.5px; }
    .dot { fill: #58a6ff; animation: pulse 2s infinite alternate 1.5s; }
    @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
  <rect class="bg" width="168" height="34" x="1" y="1" rx="17" ry="17"/>
  <circle class="dot" cx="40" cy="18" r="4"/>
  <text class="txt" x="53" y="22" text-anchor="start">Ver Repositório</text>
</svg>
