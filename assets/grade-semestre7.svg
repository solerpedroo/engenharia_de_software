<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#8b949e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b949e"/>
      <stop offset="70%" stop-color="#c9d1d9"/>
      <stop offset="100%" stop-color="#c9d1d9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="900" height="240" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Background -->
    <rect width="900" height="240" fill="url(#bg)"/>

    <!-- Subtle grid pattern -->
    <g opacity="0.02" stroke="#58a6ff" stroke-width="0.5">
      <line x1="0" y1="48" x2="900" y2="48"/>
      <line x1="0" y1="96" x2="900" y2="96"/>
      <line x1="0" y1="144" x2="900" y2="144"/>
      <line x1="0" y1="192" x2="900" y2="192"/>
      <line x1="450" y1="0" x2="450" y2="240"/>
    </g>

    <!-- Border -->
    <rect x="0.5" y="0.5" width="899" height="239" rx="11.5" stroke="url(#borderGrad)" stroke-width="1" fill="none"/>

    <!-- Top Accent Line -->
    <rect x="0" y="0" width="900" height="2" fill="url(#topAccent)" opacity="0.8"/>

    <!-- Left accent line -->
    <line x1="15" y1="18" x2="15" y2="222" stroke="#8b949e" stroke-width="1.5" opacity="0.4"/>
    <!-- Right accent line -->
    <line x1="885" y1="18" x2="885" y2="222" stroke="#8b949e" stroke-width="1.5" opacity="0.4"/>

    <!-- Header Semester Name -->
    <text x="35" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="18" fill="#e6edf3" letter-spacing="1">
      7º SEMESTRE
    </text>

    <!-- Header Status Badge -->
    <rect x="740" y="27" width="125" height="22" rx="11" fill="#161b22" stroke="#8b949e" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="755" cy="38" r="3.5" fill="#8b949e"/>
    <text x="767" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#e6edf3">
      Pendente
    </text>

    <!-- Divider Line -->
    <line x1="35" y1="62" x2="865" y2="62" stroke="#30363d" stroke-width="1"/>

    <!-- Col 1, Item 1 -->
    <circle cx="45" cy="84" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="58" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Teologia e Sociedade
    </text>

    <!-- Col 1, Item 2 -->
    <circle cx="45" cy="112" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="58" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      PF-Prática de Formação III
    </text>

    <!-- Col 1, Item 3 -->
    <circle cx="45" cy="140" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="58" y="144" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Empreendedorismo, Consultoria e Inovação em TI
    </text>

    <!-- Col 1, Item 4 -->
    <circle cx="45" cy="168" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="58" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Tópicos em Engenharia de Software
    </text>

    <!-- Col 1, Item 5 -->
    <circle cx="45" cy="196" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="58" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Projeto Aplicado I
    </text>

    <!-- Col 2, Item 1 -->
    <circle cx="475" cy="84" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="488" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Projeto e Governança de TI
    </text>

    <!-- Col 2, Item 2 -->
    <circle cx="475" cy="112" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="488" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Gestão de Projetos em TI
    </text>

    <!-- Col 2, Item 3 -->
    <circle cx="475" cy="140" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="488" y="144" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Elementos de Pesquisa Operacional e Simulação
    </text>

    <!-- Col 2, Item 4 -->
    <circle cx="475" cy="168" r="3" fill="#8b949e" opacity="0.8"/>
    <text x="488" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12.5" fill="#8b949e">
      Atividades Complementares · Engenharia de Software
    </text>

  </g>
</svg>
