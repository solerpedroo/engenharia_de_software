<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>IMC</title>
    <link href="styles/base.css" rel="stylesheet" type="text/css"/>
    <!-- Script externo com defer -->
    <script src="scripts/imc.js" defer></script>
</head>
<body>
    <h1>Calcular IMC</h1>
    <p>Preencha todos os campos</p>

    <label for="txtAltura">Altura: </label><br/>
    <p class="hint">(Em metros, usando ponto. Exemplos: 1.50, 1.77 etc)</p>
    <input id="txtAltura" type="text" placeholder="1.70" required><br/><br/>

    <label for="txtPeso">Peso:</label><br/>
    <p class="hint">(Em KG, usando ponto ou não. Exemplos: 72.5, 90.5, 90.0 ou 90)</p> 
    <input id="txtPeso" type="text" placeholder="90" required><br/><br/>

    <button id="btnCalcularIMC" onclick="main();">Calcular</button><br/><br/>

    <!-- Aqui vamos mostrar o resultado do IMC -->
    <p id="resultadoIMC"></p>
</body>
</html>
