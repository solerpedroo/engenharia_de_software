<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Média 3 Notas</title>
    <link href="styles/base.css" rel="stylesheet" type="text/css"/>
    <script>
        function calcularMedia() {
            // 1️⃣ Coletar as notas
            const nota1 = parseFloat(document.getElementById("n1").value);
            const nota2 = parseFloat(document.getElementById("n2").value);
            const nota3 = parseFloat(document.getElementById("n3").value);

            // 2️⃣ Validar os valores
            if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3) || nota1 < 0 || nota2 < 0 || nota3 < 0) {
            alert("Por favor, insira valores válidos!");
            return;
            }

            // 3️⃣ Calcular Média
            const media = (nota1 + nota2 + nota3) / 3;

            // 4️⃣ Exibir o resultado
            console.log(media);
            document.getElementById("resultadoMedia").innerText = "Sua Média é: " + media.toFixed(2);

            // 5 mostrar aprovado ou não 
            if (media >= 5.0){
                console.log("Aprovado");
                document.getElementById("aprovacao").innerText = "Aprovado";
            }
            else{
                console.log("Reprovado");
                document.getElementById("aprovacao").innerText = "Reprovado";
            }
        }
    </script>

</head>
<body>
    <h1>Calcular Média</h1>
    <p>Preencha todos os campos</p>

    <label for="n1">Nota 1: </label><br/>
    <p class="hint">(De 0 a 10, pode usar ponto)</p>
    <input id="n1" type="text" placeholder="5.70" required><br/><br/>

    <label for="n2">Nota 2: </label><br/>
    <p class="hint">(De 0 a 10, pode usar ponto)</p> 
    <input id="n2" type="text" placeholder="5.70" required><br/><br/>

    <label for="n3">Nota 3:</label><br/>
    <p class="hint">(De 0 a 10, pode usar ponto)</p> 
    <input id="n3" type="text" placeholder="5.70" required><br/><br/>

    <button id="btnCalcularMedia" onclick="calcularMedia();">Calcular</button><br/><br/>

    <p id="resultadoMedia"></p>

    <p id="aprovacao"></p>
</body>
</html>
