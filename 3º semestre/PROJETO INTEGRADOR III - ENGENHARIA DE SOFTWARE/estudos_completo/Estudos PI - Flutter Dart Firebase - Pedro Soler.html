## Dart — `late` (inicialização adiada)

### O trecho (`balcao_tab_screen.dart`)

```dart
class _BalcaoTabScreenState extends State<BalcaoTabScreen>
    with SingleTickerProviderStateMixin {
  late final StartupCatalogFunctionsService _functionsService;
  late final TabController _mesaTabController;
  late final Future<List<CatalogStartup>> _listFuture;

  late DateTime _mesaExtratoFiltroInicioDia;
  late DateTime _mesaExtratoFiltroFimDia;

  @override
  void initState() {
    super.initState();
    _mesaTabController = TabController(length: 2, vsync: this);
    _functionsService =
        widget.catalogFunctionsService ?? StartupCatalogFunctionsService();
    _listFuture =
        widget.startupsFutureForTesting ??
        StartupCatalogListCache.instance.fullList(_functionsService);
    final hoje = DateTime(n.year, n.month, n.day);
    _mesaExtratoFiltroInicioDia = hoje;
    _mesaExtratoFiltroFimDia = hoje;
  }
}
```

### O que `late` significa

**“Esta variável ainda não tem valor na declaração, mas prometo inicializá-la antes de a usar.”**

- O Dart **não exige** valor na linha do campo.
- Na **primeira leitura**, o valor **já tem de estar atribuído** — senão → **crash** em runtime (`LateInitializationError`).

É **inicialização adiada** (*deferred initialization*), não é nullable.

### `late` vs `late final`

| Forma | Atribuições | Exemplo no ficheiro |
|-------|-------------|---------------------|
| `late final T x` | **Uma vez** (como `final`, mas pode ser depois) | `_mesaTabController`, `_listFuture` |
| `late T x` | **Várias vezes** permitidas | `_mesaExtratoFiltroInicioDia` (utilizador muda o filtro de datas) |

`late final` = “só inicializo no `initState` e nunca mais troco”.

### Por que não declarar já com valor?

Alguns valores **só existem depois** de `initState` / `this` estar pronto:

| Campo | Por que `late` |
|-------|----------------|
| `TabController(..., vsync: this)` | Precisa do `State` como `TickerProvider` — na declaração do campo o `initState` ainda não correu |
| `_functionsService` | Depende de `widget.catalogFunctionsService` (só disponível no `State`) |
| `_listFuture` | Usa `_functionsService` e `widget.startupsFutureForTesting` |
| `_mesaExtratoFiltroInicioDia` | Usa `DateTime.now()` no `initState`; depois pode ser alterado no picker de datas |

Não dá para escrever na declaração do campo:

```dart
late final TabController _mesaTabController =
    TabController(length: 2, vsync: this); // ❌ `this` ainda não está totalmente inicializado
```

Por isso declara-se `late` e atribui-se **dentro** de `initState()`.

### Por que não usar `DateTime?` (nullable)?

Alternativa:

```dart
DateTime? _mesaExtratoFiltroInicioDia;
```

Funciona, mas em todo o `build` e nos métodos terias de tratar `null` (`!`, `??`, `if`).

Com `late DateTime`:

- Depois do `initState`, tratas como **sempre definido** (`DateTime`, não `DateTime?`).
- Menos `!` espalhados — confias que inicializaste no ciclo de vida certo.

### Comparação com null safety

| | Nullable `T?` | `late T` |
|---|---------------|----------|
| Valor inicial | `null` permitido | **Nenhum** até atribuir |
| Obrigação | Tratar `null` no código | Garantir atribuição antes do uso |
| Reatribuir | Sim | `late` sim; `late final` não |
| Erro típico | Usar `null` sem querer | Ler antes de `initState` → `LateInitializationError` |

**Resumo:** `late` = “inicializo mais tarde, mas não é opcional”; encaixa campos de `State` que dependem de `initState`, `widget` ou `this`.

### Erro comum

```dart
late final TabController _c;

@override
Widget build(BuildContext context) {
  return TabBar(controller: _c); // ❌ se initState nunca fez _c = ...
}
```

Sempre atribuir no `initState` (ou antes da primeira leitura). No `dispose`, o mesmo ficheiro faz `_mesaTabController.dispose()` — só seguro porque foi inicializado no `initState`.

### Campos **sem** `late` no mesmo State (contraste)

```dart
final TextEditingController _searchController = TextEditingController();
CatalogStartup? _mesaStartup;  // nullable de propósito — pode ser null na lista
Timer? _searchDebounce;        // opcional — só existe enquanto digita
```

- **`final` na declaração** — valor conhecido já (não precisa de `this`/`widget`).
- **`?`** — “pode não existir” é regra de negócio (lista vs mesa).
- **`late`** — “vai existir, mas só depois do `initState`”.

---

## Dart — `static const`

### Exemplos no `balcao_tab_screen.dart`

```dart
class _BalcaoTabScreenState extends State<BalcaoTabScreen> {
  static const Duration _kSearchDebounceDelay = Duration(milliseconds: 200);
  static const int _mesaMarketRefreshMinutes = 20;
  static const _horizontalPadding = 20.0;
  ...
}

class _BalcaoMesaStartupCard extends StatelessWidget {
  static const _radius = 22.0;
  static const _min24hColor = Color(0xFFB91C1C);
  static const _max24hColor = Color(0xFF047857);
}
```

Uso:

```dart
_searchDebounce = Timer(_kSearchDebounceDelay, () { ... });

Timer.periodic(const Duration(minutes: _mesaMarketRefreshMinutes), (_) { ... });

padding: EdgeInsets.symmetric(horizontal: _horizontalPadding),
```

---

### `const` — valor fixo em compile-time

**`const`** = este valor é **conhecido ao compilar** e **nunca muda**.

- Números (`20.0`, `200`), `Duration(milliseconds: 200)`, `Color(0xFF...)`, strings literais.
- Objetos `const` são **canonicalizados** — a mesma constante pode ser reutilizada na memória.
- Em widgets Flutter, `const Widget(...)` evita rebuilds desnecessários quando o filho não muda.

Não podes usar `const` com coisas que só existem em runtime:

```dart
static const x = DateTime.now();     // ❌
static const y = widget.algumaCoisa;   // ❌
```

---

### `static` — pertence à classe, não à instância

**`static`** = um **único** valor (ou método) partilhado por **toda a classe**, não por cada `State` / widget.

| | Campo normal | `static` |
|---|--------------|----------|
| Onde vive | Cada instância do `State` | Na **classe** |
| Acesso | `this._horizontalPadding` | `_BalcaoTabScreenState._horizontalPadding` (ou directo dentro da classe) |
| Memória | Uma cópia por ecrã aberto | **Uma** cópia para todos |

No ecrão do balcão, `_horizontalPadding = 20.0` é igual para **todas** as instâncias de `_BalcaoTabScreenState` — não precisa de ser recriado por widget.

Métodos `static` também existem (ex.: funções utilitárias no topo do ficheiro não são `static` de classe — são funções de biblioteca).

---

### `static const` junto — constante da classe

Combina os dois:

1. **`const`** — imutável, fixo, compile-time.
2. **`static`** — um só exemplar na classe; não depende de `this`, `widget`, `context`.

Ideal para **configuração de UI** e **magic numbers** com nome:

| Constante | Papel |
|-----------|--------|
| `_kSearchDebounceDelay` | Espera 200 ms após digitar antes de filtrar (debounce) |
| `_mesaMarketRefreshMinutes` | Refresh da cotação a cada 20 min (alinhado ao backend) |
| `_horizontalPadding` | Margem horizontal 20 px em lista/mesa |
| `_radius`, `_min24hColor` | Layout/cores fixas do card da mesa |

O prefixo **`_`** mantém privado ao ficheiro (library private). O **`k`** em `_kSearchDebounceDelay` é convenção Flutter/Google para constantes (`kDefaultPadding`, etc.).

---

### `static const` vs campos normais no mesmo State

```dart
static const _horizontalPadding = 20.0;   // fixo, partilhado, compile-time
final ScrollController _bodyScrollController = ScrollController();  // uma por instância, mutável
late final TabController _mesaTabController;  // uma por instância, init no initState
CatalogStartup? _mesaStartup;  // muda com navegação lista ↔ mesa
```

| Tipo de campo | Quando |
|---------------|--------|
| `static const` | Número/cor/duração **fixos** do design ou regra |
| `final` na instância | Objeto **por ecrã** (controller, service) |
| `late` | Inicializa no `initState` |
| variável normal / `?` | Estado que **muda** (`setState`) |

---

### `const` extra no uso

```dart
Timer.periodic(const Duration(minutes: _mesaMarketRefreshMinutes), ...)
```

`_mesaMarketRefreshMinutes` já é `static const int`; `Duration(minutes: ...)` também pode ser `const` porque o argumento é compile-time.

---

### Comparação rápida

| Declaração | Mutável? | Por instância? | Compile-time? |
|------------|----------|----------------|---------------|
| `var x = 1` | sim | sim | não |
| `final x = 1` | não (referência) | sim | não necessariamente |
| `const x = 1` | não | sim* | sim |
| `static const x = 1` | não | **não** (classe) | sim |

\* `const` numa instância é raro; em Flutter quase sempre `static const` ou `const` local/widget.

**Resumo:** `static` = um valor para a **classe**; `const` = **imutável e fixo**; `static const` = constante de configuração (padding, debounce, cores) que não muda e não precisa de existir em cada `State`.

## Flutter — `sheetContext` no `showModalBottomSheet`

### O trecho (`balcao_tab_screen.dart`)

```dart
showModalBottomSheet<void>(
  context: context,
  builder: (sheetContext) {
    return SafeArea(
      child: Column(
        children: [
          ListTile(
            onTap: () {
              Navigator.of(sheetContext).pop();  // fecha o sheet
              comprarPlataforma();
            },
          ),
          ListTile(
            onTap: () {
              Navigator.of(sheetContext).pop();
              ScaffoldMessenger.of(context).showSnackBar(...);  // ecrã por baixo
              Navigator.of(context).push(...);                   // navega no ecrã principal
            },
          ),
        ],
      ),
    );
  },
);
```

### O que é `sheetContext`

**Não é palavra reservada do Dart** — é só o **nome do parâmetro** que o programador escolheu.

O `showModalBottomSheet` exige um `builder` com esta forma:

```dart
Widget Function(BuildContext context)
```

Ou seja, o Flutter **passa um `BuildContext`** para quem constrói o conteúdo do modal. Aqui chamaram esse parâmetro **`sheetContext`** em vez de `context` para **não confundir** com o `context` do `State` (ecrã do balcão por baixo).

Poderia ser `ctx`, `modalContext`, ou `context` (válido, mas sombreia o context exterior).

### Dois contextos na mesma função

| Variável | Onde está na árvore | Serve para |
|----------|---------------------|------------|
| `context` (do `State`) | `BalcaoTabScreen` | `push`, `SnackBar` no scaffold principal |
| `sheetContext` (do `builder`) | Rota do **bottom sheet** | **`pop()` para fechar só o modal** |

`BuildContext` = “ponto na árvore de widgets” — liga a `Navigator`, tema, `ScaffoldMessenger`, etc.

### Por que `Navigator.of(sheetContext).pop()`?

`pop()` remove a rota mais próxima a partir daquele contexto.

Com **`sheetContext`** → fecha o **bottom sheet** (folha que subiu de baixo).

Usar o nome certo deixa explícito: **fecho este modal**, depois executo `comprarPlataforma()`, `push`, ou `_mesaTabController.animateTo(1)` no ecrã por baixo.

### Por que `ScaffoldMessenger.of(context)` usa o `context` exterior?

O `SnackBar` deve aparecer no **scaffold do balcão**, não dentro do sheet que acabou de fechar — por isso usa-se o `context` do `State`, não o `sheetContext`.

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `sheetContext`? | `BuildContext` do conteúdo do modal — nome no `builder` |
| Por que outro nome? | Distingir do `context` do ecrã principal |
| Para que serve? | Sobretudo **`pop()`** para fechar o sheet antes da acção seguinte |

**Ideia:** fecha o sheet com o contexto **do sheet**; navega e snackbar com o contexto **do ecrão**.

## Dart — `..sort` (operador cascade + ordenar lista)

### O trecho (`balcao_cotacao_chart_series.dart`)

```dart
final sorted = List<BalcaoMarketPricePoint>.from(raw)
  ..sort((a, b) => a.t.compareTo(b.t));
```

São **duas coisas** juntas: `..` (cascade) e `.sort(...)` (ordenar a lista).

---

### Parte 1 — o operador `..` (cascade)

Em Dart, **`.`** normal chama um método e o **resultado da expressão** é o **retorno** desse método.

**`..`** (*cascade*) chama o método **no mesmo objeto**, mas a expressão **devolve o objeto original**, não o retorno do método.

Comparação:

```dart
// Sem cascade — sort devolve void; sorted seria inválido como List
final sorted = List.from(raw).sort(...);  // ❌ sort retorna void

// Com cascade — sort altera a lista; a expressão inteira ainda é a List
final sorted = List.from(raw)..sort(...);  // ✅ sorted é a List ordenada
```

Equivalente mais longo:

```dart
final sorted = List<BalcaoMarketPricePoint>.from(raw);
sorted.sort((a, b) => a.t.compareTo(b.t));
```

O cascade só **encurta** — mesmo efeito, menos linhas.

Outros usos comuns em Flutter:

```dart
Paint()
  ..color = Colors.red
  ..strokeWidth = 2;

ScrollController()
  ..addListener(_onScroll);
```

---

### Parte 2 — `.sort(...)`

`sort` é método de **`List`** em Dart. Ordena **in place** (modifica a própria lista, não cria cópia nova).

```dart
lista.sort((a, b) => a.t.compareTo(b.t));
```

- `(a, b) => ...` — função de comparação: negativo se `a` vem antes, positivo se `b` vem antes, 0 se empate.
- `a.t.compareTo(b.t)` — compara **`DateTime`**; ordena do **mais antigo ao mais recente** (crescente no tempo).

Por que ordenar?

A função `balcaoSortAndDedupePoints` prepara pontos para o **gráfico de cotação**. Depois remove duplicados no mesmo milissegundo e faz interpolação (`balcaoInterpolatePriceBrl`) — tudo assume série **cronológica**.

---

### Por que `List.from(raw)` antes do sort?

`sort` **muta** a lista. `List.from(raw)` cria uma **cópia** para não alterar a lista original que quem chamou passou — boa prática (evita efeitos colaterais).

---

### Resumo visual

```text
raw  ──► List.from(raw)  ──► mesma lista, agora .sort(...)
                │                    │
                └──── final sorted ◄─┘   (cascade devolve a List, não void)
```

| Símbolo / método | Significado |
|------------------|-------------|
| `..` | Cascade — chama método no objeto, expressão = objeto |
| `.sort(...)` | Ordena a lista **no lugar** |
| `compareTo` | Compara datas para ordem temporal |

**Resumo:** `..sort` = copia a lista, ordena-a por data **sem** precisar de duas linhas; o cascade existe porque `sort` retorna `void` mas queres guardar a **lista** em `sorted`.

## Dart — `StringBuffer()`

### O trecho (`carteira_brl.dart`)

```dart
String formatBrl(double value) {
  final fixed = value.toStringAsFixed(2);
  final parts = fixed.split('.');
  var intPart = parts[0];
  final dec = parts[1];
  final reversed = intPart.split('').reversed.join();
  final withDots = StringBuffer();
  for (var i = 0; i < reversed.length; i++) {
    if (i > 0 && i % 3 == 0) withDots.write('.');
    withDots.write(reversed[i]);
  }
  intPart = withDots.toString().split('').reversed.join();
  return 'R\$ $intPart,$dec';
}
```

Exemplo: `12450.00` → parte inteira `12450` → com pontos de milhar → `12.450` → `R$ 12.450,00`.

---

### O que é `StringBuffer`

Classe da biblioteca **`dart:core`** para **montar texto aos pedaços** de forma eficiente.

| Método / uso | O que faz |
|--------------|-----------|
| `StringBuffer()` | Cria buffer vazio |
| `.write('x')` / `.write(char)` | Acrescenta texto **sem** criar string nova a cada vez |
| `.toString()` | Devolve a **String** final |

Pense num “bloco de notas” onde vais escrevendo caractere a caractere; no fim lês tudo de uma vez.

---

### Por que usar aqui (e não `+` no loop)?

Forma ingénua:

```dart
var s = '';
for (...) {
  s = s + '.' + reversed[i];  // a cada iteração cria String NOVA
}
```

Em Dart (e na maioria das linguagens), **concatenar strings num loop** é lenta: cada `+` aloca outro objeto string.

`StringBuffer` acumula num buffer interno e só materializa a string final em `.toString()` — melhor para **muitos** `write` seguidos.

Neste caso o loop percorre dígitos da parte inteira (ex.: 6 chars) — a diferença de performance é pequena, mas o padrão é o correcto e legível para “construir string incrementalmente”.

---

### O que o algoritmo faz passo a passo

Objetivo: separador de **milhares** no padrão BR (ponto), depois vírgula nos centavos.

1. `12450.00` → `intPart = "12450"`, `dec = "00"`.
2. Inverte dígitos: `"05421"` — facilita inserir ponto a cada 3 chars **da direita**.
3. Loop no `StringBuffer`:
   - índice 3 → escreve `.` antes do 4.º dígito;
   - índice 6 → outro `.`; etc.
   - Resultado no buffer: `"054.21"` (ainda invertido).
4. `toString()`, inverte de novo → `"12.450"`.
5. `return 'R\$ $intPart,$dec'` → **`R$ 12.450,00`**.

O comentário no ficheiro diz que **não usam `NumberFormat`** (pacote `intl`) — algoritmo explícito, zero dependência extra.

---

### Onde mais aparece no projeto

| Ficheiro | Uso |
|----------|-----|
| `carteira_brl.dart` | Milhares em BRL |
| `pix_chave_input.dart` | Montar/mascarar chave PIX |
| `dashboard_screen.dart` | Formatação semelhante a BRL |
| `startup_detail_service.dart` | Construir texto longo aos pedaços |

---

### `StringBuffer` vs alternativas

| Abordagem | Quando |
|-----------|--------|
| `StringBuffer` + `write` | Loop com muitas junções |
| `'a' + 'b' + 'c'` (poucas peças) | Simples, 2–3 partes |
| `join()` em lista | Já tens lista de strings: `['12', '450'].join('.')` |
| `NumberFormat.currency(locale: 'pt_BR')` | i18n completa (projeto evitou em `formatBrl`) |

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Acumulador eficiente de texto |
| `write` | Adiciona fragmento |
| `toString()` | String final |
| Por que aqui? | Inserir `.` a cada 3 dígitos num loop sem concatenação repetida |

**Ideia:** `StringBuffer()` = construir strings **pedaço a pedaço**; em `formatBrl`, formata milhares no estilo brasileiro (`12.450,00`).

---

## Flutter — `TextSelection.collapsed`

### O trecho (`carteira_valor_input.dart`)

```dart
class CentavosParaReaisInputFormatter extends TextInputFormatter {
  @override
  TextEditingValue formatEditUpdate(
    TextEditingValue oldValue,
    TextEditingValue newValue,
  ) {
    if (digits.isEmpty) {
      return const TextEditingValue(
        text: '',
        selection: TextSelection.collapsed(offset: 0),
      );
    }
    // ...
    final texto = formatBrlCampo(reais);
    return TextEditingValue(
      text: texto,
      selection: TextSelection.collapsed(offset: texto.length),
    );
  }
}
```

---

### O que é `TextSelection`

Quando editas um `TextField`, o Flutter guarda não só o **texto**, mas também **onde está o cursor** e se há **texto seleccionado**.

`TextSelection` descreve isso com dois índices (posições entre caracteres, 0 … `text.length`):

| Campo | Significado |
|-------|-------------|
| `base` | Início da selecção (ou posição do cursor) |
| `extent` | Fim da selecção (ou posição do cursor) |

Se `base == extent` → **não há seleção** — só o **cursor** (caret) num ponto. Isso chama-se seleção **colapsada** (*collapsed*).

---

### O que é `.collapsed(offset: n)`

Factory/construtor que cria uma seleção **só com cursor**, sem texto destacado:

```dart
TextSelection.collapsed(offset: 5)
```

Equivale a:

```dart
TextSelection(baseOffset: 5, extentOffset: 5)
```

| Exemplo | Texto | Efeito visual |
|---------|-------|----------------|
| `collapsed(offset: 0)` | `""` | Cursor no início (campo vazio) |
| `collapsed(offset: texto.length)` | `"1.234,50"` | Cursor **no fim**, depois do último caractere |

Com seleção **não** colapsada (utilizador seleccionou texto):

```dart
TextSelection(baseOffset: 2, extentOffset: 6)  // "234," destacado
```

---

### Por que o formatter precisa disto

`TextInputFormatter` devolve um **`TextEditingValue`** com:

- `text` — o que aparece no campo
- `selection` — onde fica o cursor **depois** da formatação

Se alterares o `text` (ex.: `100000` → `1.000,00`) mas **não** actualizares `selection`, o cursor pode:

- ficar no meio do número;
- saltar para posição errada;
- comportar-se de forma estranha ao continuar a digitar.

Este formatter trata entrada **“centavos por dígitos”**: cada tecla numérica acrescenta um dígito à direita. Depois de reformatar com `formatBrlCampo`, o cursor deve ir **sempre para o fim** — daí:

```dart
selection: TextSelection.collapsed(offset: texto.length),
```

Campo vazio:

```dart
selection: TextSelection.collapsed(offset: 0),
```

---

### Fluxo mental ao digitar `1` → `10` → `100`

```text
Utilizador digita "1"
  → digits "1" → centavos 1 → "0,01"
  → cursor no fim (offset = length)

Digita "0" → "10" → "0,10" → cursor no fim
Digita "0" → "100" → "1,00" → cursor no fim
```

Sem `collapsed(offset: texto.length)`, ao inserir pontos e vírgula o índice antigo do cursor já não corresponde ao texto novo.

---

### `TextEditingValue` completo

```dart
TextEditingValue(
  text: '1.234,50',
  selection: TextSelection.collapsed(offset: 9),
  composing: TextRange.empty,  // often default; IME/composição de acentos
)
```

No formatter do projeto só se controlam `text` e `selection` — suficiente para máscara BRL.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `TextSelection`? | Posição do cursor e/ou intervalo seleccionado no campo |
| O que é `collapsed`? | Cursor num **único** ponto (`base == extent`) |
| `offset` | Índice no texto (0 = antes do 1.º char; `length` = depois do último) |
| Por que aqui? | Depois de mascarar `1.000,00`, manter cursor **no fim** para digitar mais dígitos |

**Ideia:** ao reformatar texto no `TextInputFormatter`, **sempre** devolve `text` + `selection`; `collapsed(offset: texto.length)` = “cursor no fim”, natural para máscara de valor em reais.

---

## O que é **DTO** (Data Transfer Object)

### Conceito geral

**DTO** = *Data Transfer Object* — objeto simples cujo trabalho é **transportar dados** de um sítio para outro, sem lógica de negócio pesada.

Características típicas:

| Característica | Significado |
|----------------|-------------|
| Só campos / getters | Pouca ou nenhuma regra complexa |
| Imutável ou quase | `final`, `const`, construtor com named params |
| Formato “certo” para quem consome | UI, API, outra camada |
| Não é entidade de BD | Não mapeia 1:1 tabela Firestore com todos os detalhes |

**Para quê?** Separar camadas:

```text
Firestore / API  →  Model / mapper  →  DTO  →  Widget / ecrã
     (JSON cru)      (regras, merge)    (só o necessário)   (layout)
```

Evita passar `Map<String, dynamic>`, `DocumentSnapshot` ou objetos gigantes para widgets — e evita que a UI conheça Firestore.

---

### Exemplo no projeto (`carteira_invested_position_model.dart`)

Há **duas camadas** de dados para a mesma posição investida:

#### 1. `CarteiraInvestedPositionModel` — modelo “rico”

Vem de `mapFirestorePosicaoParaInvestida`: cruza Firestore (`sim_wallet/.../positions`) + catálogo.

Campos: nome, categoria, **rendimento**, **totalInvestido**, **valorMercadoAtualBrl**, cores, ícone, logo…

Usado nas **telas** (`CarteiraScreen`, `DashboardScreen`) para calcular textos, máscaras, sparkline.

#### 2. `InvestedStartupRowUi` — **DTO leve** para o cartão

```dart
/// Converte no DTO leve consumido pelo widget [InvestedStartupCard].
InvestedStartupRowUi toInvestedRowUi() {
  return InvestedStartupRowUi(
    nome: nome,
    categoria: categoria,
    corLogo: corLogo,
    icone: icone,
    logoPath: logoPath,
  );
}
```

`InvestedStartupRowUi` (em `invested_startup_card.dart`) guarda **só o que o layout visual precisa**:

- nome, categoria, cor, ícone, logo

**Não** leva `totalInvestido`, `valorMercadoAtualBrl` — esses valores já vêm **formatados como String** pelo pai (`investidoExibicao`, `valorAtualExibicao`, etc.).

```dart
class InvestedStartupCard extends StatelessWidget {
  final InvestedStartupRowUi startup;      // DTO visual (branding)
  final String rendimentoExibicao;         // pai formata
  final String investidoExibicao;
  final String valorAtualExibicao;
  ...
}
```

---

### Fluxo no MesclaInvest

```mermaid
flowchart LR
  FS[Firestore positions]
  MAP[mapFirestorePosicaoParaInvestida]
  MODEL[CarteiraInvestedPositionModel]
  DTO[InvestedStartupRowUi]
  CARD[InvestedStartupCard]
  FS --> MAP --> MODEL
  MODEL -->|toInvestedRowUi| DTO
  MODEL -->|strings formatadas| CARD
  DTO --> CARD
```

1. Documento Firestore → mapper → **modelo com regras** (rendimento %, valor mercado).
2. Tela formata BRL, decide tom verde/vermelho, sparkline.
3. **`toInvestedRowUi()`** extrai subconjunto para branding.
4. Widget recebe DTO + strings prontas — **não** relê Firestore.

---

### DTO vs Model vs Entity (vocabulário PI)

| Nome comum | No projeto | Papel |
|------------|------------|--------|
| **Entity / documento** | Map Firestore, `CatalogStartup` | Dados persistidos |
| **Model** | `CarteiraInvestedPositionModel` | Agregação + campos de negócio/UI intermédia |
| **DTO** | `InvestedStartupRowUi` | Pacote mínimo para um consumidor (cartão) |
| **ViewModel / UI state** | strings `*Exibicao`, `hideValues` | Pronto para pintar no ecrã |

Em Dart/Flutter o time nem sempre põe “DTO” no nome da classe — o comentário em `toInvestedRowUi()` deixa explícito o papel.

---

### Outros “DTOs” implícitos no app

Qualquer classe só com campos para passar dados entre camadas:

- `CatalogStartup` — catálogo → listas/detalhe
- `BalcaoTransacaoDia` — extrato do balcão
- Respostas parseadas de Cloud Functions antes da UI

Não precisam chamar-se `SomethingDto` — o padrão é o mesmo.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é DTO? | Objeto simples para **transferir** dados entre camadas |
| Por que existe? | Desacoplar UI de Firestore/API; passar só o necessário |
| Onde viste no código? | `InvestedStartupRowUi` via `toInvestedRowUi()` |
| DTO = Model? | Não — model pode ter mais campos e origem no mapper; DTO é **fatia** para um widget/API |

**Ideia:** DTO = “pacote de dados já no formato certo para quem recebe”; aqui, branding mínimo para o `InvestedStartupCard` sem arrastar custos e cotações para dentro do widget.

## Dart — `.clamp(min, max)`

### O trecho (`adicionar_fundos_screen.dart`)

```dart
final screenW = MediaQuery.sizeOf(dialogContext).width;
final contentW = (screenW - 56).clamp(280.0, 500.0);
```

O diálogo “Confirmar transação” usa `contentW` na largura do conteúdo.

---

### O que faz

`.clamp(min, max)` é método de **`num`** (`int`, `double`) em Dart:

> Se o valor for **menor** que `min` → devolve **`min`**.  
> Se for **maior** que `max` → devolve **`max`**.  
> Caso contrário → devolve **o próprio valor**.

Equivalente mental:

```dart
valor < min ? min : (valor > max ? max : valor)
```

Ou: **força o número a ficar dentro do intervalo** `[min, max]`.

---

### Exemplo do diálogo

| Largura do ecrã `screenW` | `screenW - 56` | `.clamp(280, 500)` |
|---------------------------|----------------|---------------------|
| 320 (telefone estreito) | 264 | **280** (não deixa ficar estreito demais) |
| 390 | 334 | **334** (fica no meio) |
| 800 (tablet) | 744 | **500** (não deixa o modal largo demais) |

Objetivo UX: diálogo **legível** em telemóvel pequeno e **contido** em ecrãs grandes.

---

### Outros usos no MesclaInvest

| Onde | Código | Intenção |
|------|--------|----------|
| Sparkline | `(v - y0) / denom).clamp(0.0, 1.0)` | Normalizar para 0…1 (desenho) |
| Barra captação | `captureProgress.clamp(0.0, 1.0)` | Progresso nunca &lt; 0 nem &gt; 100% |
| Índice gráfico | `.round().clamp(0, n - 1)` | Índice de array nunca fora dos limites |
| Scroll auth | `.clamp(0.0, double.infinity)` | Altura mínima ≥ 0, sem teto |
| Dashboard nav | `initialMainNavIndex.clamp(0, max)` | Tab inicial válida |

Padrão comum: **limitar valores** antes de layout, índices ou percentagens.

---

### `clamp` vs `min` / `max`

Dart também tem `math.min` e `math.max`, mas **só um lado**:

```dart
math.max(280, screenW - 56)   // só piso — sem teto
(screenW - 56).clamp(280, 500) // piso **e** teto
```

No backend TypeScript do balcão viste `Math.max(0, ...)` — só **mínimo**; `.clamp(0, 1)` seria mínimo **e** máximo.

---

### Tipos

```dart
(3.14).clamp(0.0, 1.0)   // double
(5).clamp(0, 10)         // int (se min/max int)
```

`min` e `max` devem ser do **mesmo tipo** que o valor (ou compatível).

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `.clamp(a, b)`? | Mantém número entre `a` e `b` (inclusive) |
| Por que no diálogo? | Largura confortável: min 280, max 500 |
| Ideia geral | Evitar valores “impossíveis” na UI (negativos, &gt;100%, índice inválido) |

**Tradução:** *prender / limitar* o valor a um intervalo seguro.

---

## Dart — `padLeft` (preencher à esquerda)

### O trecho (`carteira_movimentacao_detalhe_screen.dart`)

```dart
String _dataHoraPtBr(DateTime d) {
  final dd = d.day.toString().padLeft(2, '0');
  final mm = d.month.toString().padLeft(2, '0');
  final yyyy = d.year.toString();
  final hh = d.hour.toString().padLeft(2, '0');
  final min = d.minute.toString().padLeft(2, '0');
  return '$dd/$mm/$yyyy às $hh:$min';
}
```

Exemplo: `5` de maio às `9:07` → **`05/05/2026 às 09:07`**, não `5/5/2026 às 9:7`.

---

### O que faz

`padLeft` é método de **`String`**:

```dart
texto.padLeft(larguraDesejada, caractereDePreenchimento)
```

- Se a string for **mais curta** que `larguraDesejada`, **acrescenta** caracteres **à esquerda** até atingir esse tamanho.
- Se já tiver tamanho suficiente (ou maior), **devolve a string original** (não corta).

| Chamada | Resultado |
|---------|-----------|
| `'5'.padLeft(2, '0')` | `'05'` |
| `'12'.padLeft(2, '0')` | `'12'` (já tem 2 chars) |
| `'123'.padLeft(2, '0')` | `'123'` (não encurta) |
| `'9'.padLeft(2, '0')` | `'09'` |

O 2.º argumento é **repetido** quantas vezes faltar — quase sempre `'0'` para **zero à esquerda** (*zero-padding*).

---

### Por que usar em datas e horas

Padrão visual **fixo** no Brasil e em comprovantes:

- dia e mês com **2 dígitos** (`01` … `31`, `01` … `12`);
- hora e minuto com **2 dígitos** (`00` … `23`, `00` … `59`).

Sem `padLeft`:

```dart
'${d.day}/${d.month}/${d.year}'  // 5/3/2026 — inconsistente
```

Com `padLeft`:

```dart
'05/03/2026'  // alinhado, profissional, fácil de ler
```

O mesmo padrão repete-se em `saque_comprovante_screen.dart`, `balcao_transacao_detalhe_screen.dart`, `pagamento_pix_screen.dart` (timer `mm:ss`), etc.

---

### Irmão: `padRight`

Preenche **à direita**:

```dart
'42'.padRight(5, '0')  // '42000'
```

Menos comum para datas; útil para alinhar colunas de texto monoespaçado.

---

### `padLeft` vs formatação com `DateFormat`

Alternativa com pacote `intl`:

```dart
DateFormat('dd/MM/yyyy HH:mm').format(d);
```

O projeto usa **`padLeft` manual** em vários sítios — explícito, sem dependência extra (mesma filosofia que `formatBrl` sem `NumberFormat`).

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Completa string **pela esquerda** até uma largura |
| `padLeft(2, '0')` | Garante **2 caracteres** com zero à esquerda se preciso |
| Por que aqui? | Data/hora pt-BR com dígitos sempre em par (`05/03/2026 às 09:07`) |

**Ideia:** *padding* à esquerda — preencher com `0` para não ficar `9:7` mas `09:07`.

## Flutter — `.addListener`

### O trecho (`carteira_screen.dart`)

```dart
class CarteiraScreen extends StatefulWidget {
  /// Pulso externo (ex.: botão "Ver todas" no Início) para descer até a lista investida.
  final ValueNotifier<int>? scrollStartupsSectionTick;
}

@override
void initState() {
  super.initState();
  widget.scrollStartupsSectionTick?.addListener(
    _onPedidoScrollExternoParaStartups,
  );
}

@override
void dispose() {
  widget.scrollStartupsSectionTick?.removeListener(
    _onPedidoScrollExternoParaStartups,
  );
  super.dispose();
}

void _onPedidoScrollExternoParaStartups() {
  _scrollParaStartupsInvestidas();
}
```

No **Dashboard** (`dashboard_screen.dart`):

```dart
final ValueNotifier<int> _carteiraScrollStartupsTick = ValueNotifier<int>(0);

// Botão "Ver todas" (ou similar):
_carteiraScrollStartupsTick.value++;

// Passa à Carteira embutida:
CarteiraScreen(
  scrollStartupsSectionTick: _carteiraScrollStartupsTick,
)
```

---

### O que faz `.addListener`

Regista uma **função callback** que o Flutter chama quando o objeto **notifica mudança**.

Disponível em classes que implementam **`Listenable`** — no projeto sobretudo:

| Classe | Uso típico |
|--------|------------|
| `ValueNotifier<T>` | Sinal simples (contador, flag) |
| `ChangeNotifier` | Estado mais complexo (providers) |
| `ScrollController` | Posição do scroll mudou |
| `TextEditingController` | Texto do campo mudou |
| `AnimationController` | Frame de animação |

Assinatura:

```dart
void addListener(VoidCallback listener);
```

- **`listener`** — função sem argumentos (ex.: `_onPedidoScrollExternoParaStartups`).
- Cada vez que alguém chama **`notifyListeners()`** (ou altera `.value` num `ValueNotifier`), **todos** os listeners registados correm.

**Par obrigatório:** `removeListener` no `dispose` — senão memory leak e callback em widget morto.

---

### O padrão neste caso (comunicação pai → filho)

Problema: o **Dashboard** tem a `CarteiraScreen` dentro dele. Um botão no Início quer **scroll automático** até “Minhas startups investidas”, mas o `ScrollController` vive **dentro** da Carteira.

Solução: **`ValueNotifier<int>`** como “campainha”:

```mermaid
sequenceDiagram
  participant Dash as DashboardScreen
  participant Notifier as ValueNotifier tick
  participant Cart as CarteiraScreen
  Dash->>Notifier: value++ (pulso)
  Notifier->>Cart: listener dispara
  Cart->>Cart: _scrollParaStartupsInvestidas()
```

- O **valor** (`0`, `1`, `2`…) quase não importa — só o facto de **mudar** dispara o listener.
- Carteira **não** precisa de conhecer o botão do Dashboard; só “ouve” o notifier.

`didUpdateWidget` troca listener se o pai passar **outro** `ValueNotifier`:

```dart
oldWidget.scrollStartupsSectionTick?.removeListener(...);
widget.scrollStartupsSectionTick?.addListener(...);
```

---

### Outros usos comuns de `.addListener` no Flutter

```dart
_scrollController.addListener(() {
  if (_scrollController.offset > 100) { ... }
});

_emailController.addListener(() {
  setState(() {});  // revalidar formulário
});
```

Mesma ideia: “quando X mudar, executa isto”.

---

### `addListener` vs alternativas

| Abordagem | Quando |
|-----------|--------|
| `addListener` | Controllers, `ValueNotifier`, lógica imperativa |
| `ListenableBuilder` / `AnimatedBuilder` | Rebuild automático de widget quando notifier muda |
| `ValueListenableBuilder` | Só para `ValueNotifier` — UI reage ao valor |
| Callback `VoidCallback? onTap` | Evento **pontual** (um clique) |

Aqui usam listener porque a acção é **scroll imperativo**, não rebuild de UI por valor.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Subscrever callback quando objeto notifica mudança |
| Por que na Carteira? | Dashboard pede scroll à secção investidas à distância |
| O que fazer sempre? | `removeListener` no `dispose` |
| Irmão | `removeListener` — cancelar subscrição |

**Ideia:** `.addListener` = “avisa-me quando isto mudar”; aqui, um `value++` no Dashboard manda a Carteira fazer scroll.

---

## `watchPositions` e o `>>>` nos tipos genéricos

### `watchPositions` — para que serve

Definido em `simulated_wallet_service.dart`:

```dart
/// Posições atuais (tokens por startup).
static Stream<QuerySnapshot<Map<String, dynamic>>> watchPositions(
  String uid,
) {
  return SimulatedWalletPaths.positionsCol(uid).snapshots();
}
```

| Peça | Significado |
|------|-------------|
| `positionsCol(uid)` | Coleção Firestore `sim_wallet/{uid}/positions` — uma posição por startup |
| `.snapshots()` | **Stream** em tempo real: emite de novo quando documentos mudam |
| `watchPositions` | API da app: “observa todas as posições investidas deste utilizador” |

Cada documento de posição traz campos como `tokensHeld`, `costBasisBrl`, `startupName`, etc.

Uso na `carteira_screen.dart` (linha ~1340):

```dart
return StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
  stream: SimulatedWalletService.watchPositions(uid),
  builder: (context, posSnap) {
    final docs = posSnap.data?.docs ?? [];
    // monta lista "Minhas startups investidas", património, etc.
  },
);
```

**Fluxo:**

```mermaid
flowchart LR
  FS[Firestore positions]
  W[watchPositions stream]
  SB[StreamBuilder]
  UI[Lista investidas / métricas]
  FS -->|snapshots| W --> SB --> UI
```

Quando o utilizador compra/vende tokens (`simulateWallet`), o Firestore actualiza → stream emite → `StreamBuilder` reconstrói a UI **sem** refresh manual.

Irmãos no mesmo serviço:

| Método | Observa |
|--------|---------|
| `watchBrlBalance(uid)` | Saldo BRL (`brlBalance`) |
| `watchLedger(uid)` | Extrato / movimentações |
| `watchPositions(uid)` | Posições em tokens por startup |

---

### O que é o `>>>` (três `>` seguidos)?

**Não é operador.** Não significa “shift” nem “maior que” três vezes.

Aparece no **fecho de tipos genéricos aninhados**:

```dart
StreamBuilder<QuerySnapshot<Map<String, dynamic>>>
//            ^1              ^2                    ^3^3^3
//            abre            abre Map              três fechos >
```

Desembrulhando:

```dart
StreamBuilder<
  QuerySnapshot<
    Map<String, dynamic>
  >
>
```

Três níveis de `< ... >`:

1. **`Map<String, dynamic>`** — mapa Firestore (chaves string, valores dinâmicos)
2. **`QuerySnapshot<...>`** — snapshot de uma **query** (lista de documentos)
3. **`StreamBuilder<...>`** — widget que reconstrói quando o stream emite

Os **`>>>`** no fim são **três `>` de fecho**, um por cada `<` aberto.

#### Por que parece estranho?

Em Dart antigo, `>>` no fim de generics confundia-se com operador **bit shift**. Hoje o compilador distingue; podes escrever `>>>` seguidos ao fechar generics.

Com espaços (equivalente, mais legível):

```dart
StreamBuilder<QuerySnapshot<Map<String, dynamic>> >
//                                                      ^ espaço opcional
```

#### Não confundir

| Símbolo | O quê |
|---------|--------|
| `>>>` no fim de `StreamBuilder<...>>>` | Fechar 3 generics |
| `>>` operador | Shift à direita em int (raro na UI) |
| `>` | Comparação “maior que” |

Outros exemplos no projeto com vários `>`:

```dart
List<QueryDocumentSnapshot<Map<String, dynamic>>>
Future<Map<String, BalcaoStartupMarketStats?>>
DocumentReference<Map<String, dynamic>>
```

Sempre: **cada `>` a fechar abre um `<` anterior**.

---

### Resumo

| Tópico | Resposta |
|--------|----------|
| `watchPositions` | Stream Firestore das posições `sim_wallet/{uid}/positions` |
| Para quê? | UI actualiza sozinha quando tokens/saldos mudam |
| `>>>` | Três fechos de generics: `StreamBuilder` + `QuerySnapshot` + `Map` |
| Operador? | **Não** — só sintaxe de tipos |

---

## Dart — operador `~/` (divisão inteira)

### O trecho (`carteira_screen.dart`, linha ~1440)

```dart
final bucket = DateTime.now().millisecondsSinceEpoch ~/ 120000;
final key = '$bucket|${ids.join('|')}';
```

Usado para **cache** de estatísticas de mercado dos sparklines: o `bucket` muda a cada **120 000 ms (2 minutos)**, forçando novo fetch quando o “intervalo de tempo” muda.

---

### O que é `~/`

Em Dart, **`~/` = divisão inteira** (*truncating division*):

- Divide dois números
- Devolve **`int`** (parte inteira, **sem** decimais)
- Descarta a fração (trunca em direção a zero)

| Expressão | Resultado | Nota |
|-----------|-----------|------|
| `7 ~/ 2` | `3` | não `3.5` |
| `10 ~/ 3` | `3` | resto ignorado |
| `5 ~/ 10` | `0` | |
| `-7 ~/ 2` | `-3` | trunca, não arredonda |

Compare com `/` (divisão normal):

| `/` | `~/` |
|-----|------|
| `7 / 2` → `3.5` (`double`) | `7 ~/ 2` → `3` (`int`) |

---

### Exemplo 2 — timer PIX (`pagamento_pix_screen.dart`)

```dart
String _formatarContagem(int s) {
  final m = s ~/ 60;   // minutos inteiros
  final r = s % 60;    // segundos restantes
  return '${m.padLeft...}:${r.padLeft...}';  // mm:ss
}
```

- `125 ~/ 60` → `2` minutos  
- `125 % 60` → `5` segundos → `02:05`

Aqui **`~/`** e **`%`** trabalham juntos (como em matemática: quociente + resto).

---

### Exemplo 1 — `bucket` de cache (detalhe)

```dart
millisecondsSinceEpoch ~/ 120000
```

| Agora (ms desde 1970) | `~/ 120000` | bucket |
|-----------------------|-------------|--------|
| 1 700 000 000 000 | 14 166 666 | X |
| 1 700 000 050 000 (+50s) | 14 166 666 | **mesmo** X |
| 1 700 000 130 000 (+130s) | 14 166 667 | **novo** bucket |

Durante ~2 min o `key` de cache é estável; depois muda e o app pode voltar a buscar `fetchStartupMarketStats` para os sparklines.

`120000` = 2 × 60 × 1000 ms — alinhado à ideia de não bater na API a cada rebuild.

---

### `~/` vs alternativas

| Forma | Resultado |
|-------|-----------|
| `a ~/ b` | `int`, truncado |
| `(a / b).floor()` | parecido para positivos |
| `(a / b).truncate()` | parecido |
| `a / b` | `double` com decimais |

Dart recomenda **`~/`** quando queres **inteiro** de propósito.

---

### Não confundir

| Símbolo | Significado |
|---------|-------------|
| `~/` | Divisão inteira |
| `/` | Divisão com decimais |
| `%` | Resto da divisão |
| `~` (unário) | Bitwise NOT (raro no Flutter UI) |

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `~/`? | Divisão que devolve **int** (sem parte decimal) |
| Na Carteira | Agrupa tempo em buckets de 2 min para cache |
| No PIX | Segundos → minutos (`s ~/ 60`) |

**Ideia:** “quantas vezes cabe **inteiro**?” — 125 segundos = **2** minutos (`~/ 60`), sobram 5 (`% 60`).

---

## Flutter — `shrinkWrap`

No MesclaInvest aparece sobretudo como **`MaterialTapTargetSize.shrinkWrap`** (linha ~1803 da `carteira_screen.dart`). Em Flutter existe também **`shrinkWrap: true`** em listas — são conceitos diferentes mas a mesma ideia: **encolher ao conteúdo**.

---

### 1. `MaterialTapTargetSize.shrinkWrap` (o teu caso)

```dart
TextButton(
  onPressed: () => setState(() => _movimentacoesVerTodas = !_movimentacoesVerTodas),
  style: TextButton.styleFrom(
    padding: EdgeInsets.zero,
    minimumSize: Size.zero,
    tapTargetSize: MaterialTapTargetSize.shrinkWrap,
  ),
  child: Text(_movimentacoesVerTodas ? 'Ver menos' : 'Ver todas'),
)
```

O mesmo padrão em “Ver todas” / “Ver menos” para **startups investidas** e **movimentações**.

#### O que faz

Botões Material têm por defeito uma **área mínima de toque** (~48×48 dp — acessibilidade). Mesmo com texto pequeno, o hitbox pode ficar **grande** e empurrar layout.

| Valor | Comportamento |
|-------|----------------|
| `MaterialTapTargetSize.padded` (padrão) | Garante área de toque mínima Material |
| **`MaterialTapTargetSize.shrinkWrap`** | Área de toque **só à volta do filho** (texto/link compacto) |

Combinado com:

```dart
padding: EdgeInsets.zero,
minimumSize: Size.zero,
```

→ link “Ver todas” fica **visualmente apertado** ao texto, alinhado ao título da secção, sem “bolha” invisible grande ao lado.

#### Trade-off

- **Pró:** layout limpo, link parece texto inline no header.
- **Contra:** alvo de toque menor — aceitável para link secundário com texto legível; Material ainda expande um pouco o toque em muitos casos.

---

### 2. `shrinkWrap: true` em `ListView` / `GridView` (conceito geral)

Noutros projetos Flutter (menos usado neste repo):

```dart
ListView(
  shrinkWrap: true,
  physics: const NeverScrollableScrollPhysics(),
  children: [...],
)
```

Dentro de um `Column` + `SingleChildScrollView`:

| | `shrinkWrap: false` (padrão) | `shrinkWrap: true` |
|---|------------------------------|---------------------|
| Altura | Tenta ocupar **infinito** → conflito com `Column` | Lista só com altura dos **filhos** |
| Scroll | Lista scrolla sozinha | Pai scrolla (se `NeverScrollableScrollPhysics`) |

**Ideia:** a lista **não** pede altura infinita; **encolhe** ao tamanho do conteúdo.

---

### Resumo

| Onde viste | Significado |
|------------|-------------|
| `tapTargetSize: MaterialTapTargetSize.shrinkWrap` | Botão/link **compacto** — hitbox ≈ tamanho do texto |
| `ListView(shrinkWrap: true)` | Lista com altura = soma dos itens (dentro de scroll pai) |

**Na Carteira (~1803):** `shrinkWrap` = link “Ver todas” / “Ver menos” **pequeno e alinhado**, sem padding/toque mínimo a mais.

---

## Flutter — `surfaceTintColor` (AppBar / Material 3)

### O trecho (`pagamento_pix_screen.dart`)

```dart
appBar: AppBar(
  backgroundColor: theme.colorScheme.surface,
  foregroundColor: onSurface,
  surfaceTintColor: Colors.transparent,
  elevation: 0,
  shadowColor: Colors.transparent,
  scrolledUnderElevation: 0,
  ...
),
```

O mesmo padrão repete-se em Carteira, Balcão, comprovantes, etc.

---

### O que é

Propriedade do **Material 3** (`ColorScheme` / widgets `Material`, `AppBar`, `Card`…).

**`surfaceTintColor`** = cor de **tint** (lavagem) aplicada sobre superfícies “elevadas” — especialmente quando o conteúdo **passa por baixo** da AppBar ao fazer scroll (*scrolled under*).

Por defeito no M3, o Flutter mistura um pouco da **`colorScheme.primary`** (ou `surfaceTint`) em cima do `backgroundColor` → AppBar pode ficar **ligeiramente roxa/verde** em vez de branca/cinza pura.

---

### Por que `Colors.transparent` no projeto

| Objetivo | Propriedades usadas em conjunto |
|----------|----------------------------------|
| AppBar **plana**, cor sólida | `backgroundColor: surface` |
| **Sem** mancha de cor primária | `surfaceTintColor: Colors.transparent` |
| **Sem** sombra | `elevation: 0`, `shadowColor: transparent` |
| **Sem** elevação ao scroll | `scrolledUnderElevation: 0` |

Resultado visual: barra superior **limpa** — branca/cinza do tema, alinhada ao design Mescla (gradiente/cartões por baixo, sem AppBar “Material default” a mudar de tom).

Sem `surfaceTintColor: transparent`, ao scrollar o body por baixo da AppBar podias ver um **flash** ou tom diferente (tint M3).

---

### Relação com outras cores da AppBar

| Propriedade | Controla |
|-------------|----------|
| `backgroundColor` | Cor de fundo base |
| **`surfaceTintColor`** | Overlay de tint M3 em cima do fundo |
| `foregroundColor` | Ícones e texto (voltar, título) |
| `elevation` / `scrolledUnderElevation` | Sombra / sensação de “flutuar” |
| `systemOverlayStyle` | Status bar (ícones claros/escuros) |

`surfaceTintColor` **não** muda o texto — só o **fundo** (como é “pintado” pelo engine Material 3).

---

### Material 2 vs 3 (contexto rápido)

- **Material 2:** sobretudo `elevation` + sombra para profundidade.
- **Material 3:** usa também **tonal elevation** — elevar superfície = misturar `surfaceTint` na cor.

O MesclaInvest **desliga** o tint (`transparent`) e mantém **elevation 0** → look flat/custom.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Cor de lavagem M3 sobre superfícies (AppBar, cards) |
| `Colors.transparent` | **Desliga** o tint — fundo fica só o `backgroundColor` |
| Por que aqui? | AppBar consistente, sem tom primário ao scroll |
| Onde mais? | Quase todos os ecrãs com AppBar clara no app |

**Ideia:** `surfaceTintColor: transparent` = “não pintes por cima da minha AppBar com a cor primária do tema”.

## Flutter — `addPostFrameCallback` (reforço: `sacar_senha_screen.dart`)

> Conceito geral já em **Flutter — `WidgetsBinding.instance.addPostFrameCallback`** (biometria, splash, OTP).

### O trecho que estás a ver

```dart
@override
void initState() {
  super.initState();
  WidgetsBinding.instance.addPostFrameCallback((_) => _atualizarOfertaBiometria());
}

Future<void> _atualizarOfertaBiometria() async {
  if (!widget.debitarSaldoReal) {
    if (mounted) setState(() => _oferecerBiometria = false);
    return;
  }
  final bool ok = await BiometricShortcutAvailability.userWantsBiometricShortcut();
  if (!mounted) return;
  setState(() => _oferecerBiometria = ok);
  if (!ok || _disparouPromptBiometriaInicial) return;
  _disparouPromptBiometriaInicial = true;
  await Future<void>.delayed(const Duration(milliseconds: 450));
  if (!mounted || !_oferecerBiometria) return;
  await _onConfirmarComBiometria();
}
```

### Ciclo de frames (recordatório)

```text
initState()
    → regista callback
build() / layout / paint   ← 1.º frame (ecrã de senha visível)
    → addPostFrameCallback corre
_atualizarOfertaBiometria()
    → setState (mostrar botão biometria?)
    → opcional: prompt Face ID / digital
```

### Por que não chamar `_atualizarOfertaBiometria()` directo no `initState`?

1. **`setState` dentro de async** — após `await`, sim — mas o **primeiro** disparo não deve correr enquanto o ecrã ainda está a montar o 1.º frame.
2. **Diálogo de biometria** por cima de ecrã incompleto → glitches ou erros de contexto.
3. **`BuildContext`** e overlay precisam de árvore estável.

### O que acontece depois do callback neste ecrã

| Passo | Acção |
|-------|--------|
| 1 | Verifica se saque real (`debitarSaldoReal`) |
| 2 | Pergunta se utilizador activou atalho biométrico |
| 3 | `setState` → `_oferecerBiometria` (UI do botão digital) |
| 4 | Se sim: espera 450 ms + abre biometria automaticamente (uma vez) |

O **delay 450 ms** é UX — utilizador vê o ecrã antes do popup do sistema.

### `addPostFrameCallback` + `mounted`

- **Post-frame** → timing do **arranque** (depois do 1.º paint).
- **`mounted`** → depois de cada **`await`**, widget ainda existe?

```dart
if (!mounted) return;  // após await biometria / delay
```

### Onde mais no projeto (mesmo padrão)

| Ficheiro | Callback |
|----------|----------|
| `sacar_senha_screen.dart` | `_atualizarOfertaBiometria` |
| `balcao_compra_senha_screen.dart` | idem (compra balcão) |
| `biometric_unlock_screen.dart` | `_tentarDesbloquear` |
| `splash_screen.dart` | `_goNext` (navegação) |
| `verification_code_screen.dart` | foco OTP |
| `carteira_screen.dart` | scroll para secção |

**Resumo:** agenda trabalho **depois** do frame; no saque, prepara biometria sem `setState`/dialog no meio do `initState`.

## Flutter — AppBar: `leading` e `surfaceTintColor` (`sacar_senha_screen.dart`)

### O trecho

```dart
appBar: AppBar(
  backgroundColor: theme.colorScheme.surface,
  foregroundColor: onSurface,
  surfaceTintColor: Colors.transparent,
  systemOverlayStyle: overlay,
  elevation: 0,
  leading: IconButton(
    icon: const Icon(Icons.arrow_back_ios_new_rounded),
    onPressed: _enviando ? null : () => Navigator.of(context).pop(),
    tooltip: 'Voltar',
  ),
  title: Text('Confirmar saque', ...),
  centerTitle: true,
),
```

Dois papéis diferentes na **barra superior**: navegação à esquerda + aparência do fundo.

---

### `leading` — slot **esquerdo** da AppBar

`leading` = widget no **início** da AppBar (lado esquerdo em LTR — português/inglês).

| Slot AppBar | Posição típica | Conteúdo comum |
|-------------|----------------|----------------|
| **`leading`** | Esquerda | Voltar, menu (drawer), fechar |
| **`title`** | Centro (se `centerTitle: true`) | Título do ecrã |
| **`actions`** | Direita | Ícones extra (partilhar, editar) |

Aqui: **`IconButton`** com seta `arrow_back_ios_new_rounded`.

```dart
onPressed: _enviando ? null : () => Navigator.of(context).pop(),
```

- **`Navigator.pop`** — volta ao ecrã anterior (valor/chave PIX).
- **`_enviando ? null`** — enquanto o saque processa, botão **desactivado** (não sai a meio da operação).

Se **não** defines `leading`, com rota anterior o Flutter pode injectar seta automática; aqui customizam ícone iOS-style e regra de `_enviando`.

`tooltip: 'Voltar'` — acessibilidade (leitor de ecrã).

---

### `surfaceTintColor` — tint Material 3 no fundo

(já detalhado em **Flutter — `surfaceTintColor`**; recordatório no contexto deste ecrã)

| Propriedade | Neste ecrã |
|-------------|------------|
| `backgroundColor: surface` | Fundo branco/cinza do tema |
| **`surfaceTintColor: transparent`** | **Sem** lavagem da cor primária por cima |
| `elevation: 0` | Barra plana, sem sombra |
| `foregroundColor: onSurface` | Seta + título legíveis |

Sem `transparent`, ao scroll (ou por defeito M3) a AppBar podia ganhar **tom roxo** da marca — o design Mescla quer barra **sólida e neutra**.

---

### Como encaixam juntos

```text
┌─────────────────────────────────────────┐
│  [← leading]    Confirmar saque         │  ← surface + tint transparent
│     pop()          title                │
└─────────────────────────────────────────┘
```

- **`leading`** = **o quê** (voltar).
- **`surfaceTintColor`** = **como** se vê o fundo (sem overlay M3).

---

### Resumo

| Propriedade | Função |
|-------------|--------|
| `leading` | Widget à esquerda — aqui, voltar com `Navigator.pop` |
| `surfaceTintColor: transparent` | AppBar sem tint primário ao scroll / M3 |

**Ideia:** `leading` = controlo de navegação; `surfaceTintColor` = controlo visual do fundo da barra.

## Flutter — `onChanged`

### O que é (ideia geral)

**`onChanged`** = callback (“quando o valor **mudar**, chama esta função”).

Aparece em widgets de **entrada / selecção** — o Flutter invoca-o **cada vez** que o utilizador altera o valor, passando o **novo valor** como argumento.

| Widget | Tipo típico do parâmetro |
|--------|--------------------------|
| `TextField` | `String` (texto actual) |
| `DropdownButton` / `DropdownButtonFormField` | `T?` (opção escolhida; `null` se limpar) |
| `Switch` / `Checkbox` | `bool` |
| `Slider` | `double` |

Não é palavra reservada do Dart — é **nome de parâmetro** convencional em widgets Material.

---

### Exemplo 1 — dropdown no diálogo (linha ~153)

```dart
DropdownButtonFormField<String>(
  initialValue: tipo,
  items: [...],
  onChanged: (v) {
    if (v == null) return;
    setLocal(() {
      tipo = v;
      valorCtrl.clear();
    });
  },
),
```

- Utilizador muda tipo (E-mail → CPF) → `onChanged` recebe `v`.
- **`setLocal`** (do `StatefulBuilder`) reconstrói **só o diálogo**.
- Limpa o campo valor porque a máscara muda (`PixChaveValorTextField` com `key: ValueKey('valor_$tipo')`).

---

### Exemplo 2 — `TextField` valor do saque (linha ~435)

```dart
TextField(
  controller: _valorController,
  inputFormatters: [CentavosParaReaisInputFormatter()],
  onChanged: (_) {
    if (_erroValidacao != null) setState(() => _erroValidacao = null);
  },
),
```

- A cada tecla, se havia mensagem de erro → **`setState` limpa `_erroValidacao`**.
- `_` ignora o texto (já está no `controller`); só interessa reagir à **edição**.
- UX: erro some assim que o utilizador corrige o valor.

---

### Exemplo 3 — dropdown chave PIX (linha ~511)

```dart
DropdownButtonFormField<String>(
  value: _chaveIdSelecionada,
  items: [for (final c in chaves) DropdownMenuItem(value: c.id, ...)],
  onChanged: (id) => setState(() => _chaveIdSelecionada = id),
),
```

- Escolhe outra chave → guarda `id` no estado do ecrã.
- `setState` reconstrói o formulário com a selecção actualizada.

---

### `onChanged` vs outras callbacks

| Callback | Quando dispara |
|----------|----------------|
| **`onChanged`** | Valor **alterou** (cada mudança) |
| `onSubmitted` | Utilizador carregou “Enter” / concluiu (`TextField`) |
| `onPressed` | Toque num botão (evento **pontual**) |
| `controller` + listener | Mesmo efeito que `onChanged`, mas via `TextEditingController.addListener` |

Para `TextField`, podes usar só `controller` sem `onChanged`; `onChanged` é atalho directo no widget.

---

### Fluxo mental

```text
Utilizador interage → widget actualiza valor interno → onChanged(novoValor) → setState / lógica
```

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Função chamada quando o valor do widget muda |
| Parâmetro | Novo valor (`String`, `T?`, `bool`, …) |
| Por que usar? | Actualizar estado, limpar erros, trocar UI dependente |
| No saque | Tipo PIX, valor R\$, chave seleccionada |

**Ideia:** `onChanged` = “reage em tempo real à escolha/digitação do utilizador”.

## Flutter — `AppColors.shellOverlayStyle`

### O trecho (`sacar_valor_screen.dart`)

```dart
final overlay = AppColors.shellOverlayStyle(theme.brightness);

return AnnotatedRegion<SystemUiOverlayStyle>(
  value: overlay,
  child: Scaffold(
    appBar: AppBar(
      systemOverlayStyle: overlay,
      ...
    ),
  ),
);
```

---

### O que é

**Função do projeto** em `lib/theme/app_colors.dart` — não é API genérica do Flutter.

```dart
static SystemUiOverlayStyle shellOverlayStyle(Brightness brightness) {
  if (brightness == Brightness.dark) {
    return SystemUiOverlayStyle.light.copyWith(
      statusBarColor: Colors.transparent,
      systemNavigationBarColor: gradientBottomDark,
      systemNavigationBarIconBrightness: Brightness.light,
    );
  }
  return SystemUiOverlayStyle.dark.copyWith(
    statusBarColor: Colors.transparent,
  );
}
```

Devolve um **`SystemUiOverlayStyle`** — “receita” de como pintar **barras do sistema operativo**:

| Barra | O que controla |
|-------|----------------|
| **Status bar** (topo) | Hora, bateria, sinal |
| **Navigation bar** (baixo) | Botões/gestos Android |

---

### Por que o nome **shell**?

**Shell** = “casca” do app — o invólucro comum (abas Início, Explorar, Balcão, Carteira, Perfil em `MesclaMainShell`).

`shellOverlayStyle` = estilo **partilhado** de status/navigation bar para ecrãs dentro desse invólucro **e** subpáginas (login, saque, PIX, detalhe startup…) — **uma só função** em vez de copiar cores em cada ecrã.

Relacionado com `shellGradientColors` no mesmo ficheiro (gradiente de fundo do shell).

---

### Tema claro vs escuro

| Modo | Preset base | Efeito |
|------|-------------|--------|
| **Claro** | `SystemUiOverlayStyle.dark` | Ícones **escuros** na status bar (legíveis em fundo claro) |
| **Escuro** | `SystemUiOverlayStyle.light` | Ícones **claros** na status bar |
| Ambos | `statusBarColor: transparent` | Status bar transparente — gradiente/fundo “sobe” |
| Escuro | `systemNavigationBarColor: gradientBottomDark` | Barra inferior escura alinhada ao tema |

---

### Onde se aplica (dois sítios no mesmo ecrã)

```dart
AnnotatedRegion<SystemUiOverlayStyle>(value: overlay, ...)  // ecrã inteiro
AppBar(systemOverlayStyle: overlay, ...)                     // reforço na AppBar
```

- **`AnnotatedRegion`** — enquanto este ecrã está visível, o SO usa `overlay`.
- **`AppBar.systemOverlayStyle`** — garante consistência na barra superior.

Ao sair do ecrã, volta o estilo do ecrã anterior (ex.: shell das abas).

---

### Onde mais no app

Quase **todos** os ecrãs principais: `login_screen`, `carteira_screen`, `balcao_tab_screen`, `pagamento_pix_screen`, `sacar_senha_screen`, `mescla_main_shell.dart`, etc.

Padrão Mescla: **centralizar identidade visual** em `AppColors`.

---

### Relação com nota anterior

Já existe secção **Flutter — `SystemUiOverlayStyle` e `AnnotatedRegion`** (recover_password).  
`shellOverlayStyle` = **implementação concreta do Mescla** para essa ideia.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Helper que devolve `SystemUiOverlayStyle` claro/escuro |
| Para quê? | Status bar + nav bar legíveis com o tema Mescla |
| Por que “shell”? | Estilo unificado do invólucro do app |
| Como usar? | `overlay = shellOverlayStyle(brightness)` → `AnnotatedRegion` + AppBar |

**Ideia:** uma função, um visual — barras do telemóvel combinam com fundo claro/escuro em todo o app.

No projeto “nav” aparece em **três camadas** diferentes. Não confundir.

---

### 1. `Navigator` — pilha de ecrãs (ex.: `saque_comprovante_screen.dart`)

```dart
void _voltarACarteira(BuildContext context) {
  final nav = Navigator.of(context);
  nav.pop();
  nav.pop();
}

Fluxo de saque empilhado:

Carteira → SacarValor → SacarSenha → SaqueComprovante (topo)
```

| API | Função |
|-----|--------|
| `Navigator.of(context)` | Acede ao **Navigator** desta árvore |
| `push` / `pushReplacement` | Empilha ecrã novo |
| **`pop()`** | Remove o ecrã do **topo** |
| Dois `pop()` | Sai do comprovante **e** do valor → fica na Carteira |

`nav` é só variável local — nome curto para `NavigatorState`.

Rotas empurradas (saque, PIX, detalhe) ficam **fora** do shell das 5 abas; voltam com `pop`.

### 2. `MesclaBottomNavBar` — barra inferior (5 abas)

Widget em `mesbla_bottom_nav_bar.dart`. Propriedades **públicas**:

| Propriedade | Tipo | Papel |
|-------------|------|--------|
| **`selectedIndex`** | `int` | Aba activa (0…4) |
| **`onItemTap`** | `ValueChanged<int>` | Callback quando utilizador toca num item — pai faz `setState` |

Índices fixos:

| Índice | Aba |
|--------|-----|
| 0 | Início |
| 1 | Carteira |
| 2 | Balcão |
| 3 | Catálogo |
| 4 | Perfil |

Constante: `MesclaBottomNavBar.itemCount = 5`.

### 3. `MesclaMainShell` — contentor das abas

Liga a bottom nav aos corpos das telas (`mescla_main_shell.dart`):

| Propriedade | Tipo | Papel |
|-------------|------|--------|
| **`selectedIndex`** | `int` | Mesmo índice que a bottom bar |
| **`onNavIndexChanged`** | `ValueChanged<int>` | Repassado a `onItemTap` da barra |
| **`tabBodies`** | `List<Widget>` | 5 ecrãs (Início, Carteira, …) — todos montados no `Stack` |

```dart
MesclaBottomNavBar(
  selectedIndex: selectedIndex,
  onItemTap: onNavIndexChanged,
)
```

Só a aba activa recebe toques (`IgnorePointer` nas outras); estado das abas **preserva-se** ao trocar.

### 4. `_NavItem` — propriedades de **cada célula** da barra

Widget privado; o pai passa:

| Propriedade | Papel |
|-------------|--------|
| **`icon`** | Ícone Material (`home_outlined`, etc.) |
| **`label`** | Texto (`INÍCIO`, `CARTEIRA`, …) |
| **`isActive`** | `selectedIndex == i` — desenha pílula roxa |

Se `isActive`: fundo roxo + texto branco. Senão: só ícone/cinza.

### 5. **Navigation bar** do sistema (Android) — `shellOverlayStyle`

Não é o widget Flutter — é a **barra do SO** em baixo do ecrã:

| Propriedade (escuro) | Valor | Efeito |
|----------------------|-------|--------|
| `systemNavigationBarColor` | `gradientBottomDark` | Fundo escuro |
| `systemNavigationBarIconBrightness` | `light` | Ícones claros |

No tema claro usa-se sobretudo o preset `SystemUiOverlayStyle.dark` (ícones escuros na status bar).

### Diagrama — dois tipos de nav

```mermaid
flowchart TB
  subgraph shell [MesclaMainShell — abas]
    BN[MesclaBottomNavBar selectedIndex onItemTap]
    TB[tabBodies 0..4]
    BN --> TB
  end
  subgraph stack [Navigator — pilha]

## Firestore (Flutter) — `.doc` e `.snapshots()`

### Hierarquia no MesclaInvest (`simulated_wallet_service.dart`)

```text
sim_wallet/                    ← collection (coleção)
  {uid}/                       ← .doc(uid)  — documento da carteira
    brlBalance, ...
    ledger/                    ← subcoleção
      {movId}/                 ← documentos de extrato
    positions/                 ← subcoleção
      {startupId}/             ← .doc(startupId) — posição numa startup
        tokensHeld, costBasisBrl, ...
```

---

### `.doc(id)` — referência a **um documento**

Aponta para **um** documento dentro de uma coleção.

```dart
// Carteira do utilizador
FirebaseFirestore.instance.collection('sim_wallet').doc(uid);

// Posição numa startup específica
positionsCol(uid).doc(startupFirestoreId);
```

| Retorno | Significado |
|---------|-------------|
| `DocumentReference` | “Endereço” do documento — ainda **não** leu dados |

Operações comuns **depois** de `.doc`:

| Método | Tipo | Quando |
|--------|------|--------|
| **`.get()`** | `Future<DocumentSnapshot>` | Lê **uma vez** (async) |
| **`.snapshots()`** | `Stream<DocumentSnapshot>` | Escuta **mudanças** em tempo real |
| `.set()` / `.update()` | escrita | Gravar (servidor/functions) |

Exemplo leitura única (`fetchTokensHeld`):

```dart
final snap = await positionsCol(uid).doc(startupFirestoreId).get();
final t = snap.data()?['tokensHeld'];
```

O **ID** do documento em `positions` é o **`startupId`** Firestore (mesmo id usado no catálogo/balcão).

---

### `.snapshots()` — stream em **tempo real**

Subscreve alterações no Firestore. Sempre que o documento/coleção **muda**, o stream emite um novo snapshot.

#### Num **documento**

```dart
positionsCol(uid)
    .doc(startupFirestoreId)
    .snapshots()
    .map((snapshot) {
  final t = snapshot.data()?['tokensHeld'];
  return t is num ? t.toDouble() : 0.0;
});
```

`watchTokensHeld` — UI actualiza quando tokens mudam (compra/venda).

#### Num **documento** (saldo)

```dart
walletDoc(uid).snapshots().map((s) {
  final v = s.data()?['brlBalance'];
  return v is num ? v.toDouble() : 0.0;
});
```

`watchBrlBalance` — saldo BRL ao vivo na Carteira.

#### Numa **coleção** (query)

```dart
ledgerCol(uid)
    .orderBy('createdAt', descending: true)
    .limit(28)
    .snapshots();
```

`watchLedger` — extrato; emite quando entra movimento novo.

```dart
positionsCol(uid).snapshots();
```

`watchPositions` — **todos** os documentos da subcoleção `positions`.

---

### `.snapshots()` vs `.get()`

| | `.get()` | `.snapshots()` |
|---|----------|----------------|
| Entrega | Uma leitura | Stream contínuo |
| UI | `FutureBuilder` | **`StreamBuilder`** |
| Custo | 1 leitura por chamada | 1ª leitura + updates |
| Uso no projeto | `fetchBrlBalance`, prefetch | `watchBrlBalance`, `watchPositions` |

Prefetch (`prefetchWalletFirestore`) usa `.get()` para aquecer cache **antes** dos `StreamBuilder`s subscreverem `.snapshots()`.

---

### O que vem no snapshot

| Tipo | Campos úteis |
|------|----------------|
| `DocumentSnapshot` | `.data()` → `Map<String, dynamic>?`, `.exists` |
| `QuerySnapshot` | `.docs` → lista de documentos |

`data()` pode ser `null` se documento não existir — daí `?.` e fallbacks (`0.0`, `[]`).

---

### Fluxo com `StreamBuilder`

```mermaid
flowchart LR
  FS[Firestore sim_wallet]
  SN[snapshots stream]
  SB[StreamBuilder]
  UI[Carteira / saque]
  CF[simulateWallet CF]
  CF -->|grava| FS
  FS -->|emite| SN --> SB --> UI
```

Cloud Function altera Firestore → `.snapshots()` emite → `StreamBuilder` reconstrói → saldo/lista actualiza **sem** refresh manual.

---

### Resumo

| API | Significado |
|-----|-------------|
| `.collection('x')` | Coleção |
| **`.doc(id)`** | Um documento concreto (referência) |
| **`.snapshots()`** | Stream — “avisa quando isto mudar” |
| `.get()` | Leitura pontual |

**Ideia:** `.doc` = **onde** está o dado; `.snapshots` = **ouvir** mudanças nesse sítio para a UI reactiva.

### O trecho (onde estás a estudar)

```dart
enum ValuationPeriod {

**Adiciona** um getter `chipLabel` ao enum `ValuationPeriod` **sem** editar o corpo do enum.

```

| Valor enum | `chipLabel` no chip |
|------------|---------------------|
| `diario` | `DIÁRIO` |
| `semanal` | `SEMANAL` |
| `mensal` | `MENSAL` |
| `seisMeses` | `6 MESES` |
| `ytd` | `YTD` |

### Por que separar enum vs extension?

| Camada | Responsabilidade |
|--------|------------------|
| **`enum ValuationPeriod`** | Valor de **negócio** / filtro do gráfico (§5.4 MesclaInvest) |
| **`extension ValuationPeriodLabel`** | Texto **visual** para chips (maiúsculas, Figma) |

O enum fica estável para lógica (`chartPeriodWindowStart`, séries mock, balcão). A extension concentra tradução para UI — se mudar o rótulo, alteras **um sítio**.

### `switch (this)` dentro da extension

`this` = o valor concreto do enum (`ValuationPeriod.mensal`, etc.).

O `switch` exhaustivo garante que **cada** variante do enum tem rótulo — se adicionares valor ao enum sem actualizar a extension, o compilador avisa.

### Padrão repetido no projeto

| Extension | Tipo | Getter / método |
|-----------|------|-----------------|
| `ValuationPeriodLabel` | `ValuationPeriod` | `chipLabel` |
| `BalcaoOperacaoTipoX` | `BalcaoOperacaoTipo` | `verboInfinitivo` |
| `PixChaveUiFormatacao` | `PixChaveUi` | formatação PIX |

**Resumo:** `extension Nome on Tipo` = comportamento extra; aqui, enum → texto do chip do gráfico.

## Dart — `sealed class` (`startup_detail_load_state.dart`)

### O trecho

```dart
sealed class StartupDetailLoadState {
  const StartupDetailLoadState();
}

final class StartupDetailLoading extends StartupDetailLoadState {
  const StartupDetailLoading();
}

final class StartupDetailNotFound extends StartupDetailLoadState {
  const StartupDetailNotFound();
}

final class StartupDetailReady extends StartupDetailLoadState {
  const StartupDetailReady(this.data);
  final StartupDetailViewData data;
}
```

---

### O que é `sealed class`

Classe **base fechada**: só pode ser **subclassada no mesmo ficheiro** (ou biblioteca, consoante regras Dart 3).

Lista **fechada de variantes** — como um enum, mas cada variante pode ter **campos diferentes**:

| Variante | Significado | Dados extra |
|----------|-------------|-------------|
| `StartupDetailLoading` | A aguardar Firestore | nenhum |
| `StartupDetailNotFound` | Doc não existe / inválido | nenhum |
| `StartupDetailReady` | OK para mostrar ecrã | `data` |

Ninguém fora deste ficheiro pode criar `class StartupDetailError extends StartupDetailLoadState` — o compilador conhece **todas** as possibilidades.

---

### Para que serve no projeto

Stream do detalhe da startup (`startup_detail_service.dart`):

```dart
Stream<StartupDetailLoadState> watchDetail(String documentId) {
  return doc.snapshots().map((snap) {
    if (!snap.exists) return const StartupDetailNotFound();
    // ...
    return StartupDetailReady(detailViewDataFromFirestoreMap(...));
  });
}
```

A `StartupDetailScreen` reage ao estado:

```dart
if (state is StartupDetailNotFound) {
  return Text('Startup não encontrada.');
}
if (state is! StartupDetailReady) {
  return CircularProgressIndicator();  // Loading ou à espera
}
final detail = state.data;  // narrowing → StartupDetailReady
return _buildDetailScrollView(..., detail);
```

Evita spinner infinito quando o documento não existe — estado explícito **not found** vs **ready**.

---

### `sealed` vs `enum`

| | `enum` | `sealed class` |
|---|--------|----------------|
| Variantes | Valores fixos, sem campos distintos por variante (ou records limitados) | Subclasses com **campos próprios** (`Ready` tem `data`) |
| Exemplo no projeto | `ValuationPeriod`, `BalcaoOperacaoTipo` | `StartupDetailLoadState` |
| Exhaustividade | `switch` exhaustivo | `switch` exhaustivo (Dart 3+) |

`StartupDetailReady` precisa levar `StartupDetailViewData` — enum simples não modela isso tão bem.

---

### Relação com TypeScript que já viste

Parecido com `VerifyResetCodeResult` (união discriminada `{ ok: true, ... } | { ok: false, ... }`), mas em Dart com **classes** e `sealed` a garantir variantes fechadas.

---

### `final class` nas subclasses

```dart
final class StartupDetailReady extends StartupDetailLoadState { ... }
```

**`final class`** = esta subclasse **não pode ser estendida** de novo.

Combinado com `sealed` na base → hierarquia **rígida**: exactamente estas 3 variantes, sem herança extra.

---

### `switch` exhaustivo (vantagem principal)

Com `sealed`, o analisador sabe todas as subclasses:

```dart
switch (state) {
  case StartupDetailLoading():
    return spinner;
  case StartupDetailNotFound():
    return notFoundUi;
  case StartupDetailReady(:final data):
    return detailUi(data);
}
// sem default — se faltar caso, erro de compilação
```

Pattern matching Dart 3 (`case StartupDetailReady(:final data)`) desestrutura campos.

No ecrã usam `is` / `is!` — equivalente, menos pattern matching moderno.

---

### Resumo

| Palavra-chave | Papel |
|---------------|--------|
| **`sealed`** | Fecha a família de subclasses |
| **`final class`** | Subclasse não extensível |
| Variantes | Loading / NotFound / Ready |
| Objetivo | Estado de UI tipado para stream Firestore |

**Ideia:** `sealed` = “só estes estados existem”; o compilador ajuda a tratar **todos** — loading, erro, sucesso com dados.

## Catálogo — `_kickLogoPrefetchWhenListReady`

> Nome exacto no código: **`_kickLogoPrefetchWhenListReady`** (“Ready”, não “Read”).

### O código (`catalog_screen.dart`)

```dart
void _kickLogoPrefetchWhenListReady() {
  final fut = _loadFuture;
  if (fut == null) return;
  fut.then((list) {
    if (!mounted) return;
    StartupLogoPrecacheService.schedulePreloadForStartupList(context, list);
  });
}
```

Chamado em:

- `initState` — após `_loadFuture = _createLoadFuture()`
- `_updateChipSelection` — novo chip → nova lista
- `_reloadFromBackendIfNeeded` — busca debounced
- após backfill de captação no ledger

---

### O que faz (em português)

**“Quando a lista de startups estiver pronta, dispara prefetch dos logos em fundo.”**

| Passo | O quê |
|-------|--------|
| 1 | Espera `_loadFuture` completar (callable `listStartups` ou cache) |
| 2 | Verifica `mounted` (ecrã ainda activo) |
| 3 | Chama `StartupLogoPrecacheService.schedulePreloadForStartupList` |

**Kick** = “dar o pontapé inicial” — não espera (`await`); corre **em paralelo** com a UI.

---

### Por que existe (UX / performance)

Cards do catálogo mostram **logo** de cada startup (Firebase Storage / URL).

Sem prefetch:

- Utilizador vê lista → cada card baixa logo ao pintar → **spinners** ou placeholders.

Com prefetch:

- Assim que a lista chega, o app **aquece a cache de imagens** do Flutter (`imageCache`) **antes** ou **enquanto** o utilizador scrolla.
- Ao abrir Explorar ou ir ao detalhe, logos já podem estar em memória.

Comentário no ficheiro:

> *reduzir spinners mesmo indo já para Explorar*

---

### O que faz `schedulePreloadForStartupList`

(`startup_logo_precache_service.dart`)

```dart
static void schedulePreloadForStartupList(context, startups) {
  final copied = List<CatalogStartup>.from(startups);
  SchedulerBinding.instance.addPostFrameCallback((_) {
    if (!context.mounted) return;
    unawaited(preloadForStartupList(context, copied));
  });
}
```

Dupla proteção de timing:

1. **`Future.then`** — só depois da lista existir.
2. **`addPostFrameCallback`** — só depois do frame ( `MediaQuery` / contexto estável).
3. **`mounted`** — widget ainda na árvore.

`preloadForStartupList` → extrai `logoPath` de cada startup → `preloadStartupLogoBitmaps` (avatar widget).

---

### Fluxo

```mermaid
sequenceDiagram
  participant CS as CatalogScreen
  participant F as _loadFuture listStartups
  participant LP as StartupLogoPrecacheService
  participant Cache as Flutter imageCache
  CS->>F: _createLoadFuture()
  CS->>CS: _kickLogoPrefetchWhenListReady()
  F-->>CS: List CatalogStartup
  CS->>LP: schedulePreloadForStartupList
  LP->>Cache: preload logos em fundo
  CS->>CS: FutureBuilder mostra cards
```

Lista e prefetch **paralelos** — prefetch não bloqueia mostrar a lista.

---

### Quando **não** corre

- Modo teste com `startupsFutureForTesting` — em `_updateChipSelection` não chama prefetch ao mudar chip (filtro local).
- `_loadFuture == null` — retorno imediato.
- Widget desmontado antes do `.then` — `if (!mounted) return`.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Disparador de **pré-cache de logos** após lista carregar |
| Por quê? | Menos spinners nos avatares do catálogo |
| Bloqueia UI? | **Não** — `.then` + `unawaited` + fundo |
| Onde mais? | Balcão (`StartupCatalogListCache` + precache similar) |

**Ideia:** lista pronta → aquece imagens cedo; “kick” = arranca o trabalho sem esperar.

---

## Flutter — `InkWell`

Widget do Material Design que torna uma área **tocável** e mostra o **efeito ripple** (onda de tinta) ao toque.

### Onde aparece no catálogo

**1. Chip de filtro** (`catalog_screen.dart`, `_FilterChip`):

```dart
return Material(
  color: selected ? primary : unselected,
  borderRadius: BorderRadius.circular(999),
  child: InkWell(
    onTap: onSelected,
    borderRadius: BorderRadius.circular(999),
    child: Padding(
      padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 10),
      child: Text(label, ...),
    ),
  ),
);
```

**2. Card da startup** (`catalog_startup_card.dart`):

```dart
return Material(
  color: AppColors.themeCardSurface(theme),
  borderRadius: BorderRadius.circular(18),
  elevation: 3,
  child: InkWell(
    borderRadius: BorderRadius.circular(18),
    onTap: () async { /* abre StartupDetailScreen */ },
    child: Padding(...),
  ),
);
```

---

### O que faz cada parte

| Propriedade | Papel |
|-------------|--------|
| **`onTap`** | Callback quando o utilizador toca (equivalente a “clique”) |
| **`borderRadius`** | Recorta o ripple aos cantos arredondados — deve coincidir com o `Material` |
| **`child`** | Conteúdo visual (texto, card, etc.) |

O ripple **não** vem do `Padding` nem do `Text` — vem do **`InkWell`** dentro de um **`Material`**.

---

### Por que envolver em `Material`?

`InkWell` precisa de um **ancestral `Material`** (ou `Material` como pai directo) para “pintar” o efeito de tinta.

Sem `Material`:

- `onTap` pode funcionar, mas **não há ripple** (ou o Flutter avisa em debug).

Padrão típico no projeto:

```
Material (cor, borderRadius, elevation)
  └─ InkWell (onTap, borderRadius)
       └─ Padding / Column / Text
```

---

### `InkWell` vs `GestureDetector`

| | **`InkWell`** | **`GestureDetector`** |
|---|---------------|------------------------|
| Ripple Material | Sim | Não |
| Precisa de `Material` | Sim | Não |
| Uso típico | Botões, chips, cards clicáveis | Gestos genéricos (drag, long press sem feedback visual) |

Para UI Material (chips, cards, nav bar), o projeto prefere **`Material` + `InkWell`**.

---

### `borderRadius` duplicado

Tanto `Material` como `InkWell` recebem o mesmo `BorderRadius.circular(...)`.

- **`Material`** — forma e cor de fundo do chip/card.
- **`InkWell`** — o splash fica **dentro** desse contorno; sem isto, a onda seria rectangular e “vazaria” dos cantos.

No chip: `999` ≈ pílula (totalmente arredondada).

---

### Fluxo ao toque (chip)

```mermaid
flowchart LR
  A[Utilizador toca chip] --> B[InkWell.onTap]
  B --> C[Ripple animado]
  B --> D[onSelected callback]
  D --> E[_updateChipSelection]
  E --> F[setState + nova lista]
```

No card: `onTap` → prefetch do detalhe → `Navigator.push` → `StartupDetailScreen`.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Área tocável com **feedback visual** Material |
| Par obrigatório | Quase sempre **`Material`** por cima/fora |
| `onTap` | Função chamada no toque |
| `borderRadius` | Alinha ripple com cantos do widget |

**Ideia:** `InkWell` = “isto é clicável **e** o utilizador vê que tocou” — não é só detectar o toque, é **Material Design** com ripple.
