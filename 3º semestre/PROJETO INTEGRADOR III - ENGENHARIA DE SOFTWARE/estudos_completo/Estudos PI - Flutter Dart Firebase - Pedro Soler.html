## Dart / tema — `_modeFromStorage(stored) ?? ThemeMode.system`

No cursor (`theme_mode_controller.dart`, método `load`):

```dart
final prefs = await SharedPreferences.getInstance();
final stored = prefs.getString(ThemePreferenceKeys.storageKey);
final parsed = _modeFromStorage(stored) ?? ThemeMode.system;
_mode = parsed;
notifyListeners();
```

---

### Desmontar a linha

| Parte | Significado |
|-------|-------------|
| **`stored`** | `String?` lida do disco (`'light'`, `'dark'`, `'system'` ou `null`) |
| **`_modeFromStorage(stored)`** | Converte string → **`ThemeMode?`** |
| **`?? ThemeMode.system`** | Se o lado esquerdo for **`null`**, usa **`ThemeMode.system`** |
| **`final parsed`** | Resultado **nunca null** — sempre um `ThemeMode` válido |

---

### O operador `??` (null-coalescing)

```dart
a ?? b
```

= “usa **`a`** se não for `null`; senão usa **`b`**”.

Já visto noutros sítios do PI (`??`, `?.call`). Aqui garante **fallback** explícito.

---

### O que faz `_modeFromStorage`

```dart
ThemeMode? _modeFromStorage(String? value) {
  if (value == null) return null;
  switch (value) {
    case ThemePreferenceKeys.valueLight:   // 'light'
      return ThemeMode.light;
    case ThemePreferenceKeys.valueDark:    // 'dark'
      return ThemeMode.dark;
    case ThemePreferenceKeys.valueSystem:  // 'system'
      return ThemeMode.system;
    default:
      return null;  // string desconhecida / corrompida
  }
}
```

Retorno **`ThemeMode?`** (nullable) porque vários casos **não** têm modo válido.

---

### Quando cai no `?? ThemeMode.system`

| Situação | `stored` | `_modeFromStorage` | `parsed` |
|----------|----------|--------------------|----------|
| 1.ª abertura (nunca guardou) | `null` | `null` | **`system`** |
| Preferência válida “escuro” | `'dark'` | `ThemeMode.dark` | **dark** |
| String lixo / versão antiga | `'foo'` | `null` | **`system`** |
| Chave apagada manualmente | `null` | `null` | **`system`** |

Comentário no `load`:

> *se não houver valor, mantém ThemeMode.system*

Alinha com o valor inicial de **`_mode = ThemeMode.system`** antes do `load` — **padrão do sistema** (claro/escuro conforme SO).

---

### Depois da linha

```dart
_mode = parsed;
notifyListeners();
```

- Grava no estado do controller  
- **`notifyListeners()`** → `ListenableBuilder` no `main.dart` e ecrãs de aparência **reconstroem** com o tema certo  

Gravação inversa em **`setMode`** usa **`_storageStringFor(mode)`** → `'light'` / `'dark'` / `'system'`.

---

### Fluxo completo (persistência)

```mermaid
flowchart LR
  U[Utilizador escolhe tema] --> S[setMode + prefs.setString]
  S --> D[(SharedPreferences mescla_theme_mode)]
  A[App abre load] --> R[prefs.getString]
  R --> P[_modeFromStorage]
  P --> Q{null?}
  Q -->|sim| SYS[ThemeMode.system]
  Q -->|não| M[light/dark/system]
  SYS --> APP[MaterialApp themeMode]
  M --> APP
```

---

### `ThemeMode` (Flutter)

| Valor | Comportamento |
|-------|----------------|
| **`ThemeMode.light`** | Sempre tema claro |
| **`ThemeMode.dark`** | Sempre tema escuro |
| **`ThemeMode.system`** | Segue **brilho do SO** (`MediaQuery.platformBrightness`) |

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que faz a linha? | Lê preferência guardada ou **system** por omissão |
| Por que `??`? | `_modeFromStorage` pode devolver `null` |
| Default? | **`ThemeMode.system`** |
| Onde grava? | `SharedPreferences` chave `mescla_theme_mode` |

**Ideia:** `?? ThemeMode.system` = “**se não souberes o que estava guardado, segue o telemóvel**” — primeira instalação e dados inválidos tratados de forma segura.

## Flutter — `EdgeInsets.symmetric`

No cursor (`mescla_chart_reading_card.dart`):

```dart
Padding(
  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
  child: ConstrainedBox(...),
)
```

---

### O que é `.symmetric`

Construtor nomeado de **`EdgeInsets`** — define **espaço interno** (padding) **simétrico** em dois eixos:

| Parâmetro | Aplica em |
|-----------|-----------|
| **`horizontal`** | **Esquerda + direita** (mesmo valor) |
| **`vertical`** | **Cima + baixo** (mesmo valor) |

```dart
EdgeInsets.symmetric(horizontal: 10, vertical: 8)
// equivalente a:
EdgeInsets.fromLTRB(10, 8, 10, 8)
// left=10, top=8, right=10, bottom=8
```

---

### Visual (tooltip do gráfico)

```
┌─────────────────────────┐
│ ←10→  data/hora   ←10→  │  ↑ 8
│       valor             │  ↓ 8
└─────────────────────────┘
```

Dá “respiração” ao texto dentro do cartão flutuante sem calcular LTRB manualmente.

---

### Outros construtores `EdgeInsets`

| Construtor | Uso |
|------------|-----|
| **`EdgeInsets.all(16)`** | Os 4 lados iguais |
| **`EdgeInsets.symmetric(h: 10, v: 8)`** | Esquerda=direita, cima=baixo |
| **`EdgeInsets.fromLTRB(l, t, r, b)`** | Controlo **por lado** (ex. `fromLTRB(20, 8, 20, 28)`) |
| **`EdgeInsets.only(left: 72)`** | Só um ou alguns lados |

Usa **`symmetric`** quando esquerda=direita e/ou cima=baixo — caso **muito comum** em listas, chips, cards.

---

### Exemplos no PI

| Ficheiro | Padding |
|----------|---------|
| `mescla_chart_reading_card.dart` | `horizontal: 10, vertical: 8` |
| `mescla_period_pill_chip.dart` | `horizontal: 14, vertical: 8` |
| `mescla_bottom_nav_bar.dart` | `horizontal: 8, vertical: 10` |
| `catalog_screen.dart` | `symmetric(horizontal: 18, vertical: 10)` nos chips |

---

### `Padding` vs `margin`

| | **`Padding(padding: EdgeInsets...)`** | **`Container(margin: ...)`** |
|---|----------------------------------------|------------------------------|
| Espaço | **Dentro** do widget (around child) | **Fora** do widget (around self) |

Aqui o **`Padding`** envolve o conteúdo **dentro** do `Material` do cartão.

---

### `const`

`const EdgeInsets.symmetric(...)` — valores compile-time → widget **const** → menos rebuild work.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `.symmetric`? | Padding igual à esquerda/direita e cima/baixo |
| No cartão gráfico | 10 px laterais, 8 px vertical |
| Alternativa | `fromLTRB(10, 8, 10, 8)` — mais verboso |
| Por quê? | Legível quando o layout é simétrico |

**Ideia:** `.symmetric` = “**mesmo espaço dos dois lados**” — atalho para padding horizontal e vertical sem repetir números quatro vezes.

## Flutter — `fY` (eixo Y do gráfico)

No cursor (`valuation_evolution_chart_card.dart`):

```dart
String fY(double v) =>
    widget.formatYAxis?.call(v) ?? _defaultYAxisMillion(v);

// ...
children: List.generate(5, (i) {
  final v = vmax - i * (vmax - vmin) / 4;
  return FittedBox(
    child: Text(fY(v), ...),
  );
}),
```

---

### O que é `fY`

**Função local** dentro de `build` — nome curto:

| Letra | Significado |
|-------|-------------|
| **`f`** | **f**ormat (formatar) |
| **`Y`** | eixo **Y** (valores verticais do gráfico) |

**`fY(v)`** = “texto legível para o valor **`v`** no eixo vertical”.

Irmã: **`fT(v)`** — formata valor no **tooltip** (`formatTooltip` / `_defaultTooltipMillion`).

---

### Implementação

```dart
String fY(double v) =>
    widget.formatYAxis?.call(v) ?? _defaultYAxisMillion(v);
```

| Caminho | Quando | Exemplo saída |
|---------|--------|----------------|
| **`widget.formatYAxis?.call(v)`** | Pai injecta formatação | Balcão/Carteira: `formatBrl(v)` → `R$ 12,50` |
| **`_defaultYAxisMillion(v)`** | Detalhe startup (valuation) | `R$ 45M`, `R$ 1.2B` |

Padrão **estratégia injectável** — mesmo widget, eixo em **milhões** ou **reais**.

---

### Default valuation (`_defaultYAxisMillion`)

```dart
if (millions >= 1000) return 'R\$ ${(millions / 1000).toStringAsFixed(1)}B';
if (millions >= 100)  return 'R\$ ${millions.round()}M';
return 'R\$ ${millions.toStringAsFixed(1)}M';
```

Valores em **`series.valuationMillions`** — milhões de reais; rótulos compactos para caber em **52 px** de largura (`axisWidth`).

---

### De onde vem `v` na linha 189

Eixo Y com **5 marcas** (`List.generate(5, ...)`):

```dart
final v = vmax - i * (vmax - vmin) / 4;
```

| `i` | Posição |
|-----|---------|
| 0 | **topo** → `vmax` |
| 4 | **base** → `vmin` |

`vmin` / `vmax` vêm dos dados + padding 12% (e `vmin` não desce abaixo de 0 se todos os valores ≥ 0).

Comentário no código:

> *Cotações e saldos reais não devem forçar rótulos negativos no eixo*

---

### Onde `formatYAxis` é injectado

| Ecrã | Formatação |
|------|------------|
| **Startup detail** | Omite → `_defaultYAxisMillion` |
| **Balcão** | `formatYAxis: (v) => formatBrl(v)` |
| **Carteira** | `formatYAxis: formatBrl` |

Mesmo **`ValuationEvolutionChartCard`**, domínios diferentes.

---

### Por que função local (não método)

Definida **dentro de `build`** porque usa `widget.formatYAxis` e só serve **neste** eixo — evita repetir `widget.formatYAxis?.call(v) ?? ...` cinco vezes no `List.generate`.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `fY`? | Formata valor numérico → texto do eixo Y |
| `fY(v)`? | Rótulo na coluna esquerda do gráfico |
| Custom? | `formatYAxis` opcional no widget |
| Default? | Milhões / bilhões (`M` / `B`) |

**Ideia:** `fY` = **“como escrevo este número no eixo vertical?”** — abreviatura local; o gráfico fica reutilizável entre valuation e BRL.

## Flutter Test — `pumpWidget`

No cursor (`carteira_screen_test.dart`):

```dart
testWidgets('CarteiraScreen mostra título e saldo total', (tester) async {
  await tester.pumpWidget(
    const MaterialApp(
      home: Scaffold(
        body: CarteiraScreen(
          wrapWithSafeArea: false,
          usarFirebaseParaSessao: false,
        ),
      ),
    ),
  );

  expect(find.text('Carteira'), findsOneWidget);
  ...
});
```

---

### O que é

Método do **`WidgetTester`** (`tester`) que **monta** um widget na **árvore de teste** — equivalente a “correr a app” num ambiente **headless** (`flutter test`), sem dispositivo real.

| Peça | Papel |
|------|--------|
| **`testWidgets(...)`** | Define um teste de widget; recebe callback `(tester) async` |
| **`tester.pumpWidget(...)`** | Insere o widget raiz e **dispara um frame** de layout/pintura |
| **`expect(find..., ...)`** | Assert sobre o que aparece na árvore |

---

### O que acontece por baixo

```mermaid
flowchart LR
  T[tester.pumpWidget MaterialApp] --> B[Árvore de widgets de teste]
  B --> F[1 frame build/layout]
  F --> E[find.text expect]
```

1. Cria ambiente de teste Flutter  
2. Coloca **`MaterialApp`** (ou outro raiz) como root  
3. Executa **um** ciclo de frames (build → layout → paint)  
4. Ficas pronto para `find` / `tap` / `expect`

---

### Por que envolvem `MaterialApp` + `Scaffold`

`CarteiraScreen` usa **`Theme.of(context)`**, **`Navigator`**, textos Material, etc.

Fora de `MaterialApp`, muitos widgets **falham** ou ficam sem tema. Nos testes do PI:

```dart
MaterialApp(
  home: Scaffold(
    body: CarteiraScreen(usarFirebaseParaSessao: false, ...),
  ),
)
```

**`usarFirebaseParaSessao: false`** — dados mock, sem Firebase no VM de teste (comentário no ficheiro).

---

### `pumpWidget` vs `pumpAndSettle`

| Método | Frames | Quando |
|--------|--------|--------|
| **`pumpWidget`** | **1** (ou poucos) | Montagem inicial; UI estática |
| **`pump()`** | 1 frame extra | Após `tap`, animação curta |
| **`pumpAndSettle()`** | Até **acabar** animações/timers | Depois de navegação, `tap` que abre rota |

Exemplo no mesmo ficheiro:

```dart
await tester.tap(addBtn);
await tester.pumpAndSettle();  // espera animação + nova rota
expect(find.text('Quanto deseja investir?'), findsOneWidget);
```

Só **`pumpWidget`** no 1.º teste — ecrã estático, sem navegação.

---

### `find` depois do pump

```dart
find.text('Carteira')              // Texto exacto
find.textContaining('13.888')     // Substring
find.byType(CarteiraScreen)       // Tipo de widget
find.descendant(of: ..., matching: ...)  // Filho na árvore
```

Matchers: **`findsOneWidget`**, **`findsNWidgets(2)`**, **`findsNothing`**.

---

### Fluxo típico de teste widget no PI

1. **`pumpWidget`** — monta ecrã  
2. **`ensureVisible` / `dragUntilVisible`** — scroll se necessário  
3. **`tap`** — interacção  
4. **`pumpAndSettle`** — estabiliza UI  
5. **`expect`** — verifica resultado  

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `pumpWidget`? | Monta widget na árvore de **teste** |
| Quem é `tester`? | `WidgetTester` do `flutter_test` |
| Async? | Sim — `await tester.pumpWidget(...)` |
| vs app real? | Sem SO/dispositivo; VM headless |

**Ideia:** `pumpWidget` = **“mostra isto no teste”** — primeiro passo antes de procurar textos e simular toques.

---

## Flutter Test — `pumpAndSettle`

No cursor (`carteira_screen_test.dart`, ~45):

```dart
await tester.tap(addBtn);
await tester.pumpAndSettle();

expect(find.text('Quanto deseja investir?'), findsOneWidget);
```

---

### O que faz

Método do **`WidgetTester`** que chama **`pump()`** repetidamente até:

1. **Não haver** frames pendentes (animações, rebuilds), **e**
2. **Não haver** timers (`Future.delayed`, etc.) à espera — dentro de um limite de tempo

= “**espera a UI ficar estável**” antes do `expect`.

---

### Por que é preciso após `tap`

`tap` **não** espera animações nem navegação:

```dart
await tester.tap(addBtn);        // dispara onTap → Navigator.push
// sem pump: nova rota ainda não pintou
await tester.pumpAndSettle();    // corre frames até transição Mescla terminar
expect(find.text('Quanto deseja investir?'), findsOneWidget);
```

Sem **`pumpAndSettle`**, o `expect` pode correr **cedo demais** → **`findsNothing`** (falso negativo).

---

### Comparação rápida

| Método | Frames | Uso |
|--------|--------|-----|
| **`pumpWidget`** | 1 (montagem inicial) | Arranque do teste |
| **`pump()`** | **1** frame | Controlo fino, animação a meio |
| **`pumpAndSettle()`** | **Todos** até estabilizar | Depois de `tap`, `drag`, navegação |

Analogia:

- **`pump`** = um fotograma  
- **`pumpAndSettle`** = esperar o **GIF / vídeo** acabar  

---

### Onde aparece no `carteira_screen_test.dart`

| Teste | Antes do `pumpAndSettle` | O que estabiliza |
|-------|--------------------------|------------------|
| Adicionar Saldo | `tap` no botão | Push → `AdicionarFundosScreen` + fade/slide |
| Sacar | `tap` em Sacar | Push → fluxo saque |
| Chaves PIX | `dragUntilVisible` | Scroll + inércia |

O 1.º teste **não** usa `pumpAndSettle` — só monta ecrã estático.

---

### Parâmetros opcionais (referência)

```dart
await tester.pumpAndSettle([
  Duration(milliseconds: 100),  // duração mínima por frame (opcional)
  EnginePhase.sendSemanticsUpdate,
  Duration(seconds: 10),        // timeout — evita loop infinito
]);
```

Se animação **nunca** termina (stream infinito), o teste **timeout** — sinal de UI com timer contínuo.

---

### Fluxo tap → assert

```mermaid
sequenceDiagram
  participant T as tester
  participant UI as Árvore widgets
  T->>UI: tap(botão)
  T->>T: pumpAndSettle loop
  loop até idle
    T->>UI: pump frame
  end
  T->>T: expect(find.text ...)
```

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Espera UI **parar** de animar/atualizar |
| Quando? | Depois de **tap**, **drag**, navegação |
| vs `pumpWidget`? | `pumpWidget` monta; `pumpAndSettle` **espera** |
| Esquecer? | `expect` pode falhar — widget ainda não visível |

**Ideia:** `pumpAndSettle` = **“deixa a animação e a nova rota terminarem, depois verifico”**.

---

## Flutter Test — `group`, `testWidgets`, `ensureVisible`, `byType`, `descendant`

Foco: `startup_detail_screen_test.dart` (cursor ~112) e padrões do PI.

### `group` — agrupar testes

```dart

    testWidgets('Membros-Chave tem Saber mais...', (tester) async { ... });

### `testWidgets` — um teste de UI

```dart

  await tester.pumpWidget(...);
  expect(find.text('...'), findsOneWidget);
});
```

| Peça | Significado |
|------|-------------|
| **1.º arg** | Nome do teste (aparece no relatório) |
| **`tester`** | `WidgetTester` — pump, tap, find |
| **`async`** | Permite `await pumpWidget`, `pumpAndSettle` |

---

### `tester.ensureVisible` — widget no viewport

```dart

await tester.ensureVisible(find.text('Fazer pergunta'));
await tester.tap(find.text('Fazer pergunta'));
```

Garante que o alvo está **visível** e **tocável** (scroll automático se estiver fora do ecrã).

| Sem `ensureVisible` | Com `ensureVisible` |
|---------------------|---------------------|
| `tap` pode falhar (“off screen”) | Scroll até o widget aparecer |
| `warnIfMissed` / teste flaky | Toque fiável |

Usado em `carteira_screen_test` (+ Adicionar Saldo, Sacar), `create_account_screen`, etc.

**Nota:** `scrollUntilVisible` **desloca** a lista; `ensureVisible` **confirma** visibilidade antes do `tap` — no teste de “Nova pergunta” usam **ambos**.

---

### `find.byType` — procurar por classe

```dart
expect(find.byType(SegmentedButton<bool>), findsOneWidget);
scrollable: find.byType(Scrollable).first,
await tester.enterText(find.byType(TextField), '...');
```

Encontra widgets pelo **tipo Dart/Flutter** (`SegmentedButton`, `Scrollable`, `TextField`).

| Vantagem | Limite |
|----------|--------|
| Não depende do texto traduzido | Vários widgets do mesmo tipo → usar `.first` / `.last` |
| Bom para widgets sem texto | Preferir `find.text` quando o texto é estável |

---

### `find.descendant` — filho dentro de um ancestral

```dart
expect(
  find.descendant(
    of: find.byType(SegmentedButton<bool>),
    matching: find.text('Pública'),
  ),
  findsOneWidget,
);
```

Procura **`matching`** **dentro** da sub-árvore de **`of`**.

| Por quê aqui | Problema que evita |
|--------------|-------------------|
| Há vários `Text('Pública')` na app? | Improvável, mas o `SegmentedButton` **delimita** o contexto |
| Garante que “Pública” está **no** chip MFA | Não confunde com outro sítio |

Equivalente mental: “texto **Pública** que seja **filho** deste `SegmentedButton`”.

Relacionado em `carteira_screen_test`:

```dart
find.descendant(
  of: find.byType(CarteiraScreen),
  matching: find.byType(Scrollable),
);
```

= Scrollable **dentro** da CarteiraScreen.

---

### Fluxo do teste “Nova pergunta” (linhas 99–124)

```mermaid
flowchart TD
  A[pumpWidget + pumpAndSettle] --> B[scrollUntilVisible Fazer pergunta]
  B --> C[ensureVisible]
  C --> D[tap]
  D --> E[pumpAndSettle]
  E --> F[expect SegmentedButton]
  F --> G[descendant Pública / Privada]
```

---

### Resumo

| API | Função |
|-----|--------|
| **`group('Nome', () { ... })`** | Agrupa testes no relatório |
| **`testWidgets('...', (tester) async {})`** | Um cenário de widget test |
| **`tester.ensureVisible(find)`** | Scroll até widget visível para tap |
| **`find.byType(T)`** | Acha widget pelo tipo |
| **`find.descendant(of:, matching:)`** | Acha filho dentro de um ancestral |

**Ideia:** `group` organiza; `testWidgets` executa; `ensureVisible` prepara o toque; `byType` e `descendant` **localizam** widgets na árvore com precisão.

## Projeto — `pubspec.yaml` (dependências e configuração)

Ficheiro na **raiz** do repo Flutter — “manifesto” do pacote **`mescla_invest`**: nome, versão, dependências, assets, ferramentas de build.

Comando após alterar: **`flutter pub get`** (descarrega pacotes para `pubspec.lock`).

---

### Metadados do pacote

| Campo | Valor PI | Significado |
|-------|----------|-------------|
| **`name:`** | `mescla_invest` | Nome do pacote Dart — imports: `package:mescla_invest/...` |
| **`description:`** | Hub Mescla PUC | Texto descritivo (pub.dev / documentação) |
| **`publish_to: 'none'`** | — | **Não** publicar acidentalmente no pub.dev (app privado) |
| **`version:`** | `1.0.0+1` | `1.0.0` = versão visível; `+1` = build number (Android `versionCode`, iOS `CFBundleVersion`) |

---

### `environment` — versão do Dart

```yaml
environment:
  sdk: ^3.11.0
```

**`^3.11.0`** = compatível com Dart **≥ 3.11.0** e **< 4.0.0** (caret syntax).

O projeto exige Dart 3.11+ (records, pattern matching, etc.).

---

### `dependencies` vs `dev_dependencies`

| Secção | Quando entra no app | Exemplos PI |
|--------|---------------------|-------------|
| **`dependencies`** | **Runtime** — APK/IPA final | Firebase, `url_launcher` |
| **`dev_dependencies`** | Só **desenvolvimento/teste** | `flutter_test`, `flutter_lints` |

```yaml

Pastas com **`/`** no fim incluem **todos** os ficheiros dentro.

### Sintaxe de versão (`^`)

```yaml
cloud_firestore: ^6.2.0
```

**`^6.2.0`** = “>= 6.2.0 e < 7.0.0” — updates **minor/patch** automáticos no `pub get`, sem breaking major.

Versões **exactas** no lockfile: **`pubspec.lock`** (commit no git) — reprodutibilidade da equipa.

| **`flutter pub upgrade`** | Sobe deps dentro dos constraints `^` |
| **`flutter clean && flutter pub get`** | Reset cache build + deps |

  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

  const md = document.getElementById("md").textContent;

  renderer.code = function (code, lang) {
    if ((lang || "").trim() === "mermaid") {
      // Mermaid lê o texto literal; preservamos quebras e caracteres
      const safe = code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return '<pre class="mermaid">' + safe + "</pre>";
    }
    let html = code;
    try {
      if (lang && hljs.getLanguage(lang)) {
        html = hljs.highlight(code, { language: lang }).value;
      } else {
        html = hljs.highlightAuto(code).value;
      }
    } catch (e) {
      html = code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    return '<pre><code class="hljs">' + html + "</code></pre>";
  };

  marked.setOptions({
    renderer,
    gfm: true,
    breaks: false,
    headerIds: true,
    mangle: false,
  });
