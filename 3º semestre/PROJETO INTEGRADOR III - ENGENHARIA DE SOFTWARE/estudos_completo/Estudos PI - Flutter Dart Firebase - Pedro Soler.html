## Flutter / `url_launcher` — `LaunchMode`

Enum do pacote **`url_launcher`** que diz **como** abrir um `Uri` (link HTTP, LinkedIn, YouTube, etc.).

### Onde aparece no projeto

**LinkedIn do sócio** (`socio_detail_screen.dart`):

```dart
final ok = await launchUrl(uri, mode: LaunchMode.externalApplication);
```

**Vídeo demo da startup** (`startup_detail_screen.dart`):

```dart
final bool ok = await launchUrl(
  uri,
  mode: LaunchMode.externalApplication,
);
```

Em ambos: normaliza URL (`https://` se faltar), valida com `Uri.tryParse`, trata `ok == false` e `MissingPluginException`.

---

### O que é `launchUrl`

Função assíncrona do `url_launcher`:

```dart
Future<bool> launchUrl(Uri url, { LaunchMode mode = LaunchMode.platformDefault, ... })
```

| Retorno | Significado |
|---------|-------------|
| **`true`** | O SO conseguiu abrir o link |
| **`false`** | Não abriu (sem app/browser, URL bloqueada, etc.) |

O parâmetro **`mode`** escolhe **onde** o link abre.

---

### Valores principais de `LaunchMode`

| Modo | Comportamento |
|------|----------------|
| **`platformDefault`** | O SO decide (valor por omissão) |
| **`externalApplication`** | App **externa** — Chrome, Safari, app YouTube, app LinkedIn |
| **`inAppWebView`** | WebView **dentro** do app Flutter |
| **`inAppBrowserView`** | Browser “leve” in-app (Custom Tabs Android / SFSafariViewController iOS) |
| **`externalNonBrowserApplication`** | App externa que **não** é browser (mailto, tel, maps) |

---

### Por que `externalApplication` aqui

LinkedIn e vídeo demo são conteúdo **web / media** que o utilizador espera ver no **browser ou app nativo** (YouTube), não dentro do MesclaInvest.

Vantagens neste caso:

- Utilizador sai do app → experiência familiar (voltar com gesto do SO).
- Não precisas de manter WebView, cookies, player de vídeo in-app.
- Links longos / redirects funcionam como no sistema.

Comentário no código do sócio:

> *Abre o browser externo — padrão igual ao vídeo demo na startup.*

---

### Fluxo (`_openLinkedIn`)

```mermaid
flowchart TD
  A[Toca LinkedIn] --> B{URL válida?}
  B -->|não| C[SnackBar erro]
  B -->|sim| D[launchUrl externalApplication]
  D --> E{ok?}
  E -->|false| F[SnackBar não abriu]
  E -->|true| G[Browser/app externo]
  D --> H{MissingPluginException?}
  H -->|sim| I[SnackBar flutter clean]
```

Depois do `await`, verificam **`context.mounted`** / **`mounted`** antes de `SnackBar` — o utilizador pode ter saído do ecrã enquanto o SO abria o link.

---

### `LaunchMode` vs só `launchUrl()`

Sem `mode`, usa **`platformDefault`** — comportamento pode variar por plataforma/versão.

Com **`externalApplication`**, o comportamento fica **explícito** e **consistente** entre sócio e startup.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Enum: **onde** abrir o link |
| Valor usado | **`LaunchMode.externalApplication`** |
| Pacote | `url_launcher` |
| Por quê? | LinkedIn / YouTube fora do app Mescla |

**Ideia:** `LaunchMode` = “abrir **aqui** (in-app) ou **lá fora** (browser/app do sistema)?” — aqui escolhem **lá fora**.

## Dart — `part` / `part of`

Mecanismo para **dividir uma biblioteca Dart em vários ficheiros**, mantendo **um único escopo** (como se fosse um ficheiro gigante).

### Onde aparece no projeto

**Ficheiro principal** (`startup_detail_screen.dart`, linha 30):

```dart
part 'startup_detail_screen_widgets.dart';
```

**Ficheiro satélite** (`startup_detail_screen_widgets.dart`):

```dart
part of 'startup_detail_screen.dart';
```

Só estes dois ficheiros no repo usam `part` / `part of`.

---

### O que significa cada um

| Directiva | Onde | Papel |
|-----------|------|--------|
| **`part 'ficheiro.dart';`** | Biblioteca **principal** | “Este ficheiro faz parte **de mim**” |
| **`part of 'principal.dart';`** | Ficheiro **parte** | “Eu **pertenço** à biblioteca principal” |

O ficheiro principal tem os **`import`**; o `part` **não importa nada** — herda tudo do principal.

---

### Por que usar aqui

`StartupDetailScreen` + widgets privados ≈ **1300 linhas**. Dividiram:

| Ficheiro | Conteúdo |
|----------|----------|
| `startup_detail_screen.dart` | Ecrã, estado, Firestore, navegação, `_buildDetailScrollView` |
| `startup_detail_screen_widgets.dart` | Cards UI: `_MainInfoCard`, `_CaptureCard`, `_TeamCard`, `_NovaPerguntaDialog`, … |

Motivos práticos:

1. **Legibilidade** — ecrã vs blocos visuais separados.
2. **Privacidade** — widgets com `_` (privados) continuam **só visíveis dentro desta biblioteca**.
3. **Autoria** — comentário no `part`: widgets por Miguel; ecrã por Pedro.

---

### Escopo partilhado (o ponto-chave)

`part` + `part of` = **uma biblioteca**, não dois módulos independentes.

Consequências:

```dart
// startup_detail_screen.dart usa widgets do part:
_MainInfoCard(
  data: detail,
  onToggleWishlist: _toggleWishlist,
  ...
)

// startup_detail_screen_widgets.dart define:
class _MainInfoCard extends StatelessWidget { ... }
```

- `_MainInfoCard` começa com **`_`** → privado à biblioteca, mas o ecrã **pode** usar porque é o **mesmo** ficheiro lógico.
- Constantes/import do principal (ex. `AppColors`, `StartupDetailViewData`, `kMesclaDetailCardRadius`) estão disponíveis no `part` **sem** repetir `import`.

---

### `part` vs ficheiro normal com `import`

| | **`part` / `part of`** | **Ficheiro separado + `import`** |
|---|------------------------|----------------------------------|
| Bibliotecas | **1** | **2+** |
| `_Privado` entre ficheiros | Sim (mesma lib) | **Não** — `_Foo` só no próprio ficheiro |
| `import` | Só no principal | Em cada ficheiro |
| API pública | Um ponto de entrada | Pode exportar widgets públicos |

Se `_MainInfoCard` fosse ficheiro à parte, teria de ser **`MainInfoCard`** (público) ou passar tudo por parâmetros num wrapper público.

---

### Diagrama

```mermaid
flowchart TB
  subgraph lib ["Biblioteca startup_detail_screen.dart"]
    Main[startup_detail_screen.dart<br/>imports + StartupDetailScreen + State]
    Part[startup_detail_screen_widgets.dart<br/>_MainInfoCard, _TeamCard, ...]
    Main --- Part
  end
  Main -->|part| Part
  Part -->|part of| Main
```

Para o compilador: **um** `.dart` lógico; para ti: **dois** ficheiros no disco.

---

### Regras rápidas

1. Só o ficheiro **principal** declara `part '...';`.
2. Cada `part` começa com `part of 'principal.dart';` — **sem** `import` (excepto casos raros de `part` com imports deprecated).
3. Não confundir com **`export`** (re-exportar API de outro pacote).
4. Não confundir com **code generation** (`part 'x.g.dart';` para Freezed/json_serializable) — mesmo mecanismo, uso diferente.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `part`? | Inclui outro ficheiro na **mesma biblioteca** |
| O que é `part of`? | “Este ficheiro é pedaço de…” |
| Por quê no PI? | Ecrã grande + widgets privados `_…` noutro ficheiro |
| Alternativa | Widgets públicos noutro ficheiro com `import` |

**Ideia:** `part` = **partir o código em ficheiros** sem partir o **escopo** — privados e imports continuam partilhados.

---

Lista de **`ButtonSegment<T>`** — cada item = **um botão** na barra.

| Campo do `ButtonSegment` | Papel |
|--------------------------|--------|

### Como encaixa no widget completo

```mermaid
flowchart LR
  S[segments: 3 ButtonSegment] --> SB[SegmentedButton]
  SB --> SEL[selected: Set com _filter]
  SB --> ON[onSelectionChanged]
  ON --> ST[setState _filter]
  ST --> F[_filtered getter]
  F --> LV[ListView de Q&A]

| Propriedade | Função |
|-------------|--------|
| **`segments`** | Quais opções existem |
| **`selected`** | Qual(is) está(ão) activa(s) — aqui `Set` com **um** elemento |
| **`onSelectionChanged`** | Chamado ao tocar noutro segmento |

Ao mudar filtro → `_filter` muda → getter **`_filtered`** recalcula a lista (públicas, privadas ou ambas).

| `startup_detail_screen_widgets.dart` (`_NovaPerguntaDialog`) | `bool` | Pública / Privada (nova pergunta) |

### `segments` vs chips do catálogo

| | **`SegmentedButton.segments`** | **Chips `_FilterChip` (catálogo)** |

Em **`startup_detail_document.dart`** existe outro “segments” — **`List<String> segments`** ao fazer `split` de texto Firestore. É **partir uma string**, não UI. Contexto diferente.

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `segments`? | Lista de **`ButtonSegment`** = opções do botão segmentado |
| Onde no Q&A? | Filtro Todas / Públicas / Privadas (investidores) |
| Liga a quê? | `_filter` → `_filtered` → lista na tela |
| Tipo genérico | `StartupQaVisibilityFilter` (enum) |

**Ideia:** `segments` = **definição das abas/botões** do `SegmentedButton`; o utilizador escolhe uma, e o estado (`_filter`) filtra o que aparece em baixo.

## Dart — construtor privado `._()`

No cursor (`startup_catalog_list_cache.dart`):

```dart
class StartupCatalogListCache {
  StartupCatalogListCache._();
  static final StartupCatalogListCache instance = StartupCatalogListCache._();
  ...
}
```

### O que é `._()`

**Construtor privado** da classe.

Em Dart, identificadores que começam com **`_`** são **privados à biblioteca** (ficheiro `.dart`).

| Sintaxe | Significado |
|---------|-------------|
| `StartupCatalogListCache()` | Construtor **público** (qualquer código podia fazer `new ...`) |
| `StartupCatalogListCache._()` | Construtor **privado** — só código **neste ficheiro** pode chamar |

O **`()`** vazio = construtor sem parâmetros. O **`._`** antes dos parênteses = “nome” privado do construtor (pode ser `._internal()`, `._()`, etc.).

---

### Para que serve aqui (Singleton)

Padrão **singleton**: **uma única instância** partilhada em todo o app.

```dart
static final StartupCatalogListCache instance = StartupCatalogListCache._();
```

| Quem | O que faz |
|------|-----------|
| **`._()`** | Impede `StartupCatalogListCache()` fora deste ficheiro |
| **`instance`** | Ponto de acesso único — `StartupCatalogListCache.instance.fullList(...)` |

Sem construtor privado, outro ficheiro podia fazer:

```dart
StartupCatalogListCache(); // 2ª instância → cache duplicado, pedidos paralelos
```

Com `._()`:

- Só existe **`instance`**
- `_snapshot` e `_inFlight` são **globais de verdade** — Explorar, Balcão e dashboard partilham o mesmo cache

---

### Fluxo de uso no projeto

```dart
// catalog_screen.dart
StartupCatalogListCache.instance.fullList(_functionsService);

// dashboard — prefetch cedo
StartupCatalogListCache.instance.prefetch(service);

// após backfill / logout
StartupCatalogListCache.instance.clear();
```

Uma lista em memória, um pedido `listStartups()` em voo.

---

### Outros exemplos no repo

Mesmo padrão:

| Classe | Ficheiro |
|--------|----------|
| `BiometricAuthService._()` + `instance` | `biometric_auth_service.dart` |
| `StartupLogoPrecacheService._()` | `startup_logo_precache_service.dart` (só métodos `static`, nem expõe `instance`) |
| `MesclaNavigationPrefetch._()` | `mescla_navigation.dart` |
| `SimulatedWalletService._()` | `simulated_wallet_service.dart` |

`abstract final class` + `._()` = “classe utilitária, não instanciar”.

---

### `_()` no construtor vs `_` noutros sítios

| Uso | Exemplo | Significado |
|-----|---------|-------------|
| Construtor | `Foo._()` | Só este ficheiro cria `Foo` |
| Campo/método | `_snapshot` | Privado à biblioteca |
| Classe | `_FilterChip` | Widget privado ao ficheiro |

Todos partilham a regra: **`_` = privado ao `.dart`**.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| `._()` é o quê? | Construtor **privado** |
| Por quê? | **Singleton** — uma instância via `instance` |
| Quem pode chamar? | Só código no mesmo ficheiro |
| Alternativa pública | `StartupCatalogListCache()` — **não existe** de propósito |

**Ideia:** `._()` = “**não cries instâncias à vontade**”; usa `StartupCatalogListCache.instance` para partilhar o cache do catálogo.

## Dart / Firestore — `Stream` e `QuerySnapshot`

Foco: `startup_catalog_service.dart` (`watchStartups`) e uso na UI (`StreamBuilder`).

### O código no PI

```dart
Stream<List<CatalogStartup>> watchStartups() {
  return _db.collection(kFirestoreStartupsCollection).snapshots().map(
    (QuerySnapshot<Map<String, dynamic>> snapshot) {
      final List<CatalogStartup> out = [];
      for (final QueryDocumentSnapshot<Map<String, dynamic>> doc in snapshot.docs) {
        final CatalogStartup? item = catalogStartupFromFirestoreMap(doc.id, doc.data());
        if (item != null) out.add(item);
      }
      out.sort(...);
      prewarmLogoUrlCache(out.map((s) => s.logoPath));
      return out;
    },
  );
}
```

---

### O que é `Stream<T>`

Sequência **assíncrona** de valores ao longo do tempo — não é “uma resposta e acabou”.

| | **`Future<T>`** | **`Stream<T>`** |
|---|-----------------|-----------------|
| Eventos | **1** valor (ou erro) | **0, 1 ou muitos** valores |
| Analogia | Pedir pizza → recebes **uma** caixa | Rádio → vais ouvindo **várias** músicas |
| Firestore | `.get()` — lê **uma vez** | `.snapshots()` — lê e **continua a ouvir** |

`Stream<List<CatalogStartup>>` = o serviço emite **listas** sempre que o Firestore avisa que algo mudou na coleção.

---

### O que é `QuerySnapshot`

“Fotografia” de uma **query/coleção** no Firestore **num instante**, mais **atualizações** quando documentos entram, saem ou mudam.

Tipo genérico: **`QuerySnapshot<Map<String, dynamic>>`**

- **`Map<String, dynamic>`** = campos de cada documento (JSON-like)

Campos úteis:

| Membro | Significado |
|--------|-------------|
| **`snapshot.docs`** | Lista de documentos neste snapshot |
| **`snapshot.size`** | Quantos docs |
| **`snapshot.metadata`** | Info (ex.: se veio do cache local) |

Cada item de `docs` é **`QueryDocumentSnapshot<Map<String, dynamic>>`**:

| Método/campo | Significado |
|--------------|-------------|
| **`doc.id`** | ID do documento Firestore |
| **`doc.data()`** | Mapa de campos |
| **`doc.exists`** | (em doc único) se existe |

---

### Cadeia Firestore → UI

```mermaid
flowchart LR
  FS[(Firestore startups/*)] --> SN[snapshots]
  SN --> ST[Stream QuerySnapshot]
  ST --> MAP[.map → List CatalogStartup]
  MAP --> SB[StreamBuilder / listener]
  SB --> UI[Lista Explorar]
  FS -.->|doc muda| SN
```

1. **`collection(...).snapshots()`** — subscreve a coleção
2. Firestore emite novo **`QuerySnapshot`**
3. **`.map(...)`** converte para **`List<CatalogStartup>`** (domínio da app)
4. UI reconstrói com dados frescos

Comentário no serviço:

> *cada vez que um documento muda, a lista é reemitida*

---

### `QuerySnapshot` vs `DocumentSnapshot`

| Tipo | Origem | Uso no PI |
|------|--------|-----------|
| **`QuerySnapshot`** | `.collection(...).snapshots()` | Várias startups, ledger, posições |
| **`DocumentSnapshot`** | `.doc(id).snapshots()` | Um doc — detalhe startup, saldo carteira |

Exemplo doc único (`startup_detail_service.dart`):

```dart
.doc(documentId).snapshots().map((DocumentSnapshot<Map<String, dynamic>> snap) { ... })
```

Mesma ideia de **stream**, mas **um** documento em vez de **coleção**.

---

### Onde a UI consome

**1. Serviço transformado** — `watchStartups()` → `Stream<List<CatalogStartup>>`

**2. `StreamBuilder` directo** (`catalog_screen.dart`) — ouve `preco_token` ao vivo:

```dart
StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
  stream: FirebaseFirestore.instance
      .collection(kFirestoreStartupsCollection)
      .snapshots(),
  builder: (context, fsSnap) {
    if (fsSnap.hasData) {
      // merge docs Firestore com lista da callable
    }
    ...
  },
)
```

**3. Carteira** — `SimulatedWalletService.watchPositions` devolve `Stream<QuerySnapshot<...>>`; `carteira_screen.dart` usa vários `StreamBuilder`.

Propriedades comuns do `AsyncSnapshot` no builder:

| | Significado |
|---|-------------|
| **`hasData`** | Chegou pelo menos um evento |
| **`data`** | Último valor (`QuerySnapshot` ou lista mapeada) |
| **`connectionState`** | `waiting`, `active`, `done` |

---

### `Stream` + `.map` (transformação)

`.map` **não** altera o Firestore — só transforma cada evento:

```
QuerySnapshot  →  List<CatalogStartup>
     ↑                    ↑
  tipo Firestore      tipo da UI
```

Ordenação, filtro de `null`, `prewarmLogoUrlCache` ficam **no cliente**, no `.map`.

---

### `Stream` vs callable + cache

No Explorar actual, a lista principal vem da **callable** `listStartups` + **`StartupCatalogListCache`** (`Future`).

`StartupCatalogService.watchStartups()` e o **`StreamBuilder`** no catálogo servem para **dados ao vivo** (ex. preço token) — padrão **Future para carga inicial**, **Stream para patches em tempo real**.

---

### Resumo

| Conceito | O que é |
|----------|---------|
| **`Stream<T>`** | Fluxo contínuo de valores assíncronos |
| **`QuerySnapshot`** | Snapshot de uma coleção/query Firestore |
| **`.snapshots()`** | Liga coleção → `Stream<QuerySnapshot>` |
| **`snapshot.docs`** | Documentos neste momento |
| **`QueryDocumentSnapshot`** | Um doc: `id` + `data()` |

**Ideia:** `Stream` = **ficar ouvindo**; `QuerySnapshot` = **o pacote de documentos** que o Firestore manda cada vez que algo muda na query.

## Catálogo — `prewarmLogoUrlCache`

Função em `startup_logo_avatar.dart` que **pré-aquece URLs** dos logos (caminho Storage → link HTTPS) **antes** dos widgets precisarem.

### O código

```dart
void prewarmLogoUrlCache(Iterable<String?> paths) {
  for (final p in paths) {
    if (p != null && p.trim().isNotEmpty) {
      unawaited(_memoDownloadUrl(p.trim()));
    }
  }
}
```

Chamada em `startup_catalog_service.dart` após mapear a lista Firestore:

```dart
prewarmLogoUrlCache(out.map((s) => s.logoPath));
```

Também é chamada **dentro** de `preloadStartupLogoBitmaps` (precache de bitmaps com `BuildContext`).

---

### Duas camadas de cache de logo

| Camada | Função | O que guarda |
|--------|--------|--------------|
| **URL** | `prewarmLogoUrlCache` / `_memoDownloadUrl` | `logoPath` → `Future<String>` (HTTPS) |
| **Bitmap** | `preloadStartupLogoBitmaps` / `StartupLogoPrecacheService` | Imagem decodificada em `ImageCache` |

Fluxo típico:

```mermaid
flowchart LR
  P[logoPath gs:// ou path Storage] --> U[prewarmLogoUrlCache]
  U --> F[_logoUrlCache Future String]
  F --> B[preloadStartupLogoBitmaps precacheImage]
  B --> I[ImageCache]
  I --> A[StartupLogoAvatar]
```

**Prewarm** = arranca o pedido à **Firebase Storage** (`getDownloadURL`) cedo, para quando o avatar pedir a URL o `children` já está resolvido ou a caminho.

---

### `_memoDownloadUrl` (por baixo)

```dart
final Map<String, Future<String>> _logoUrlCache = {};
final Map<String, String> _resolvedUrlStringCache = {};

Future<String> _memoDownloadUrl(String trimmed) {
  final sync = _resolvedUrlStringCache[trimmed];
  if (sync != null) return Future<String>.value(sync);
  return _logoUrlCache.putIfAbsent(trimmed, () async {
    final url = await _resolveStorageUrl(trimmed);
    _resolvedUrlStringCache[trimmed] = url;
    return url;
  });
}
```

- **`putIfAbsent`** — um pedido de rede **por path** por sessão (vários avatars partilham o mesmo `Future`).
- **`unawaited`** — dispara sem bloquear; corre em fundo.

Comentário no avatar:

> *o download URL é resolvido uma única vez por sessão e reutilizado em todos os widgets/telas*

---

### Relação com `_kickLogoPrefetchWhenListReady`

| Momento | O quê |
|---------|--------|
| Lista Firestore (`watchStartups`) | `prewarmLogoUrlCache` — só **URLs** |
| Lista callable + dashboard | `StartupLogoPrecacheService` — URLs **+** bitmaps |

Ambos reduzem spinners; `prewarmLogoUrlCache` é mais leve (não precisa de `BuildContext`).

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que faz? | Inicia resolução Storage→URL para vários `logoPath` |
| Precisa de context? | **Não** |
| Bloqueia? | **Não** (`unawaited`) |
| Onde? | `startup_logo_avatar.dart`; chamado no stream do catálogo |

**Ideia:** aquecer o **link** antes de pintar o **pixel** — primeiro URL, depois imagem.

## Dart — tipo `Object` / `Object?`

No cursor (`startup_detail_document.dart`):

```dart
bool _isAbsentFirestoreValue(Object? v) { ... }

Object? pickFirstDocumentField(Map<String, dynamic> d, List<String> keys) { ... }

Object? estruturaSocietariaRawFromDocument(Map<String, dynamic> d) {
  return pickFirstDocumentField(d, kFieldEstruturaSocietariaAliases);
}
```

### O que é `Object`

Em Dart, **`Object`** é o tipo **raiz** — **todos** os tipos (exceto `Null` em alguns contextos) são subtipos de `Object`.

| Tipo | Significado |
|------|-------------|
| **`Object`** | Qualquer valor **não nulo** |
| **`Object?`** | Qualquer valor **ou** `null` |

---

### Por que usar aqui (Firestore / JSON)

Campos de documentos Firestore ou respostas de callables podem vir em **formatos diferentes**:

- `String` — texto ou estrutura societária numa linha
- `List` — array de sócios
- `Map` — objeto aninhado
- `num` — percentagem numérica
- `null` — ausente

Enquanto **não sabes** o formato exacto, **`Object?`** é o tipo honesto: “veio alguma coisa da API, ainda vou inspecionar”.

---

### Padrão: receber `Object?` → inspecionar com `is`

```dart
Object? estruturaSocietariaRawFromDocument(...)  // pode ser String, List, Map, null...

// Mais abaixo em enrichSociosListPreservingFields:
if (sociosRaw is Map) {
  _expandSociosMapTopLevel(...);
} else if (sociosRaw is List) {
  for (final Object? item in sociosRaw) { ... }
} else if (sociosRaw is String) {
  _splitEstruturaStringIntoLines(...);
}
```

**Type promotion:** depois de `v is String`, o compilador trata `v` como `String` naquele bloco.

`_isAbsentFirestoreValue(Object? v)` centraliza “está vazio?” para `null`, `String` vazia, `List`/`Map` vazios.

---

### `Object?` vs `dynamic`

| | **`Object?`** | **`dynamic`** |
|---|---------------|---------------|
| Type safety | Precisas de `is` / cast antes de usar métodos específicos | Compilador não verifica |
| Uso no PI | Parsing Firestore/callable | Evitado onde possível |

Preferem **`Object?` + `is`** a **`dynamic`** solto — menos erros em runtime.

---

### `Map<String, dynamic>` vs `Object?`

- **`Map<String, dynamic>`** — já sabes que é um mapa; valores internos ainda são `dynamic`/`Object?`.
- **`Object?`** num campo — pode ser **mapa, lista, string, número**, etc.

`pickFirstDocumentField` devolve **`Object?`** porque o primeiro alias encontrado pode ser qualquer tipo válido Firestore.

---

### Outros sítios no catálogo

| Ficheiro | Exemplo |
|----------|---------|
| `startup_catalog_functions_service.dart` | `_qaListFromApi(Object? raw)`, `_parseAccessPayload(Object? raw)` |
| `startup_detail_service.dart` | `_chartInstantFromFirestoreValue(Object? v)` |
| Cloud Functions callable | `.call<Map<Object?, Object?>>` — payload genérico da ponte nativa |

Mesmo raciocínio: JSON/Firestore **não tipado** até fazeres parse.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| `Object`? | Tipo raiz — qualquer valor |
| `Object?`? | Qualquer valor ou `null` |
| Por quê no PI? | Campos Firestore/callable com formato variável |
| Depois? | `is String` / `is List` / `is Map` para tratar cada caso |

**Ideia:** `Object?` = “**não sei ainda o tipo concreto**”; o código seguinte **descobre** com `is` e normaliza para a UI.

## Catálogo — `pushEnriched`

Função **local** (closure) dentro de **`enrichSociosListPreservingFields`** — ponto único para **adicionar um sócio à lista de saída** já **enriquecido**.

### Definição

```dart
List<Map<String, dynamic>>? enrichSociosListPreservingFields(...) {
  final List<Map<String, dynamic>> out = <Map<String, dynamic>>[];

  void pushEnriched(Map<String, dynamic> original) {
    out.add(enrichSocioMapPreservingFields(original));
  }
  ...
}
```

| Peça | Papel |
|------|--------|
| **`out`** | Lista final de sócios normalizados |
| **`pushEnriched`** | “Recebe mapa bruto → enriquece → faz `out.add`” |
| **`enrichSocioMapPreservingFields`** | Copia o mapa Firestore e garante `nome` + `porcentagem` para a UI legada |

---

### O que `enrichSocioMapPreservingFields` acrescenta

```dart
Map<String, dynamic> enrichSocioMapPreservingFields(Map<String, dynamic> original) {
  final Map<String, dynamic> m = Map<String, dynamic>.from(original);
  final String nome = socioNomeParaExibicao(m);
  final String pct = socioParticipacaoParaExibicao(m);
  if (nome.isNotEmpty) {
    m.putIfAbsent('nome', () => nome);
    m.putIfAbsent('Nome', () => nome);
  }
  if (pct.isNotEmpty) {
    m.putIfAbsent('porcentagem', () => pct);
  }
  return m;
}
```

**Preserva todos os campos originais** do Firestore — só **adiciona** aliases que a UI antiga espera (`nome`, `Nome`, `porcentagem`).

Comentário do ficheiro:

> *cada item é o objeto Firestore **com todos os campos**, mais `nome` + `porcentagem`*

---

### Por que existe (padrão callback)

O Firestore de sócios pode vir como **Map aninhado**, **List**, **String**, vários aliases (`estrutura_societaria`, …).

Helpers como **`_expandSociosMapTopLevel`** e **`_appendEstruturaSocietariaFallback`** não escrevem directamente em `out` quando têm um **mapa de pessoa** — chamam **`pushEnriched`**:

```dart
void _expandSociosMapTopLevel(
  Map<dynamic, dynamic> sociosRaw,
  void Function(Map<String, dynamic>) pushEnriched,  // ← callback
  List<Map<String, dynamic>> stringSink,
) {
  ...
  pushEnriched(merged);           // mapa aninhado
  pushEnriched(<String, dynamic>{ // chave → percentagem escalar
    'Nome': keyLabel,
    'nome': keyLabel,
    'Porcentagem de Participação': v,
    ...
  });
}
```

Vantagens:

1. **Um só sítio** onde mapas entram em `out` com enriquecimento garantido.
2. Helpers **não precisam** de conhecer `enrichSocioMapPreservingFields` — só chamam o callback.
3. Nome **`pushEnriched`** = “empurrar para a lista **já enriquecido**”.

---

### O teu cursor (linha ~223)

Quando `sociosRaw` é **List** e cada item é um **Map plano** (sem listas/mapas aninhados):

```dart
pushEnriched(
  Map<String, dynamic>.from(
    item.map((Object? k, Object? v) => MapEntry(k.toString(), v)),
  ),
);
```

Converte chaves para `String` → **`pushEnriched`** → **`enrichSocioMapPreservingFields`** → **`out`**.

Se o mapa for **aninhado**, delega em `_expandSociosMapTopLevel(..., pushEnriched, out)`.

---

### Caminho alternativo (sem `pushEnriched`)

Linhas **String** usam **`_parseSociosStringLineToMaps(item, out)`** — escrevem **directo** em `out` porque já montam `{ Nome, nome, porcentagem }` à mão (regex `45%`, parênteses, etc.).

| Entrada | Caminho |
|---------|---------|
| **Map** de sócio | `pushEnriched` → `enrichSocioMapPreservingFields` |
| **String** `"João Silva 45%"` | `_parseSociosStringLineToMaps` → `out.add` directo |

No fim: **`_dedupeSociosMaps(out)`** remove duplicados por nome.

---

### Fluxo

```mermaid
flowchart TD
  A[sociosRaw Firestore] --> B{tipo?}
  B -->|Map| C[_expandSociosMapTopLevel]
  B -->|List Map| D[pushEnriched]
  B -->|List String| E[_parseSociosStringLineToMaps]
  B -->|String| E
  C --> D
  D --> F[enrichSocioMapPreservingFields]
  F --> G[out.add]
  G --> H[_dedupeSociosMaps]
```

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Closure local: mapa → enriquecer → adicionar a `out` |
| Por quê? | DRY — todos os mapas passam pelo mesmo enriquecimento |
| Tipo do parâmetro nos helpers | `void Function(Map<String, dynamic>) pushEnriched` |
| UI ganha | Campos Firestore **+** `nome` / `porcentagem` compatíveis |

**Ideia:** `pushEnriched` = **porta de entrada única** para sócios que já vêm como mapa — normaliza antes de entrar na lista final.

---

## Flutter — `MediaQuery`

Widget **herdado** na árvore que expõe **informação do ecrã/dispositivo** via `BuildContext`.

No cursor (`startup_logo_avatar.dart`):

```dart
int _decodedPixelSideForLogo(BuildContext context) {
  final dpr = MediaQuery.devicePixelRatioOf(context);
  return (kStartupLogoRasterLogicalSidePx * dpr).round().clamp(1, 8192);
}
```

---

### O que é

O Flutter envolve a app (normalmente em `MaterialApp`) num **`MediaQuery`** que desce a **todos** os descendentes.

Com **`context`**, lês propriedades do dispositivo **sem** APIs nativas directas.

APIs modernas (Flutter 3.10+):

| Método | Devolve |
|--------|---------|
| **`MediaQuery.sizeOf(context)`** | Largura/altura da área útil |
| **`MediaQuery.devicePixelRatioOf(context)`** | **DPR** — pixels físicos por pixel lógico |
| **`MediaQuery.paddingOf(context)`** | Safe area (notch, barra de estado) |
| **`MediaQuery.viewInsetsOf(context)`** | Teclado sobreposto |
| **`MediaQuery.platformBrightnessOf(context)`** | Claro/escuro do SO |

Forma antiga: `MediaQuery.of(context).size` — equivalente, API mais verbosa.

---

### DPR (device pixel ratio) no logo

| Conceito | Exemplo |
|----------|---------|
| **Pixel lógico (dp)** | `size = 48` no widget — layout Flutter |
| **DPR** | 2.0 (iPhone), 3.0 (muitos Android flagship) |
| **Pixel físico** | `64 × 2.0 = 128` px reais decodificados |

```dart
const double kStartupLogoRasterLogicalSidePx = 64;  // lado lógico fixo
final dpr = MediaQuery.devicePixelRatioOf(context);
final decodedSide = (64 * dpr).round();  // lado em pixels físicos
```

**Por quê:** `ResizeImage` e `precacheImage` usam **`decodedSide`** como chave na **`ImageCache`**.

Se preload e avatar usarem **o mesmo** `decodedSide`, o bitmap pré-carregado **bate certo** — logo aparece sem novo download.

Comentário no ficheiro:

> *precacheImage … use a mesma chave na ImageCache — assim o pré-carregar aparece já no card*

---

### Onde entra no fluxo de logos

```mermaid
flowchart LR
  MQ[MediaQuery DPR] --> CALC[64 × dpr → decodedSide]
  CALC --> PRE[precacheImage ResizeImage]
  CALC --> AV[StartupLogoAvatar Image]
  PRE --> IC[ImageCache mesma chave]
  AV --> IC
```

`preloadStartupLogoBitmaps(context, ...)` **precisa** de `context` com `MediaQuery` — daí em `StartupLogoPrecacheService`:

> *Garante MediaQuery disponível … addPostFrameCallback*

---

### `context` válido

`MediaQuery.devicePixelRatioOf(context)` **exige**:

1. Widget **montado** na árvore (`context.mounted`)
2. Ancestral **`MediaQuery`** (normalmente via `MaterialApp`)

Se chamar demasiado cedo (ex. `initState` antes do 1.º frame), pode falhar — por isso o precache usa **`addPostFrameCallback`**.

---

### Outros usos no PI

| Ficheiro | Uso |
|----------|-----|
| `adicionar_fundos_screen.dart` | `MediaQuery.sizeOf(dialogContext).width` — largura do diálogo |
| `theme_preference_keys.dart` | Comentário: tema segue `MediaQuery.platformBrightness` |

No catálogo, o uso principal de **`MediaQuery`** é **DPR dos logos**, não layout de ecrã.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Info do ecrã/dispositivo via `context` |
| Uso aqui | **`devicePixelRatioOf`** → pixels físicos do logo |
| Por quê? | Alinhar **preload** e **exibição** na `ImageCache` |
| Cuidado | `context` montado + após frame quando precache |

**Ideia:** `MediaQuery` = “**como é o ecrã onde estou?**” — aqui traduz tamanho lógico (64) em resolução real (64 × DPR) para cache de imagem funcionar.

## Dart — `Set`

Coleção de valores **únicos** — cada elemento aparece **no máximo uma vez**.

No cursor (`dashboard_screen.dart`):

```dart
final Set<int> _activatedMainTabs = <int>{0};
```

Comentário no ficheiro:

> *Abas já ativadas pelo usuário … As não ativadas ficam leves para reduzir custo de inicialização.*

---

### Sintaxe

| Escrita | Significado |
|---------|-------------|
| **`Set<int>`** | Tipo: conjunto de `int` |
| **`<int>{0}`** | Set literal com o elemento `0` |
| **`.add(i)`** | Insere (ignora duplicado) |
| **`.contains(i)`** | `true` se `i` já está no conjunto |

Equivalente conceptual a “lista sem repetições” com teste de pertença rápido.

---

### Uso no dashboard (lazy tabs)

Barra inferior: 0 Início, 1 Carteira, 2 Balcão, 3 Catálogo, 4 Perfil.

**Problema:** construir **todas** as tabs no arranque (Carteira + Firestore, Balcão, Catálogo…) é pesado.

**Solução:** só **instanciar** o ecrã da tab quando o utilizador **já a abriu** pelo menos uma vez.

```dart
// initState / mudança de tab
_activatedMainTabs.add(_mainNavIndex);

// tabBodies do MesclaMainShell
_activatedMainTabs.contains(1)
    ? CarteiraScreen(...)
    : const SizedBox.shrink(),
_activatedMainTabs.contains(2)
    ? BalcaoTabScreen(...)
    : const SizedBox.shrink(),
...
```

| Tab | Antes de abrir | Depois de abrir |
|-----|----------------|-----------------|
| 0 Início | Sempre construída (home) | — |
| 1–4 | `SizedBox.shrink()` (vazio) | Widget real (`CarteiraScreen`, …) |

Início com **`{0}`** — tab Início activa desde o primeiro frame. Deeplink pode activar outra tab em `initState` com `.add(_mainNavIndex)`.

---

### Fluxo

```mermaid
flowchart TD
  A[Utilizador toca tab i] --> B[_onMainNavIndexChanged]
  B --> C[_activatedMainTabs.add i]
  C --> D[setState]
  D --> E{contains i?}
  E -->|sim| F[Monta ecrã pesado]
  E -->|não| G[SizedBox.shrink]
```

Prefetch extra ao mudar tab (ex. tab 3 → `StartupCatalogListCache.fullList`) corre **antes** ou junto com `.add`.

---

### `Set` vs `List`

| | **`Set<T>`** | **`List<T>`** |
|---|--------------|---------------|
| Duplicados | Não | Sim |
| Ordem | Inserção (implementação LinkedHashSet em Dart) | Indexada |
| Uso típico | “Já vi / já activou?” | Sequência ordenada |

Aqui não importa ordem das tabs — só **pertence ou não** ao conjunto de “já activadas”.

---

### Outro `Set` no projeto — `SegmentedButton`

```dart
selected: <StartupQaVisibilityFilter>{_filter},
onSelectionChanged: (Set<StartupQaVisibilityFilter> next) {
  setState(() => _filter = next.first);
},
```

API Material 3 usa **`Set<T>`** para seleção (suporta multi-seleção; aqui só **um** elemento → `next.first`).

Mesmo tipo **`Set`**, propósito diferente: **estado de UI** vs **tabs lazy** no dashboard.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `Set`? | Coleção **sem duplicados** |
| `<int>{0}`? | Set com o inteiro 0 |
| Por quê no dashboard? | Só construir tabs **já visitadas** |
| Operações usadas | `.add`, `.contains` |

**Ideia:** `Set` = “**quais tabs já foram despertadas?**” — evita pagar o custo de Carteira/Balcão/Catálogo até o utilizador ir lá.

## Flutter — `FutureBuilder` e `future:`

No cursor (`dashboard_screen.dart`, saudação):

```dart
return FutureBuilder<String>(
  future: _ensurePrimeiroNomeSaudacaoFuture(user),
  builder: (context, snap) {
    final primeiro = snap.hasData
        ? snap.data!
        : (_primeiroNomeSaudacaoSync(user) ?? '…');
    return Text('$etiquetaTemporal, $primeiro', style: labelCaps);
  },
);
```

**`future:`** = parâmetro **nomeado** do `FutureBuilder` — o **`Future`** cuja conclusão a UI deve **esperar e reagir**.

---

### O que é `Future<T>`

Promessa assíncrona de **um** valor `T` (ou erro) no futuro.

| Estado | UI típica |
|--------|-----------|
| A correr | Loading / placeholder |
| Concluído com sucesso | `snap.hasData` → `snap.data` |
| Erro | `snap.hasError` |

Exemplos no dashboard:

- `Future<String>` — primeiro nome para “BOM DIA, PEDRO”
- `Future<List<CatalogStartup>>` — catálogo via cache
- `Future<Map<String, BalcaoStartupMarketStats?>>` — stats de mercado

---

### Papel do `future:`

O `FutureBuilder`:

1. **Subscreve** ao `Future` passado em `future:`
2. Quando termina, chama **`builder`** de novo com `AsyncSnapshot` (`snap`)
3. Tu desenhas o widget conforme `snap.hasData`, `connectionState`, etc.

```mermaid
flowchart LR
  F[future: Future T] --> FB[FutureBuilder]
  FB -->|completa| B[builder context snap]
  B --> W[Text / ListView / ...]
```

**`future:`** não é palavra-chave Dart especial — é só o **nome do parâmetro** do construtor `FutureBuilder`.

---

### Cache do nome (`_ensurePrimeiroNomeSaudacaoFuture`)

```dart
Future<String> _ensurePrimeiroNomeSaudacaoFuture(User user) {
  if (_saudacaoPrimeiroNomeUid != user.uid ||
      _saudacaoPrimeiroNomeFuture == null) {
    _saudacaoPrimeiroNomeUid = user.uid;
    _saudacaoPrimeiroNomeFuture = _resolverPrimeiroNomeSaudacaoCaps(user);
  }
  return _saudacaoPrimeiroNomeFuture!;
}
```

**Por quê:** cada `rebuild` do `FutureBuilder` criaria um **novo** `Future` → pedido Firestore **repetido**.

Guardar o **mesmo** `Future` no estado:

- 1.º build → inicia resolução
- rebuilds seguintes → **reutilizam** o mesmo `Future` já em voo ou concluído

Comentário no estado: *“evita novo Future a cada rebuild”*.

Enquanto espera, mostra nome **síncrono** (`_primeiroNomeSaudacaoSync`) ou `'…'`.

---

### Outros `future:` no mesmo ficheiro

**Catálogo no Início** (dentro de `StreamBuilder` de posições):

```dart
FutureBuilder<List<CatalogStartup>>(
  future: StartupCatalogListCache.instance.fullList(_catalogService),
  builder: (context, catSnap) { ... },
)
```

**Stats de mercado** nos cards:

```dart
FutureBuilder<Map<String, BalcaoStartupMarketStats?>>(
  future: _dashboardMarketStatsForInvestidasDocs(posicoesVisiveis),
  builder: (context, mktFut) { ... },
)
```

`_dashboardMarketStatsForInvestidasDocs` também **cacheia** o `Future` por ~2 min (campo `_dashboardMarketStatsFuture`) — mesmo padrão que o nome.

---

### `FutureBuilder` vs `StreamBuilder`

| | **`future:`** | **`stream:`** |
|---|---------------|---------------|
| Widget | `FutureBuilder` | `StreamBuilder` |
| Eventos | **Um** resultado | **Vários** ao longo do tempo |
| Exemplo dashboard | Nome, catálogo, market stats | `watchPositions(uid)` |

No Início: **Stream** das posições + **Future** do catálogo + **Future** das stats — camadas combinadas.

---

### `snap` útil no `builder`

| Propriedade | Uso |
|-------------|-----|
| **`snap.hasData`** | Já há valor |
| **`snap.data`** | Valor `T` |
| **`snap.connectionState`** | `waiting`, `done`, … |
| **`snap.hasError`** | Falhou |

Padrão loading:

```dart
if (catSnap.connectionState == ConnectionState.waiting &&
    !catSnap.hasData &&
    catSnap.error == null) {
  return CircularProgressIndicator();
}
```

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `future:`? | O **`Future`** que o `FutureBuilder` observa |
| Por quê? | UI assíncrona sem `await` no `build` |
| Cuidado | Não criar **novo** `Future` em todo rebuild — cache no `State` |
| Par irmão | `stream:` no `StreamBuilder` |

**Ideia:** `future:` = “**quando isto terminar**, reconstrói o `builder` com o resultado” — ponte entre async (rede/Firestore) e widgets Flutter.

## Flutter — `super.key`

No cursor (`dashboard_hero_monthly_saldo_bars.dart`):

```dart
class DashboardHeroMonthlySaldoBars extends StatefulWidget {
  const DashboardHeroMonthlySaldoBars({
    super.key,
    required this.series,
    required this.formatarBr,
    ...
  });
```

---

### O que é

**`super.key`** passa o parâmetro opcional **`key`** do construtor do teu widget para o **construtor da classe pai** (`StatefulWidget` → `Widget`).

Equivalente antigo (antes do “super parameters” em Dart 2.17+):

```dart
const DashboardHeroMonthlySaldoBars({Key? key, ...}) : super(key: key);
```

Forma moderna e mais curta:

```dart
const DashboardHeroMonthlySaldoBars({super.key, ...});
```

Quem instancia pode fazer:

```dart
DashboardHeroMonthlySaldoBars(
  key: const ValueKey('hero-bars'),
  series: dados,
  formatarBr: _money,
)
```

Se não passar `key`, fica **`null`** — válido na maioria dos casos.

---

### Para que serve `Key` no Flutter

`Key` identifica um widget na **árvore** quando o Flutter reconcilia filhos (rebuild, listas, troca de tabs).

| Sem key estável | Com key estável |
|-----------------|-----------------|
| Flutter pode **reutilizar** `State` errado | Preserva ou recria o `State` certo |
| Lista reordenada → estado “salta” de item | `ValueKey(id)` mantém estado por item |

Exemplos no PI:

```dart
BalcaoTabScreen(key: ValueKey<int>(_balcaoNavCount), ...)
CarteiraScreen(key: const ValueKey<String>('carteira_valuation_period'), ...)
```

**`super.key`** só **encaminha** a key que o pai passou — não inventa uma.

---

### Por que quase todos os widgets têm `super.key`

Convenção Flutter 3:

- Permite ao **pai** controlar identidade do widget
- Mantém construtor **`const`** quando os outros campos também são const
- Não obriga cada widget a declarar `Key? key` manualmente

Widgets **sem** parâmetros:

```dart
const MesclaDetailHeader({super.key});
```

---

### `super.key` vs outros `super.*`

| Sintaxe | Papel |
|---------|--------|
| **`super.key`** | Passa `key` ao `Widget` |
| **`super.initState()`** | Chama `initState` do `State` pai (`SingleTickerProviderStateMixin`, etc.) |
| **`super.build(context)`** | Raro em `State`; em `InheritedWidget` / overrides |

Só **`key`** usa o padrão `super.key` no construtor; lifecycle usa `super.metodo()`.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `super.key`? | Repassa `key` opcional ao construtor do `Widget` pai |
| Obrigatório? | Não — pode omitir na instanciação |
| Por quê incluir? | Boas práticas + permitir `ValueKey` quando precisares |
| Relação com `State` | Key estável ajuda Flutter a associar o `State` correcto |

**Ideia:** `super.key` = “aceito uma **identidade opcional** de quem me criar e entrego-a ao Flutter” — uma linha, zero lógica extra.

---

## Dart — `assert`

Verificação de **pré-condição** em tempo de desenvolvimento: “isto **tem** de ser verdade; se não for, há bug de programação”.

No cursor (`dashboard_monthly_saldo_bars.dart`):

```dart
List<DashboardMesSaldo> dashboardMontarBarrasUltimosMesesSaldo({
  ...
  int numeroMeses = 12,
}) {
  assert(numeroMeses >= 1);
  ...
}
```

---

### Sintaxe

```dart
assert(condição);
assert(condição, 'mensagem opcional');
```

| | Comportamento |
|---|----------------|
| **Debug** (`flutter run`, testes) | Se `condição` é **false** → excepção, stack trace |
| **Release** (`flutter build --release`) | **`assert` é removido** — zero custo em produção |

Não é para erros que o **utilizador** possa causar (saldo inválido, rede) — isso é `if` + mensagem / `throw` controlado.

---

### Por que `assert(numeroMeses >= 1)` aqui

O `for` faz `indiceMes < numeroMeses`. Com `numeroMeses == 0` ou negativo:

- O loop não corre → lista vazia **sem** aviso óbvio, ou
- Lógica de datas fica estranha.

O **`assert`** documenta o contrato da função: “quem chama deve passar pelo menos 1 mês”. Em debug, falha **cedo** e aponta o caller errado.

---

### Outros exemplos no PI

**Construtor** (`mescla_main_shell.dart`):

```dart
const MesclaMainShell({...})
  : assert(tabBodies.length == kMesclaMainTabCount);
```

Garante que o shell tem **exactamente** 5 bodies alinhados com a bottom nav — erro na **criação** do widget, não no runtime do utilizador.

**Dashboard / gráficos** (`dashboard_screen.dart`, `carteira_screen.dart`):

```dart
assert(pontos >= 2);
```

Interpolação de amostras temporais precisa de ≥ 2 pontos.

**Eixo de datas** (`chart_date_axis_ticks.dart`):

```dart
assert(n >= 1);
```

---

### `assert` vs `if` + `throw`

| | **`assert`** | **`if (!ok) throw ...`** |
|---|--------------|---------------------------|
| Activo em release | **Não** | **Sim** |
| Público-alvo | Programador / testes | Utilizador / API inválida |
| Exemplo | `numeroMeses >= 1` interno | “Sessão expirada” |

---

### Comentário sobre assert do Flutter framework

Em `startup_detail_screen_widgets.dart` há nota sobre libertar `TextEditingController` em `dispose` para evitar assert interno **`_dependents.isEmpty`** do Flutter — isso é **assert do SDK**, não do vosso código; significa que o widget foi desmontado com dependências ainda activas.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Checagem só em **modo debug** |
| Falha quando? | Condição falsa → crash com stack |
| Release? | Ignorado |
| Uso no PI | Contratos de API interna (tamanhos, contagens) |

**Ideia:** `assert` = “**isto nunca devia falhar** se o código estiver correcto” — rede de segurança para ti durante desenvolvimento, não para o investidor em produção.

---

## Flutter — `Listenable` e `listenable:`

No cursor (`modo_aparencia_screen.dart`):

```dart
ListenableBuilder(
  listenable: themeModeController,
  builder: (context, _) {
    final group = themeModeController.themeMode;
    return Material(
      ...
      // tiles Claro / Escuro / Padrão com check na opção activa
    );
  },
),
```

**`listenable:`** = parâmetro do **`ListenableBuilder`**: o objecto que **notifica** quando algo muda, para o Flutter **reconstruir** o `builder`.

---

### O que é `Listenable`

Interface Flutter (fundação): “objeto que pode ter **ouvintes**”.

| Método | Papel |
|--------|--------|
| **`addListener(callback)`** | Regista quem quer ser avisado |
| **`removeListener(callback)`** | Remove ouvinte |

Implementações comuns:

| Classe | Uso no PI |
|--------|-----------|
| **`ChangeNotifier`** | `ThemeModeController` |
| **`ValueNotifier<T>`** | `_carteiraScrollStartupsTick` no dashboard |
| **`Animation`** | `AnimatedBuilder` (mesma ideia) |

Quando o estado muda, chamas **`notifyListeners()`** (ChangeNotifier) ou alteras **`.value`** (ValueNotifier) → ouvintes são chamados.

---

### `ThemeModeController` (fonte do `listenable`)

```dart
class ThemeModeController extends ChangeNotifier {
  ThemeMode _mode = ThemeMode.system;
  ThemeMode get themeMode => _mode;

  Future<void> setMode(ThemeMode mode) async {
    if (_mode == mode) return;
    _mode = mode;
    notifyListeners();  // ← dispara rebuild dos ListenableBuilder
    // grava SharedPreferences...
  }
}

final ThemeModeController themeModeController = ThemeModeController();
```

`ChangeNotifier` **é** um `Listenable` — por isso pode ir em **`listenable: themeModeController`**.

---

### O que faz `ListenableBuilder`

```mermaid
flowchart LR
  T[themeModeController] -->|notifyListeners| LB[ListenableBuilder]
  LB --> B[builder reconstrói]
  B --> UI[check na opção certa]
  TAP[onTap setMode] --> T
```

1. Subscreve ao **`listenable`** no `initState` interno
2. Quando há notificação → chama **`builder(context, child)`** de novo
3. Só reconstrói a **sub-árvore** dentro do builder (não o ecrã inteiro, salvo se o pai também rebuildar)

Comentário no ficheiro:

> *reconstrói a lista ao mudar a preferência*

Sem isto, ao tocar “Escuro”, `setMode` gravaria no disco mas o **visto (check)** ficaria na opção antiga até sair e voltar ao ecrã.

---

### Onde mais no PI

**`main.dart`** — raiz do app:

```dart
ListenableBuilder(
  listenable: themeModeController,
  builder: (context, _) {
    return MaterialApp(
      themeMode: themeModeController.themeMode,
      ...
    );
  },
)
```

Muda tema → **`MaterialApp`** inteiro reconstrói com claro/escuro.

**`perfil_screen.dart`** — sublinha “Claro / Escuro / Sistema” na lista.

**`carteira_screen.dart`** — padrão alternativo:

```dart
scrollStartupsSectionTick?.addListener(_onScrollStartupsTick);
```

Mesma ideia (`Listenable`), mas **manual** em vez de `ListenableBuilder`.

---

### `listenable:` vs `setState` vs `StreamBuilder`

| Mecanismo | Quando |
|-----------|--------|
| **`setState`** | Estado **local** do `StatefulWidget` |
| **`listenable:` + ListenableBuilder** | Estado **partilhado** (singleton, controller global) |
| **`stream:`** | Eventos contínuos (Firestore) |

Tema é **global** (`themeModeController`) — vários ecrãs ouvem o **mesmo** objecto sem passar callback por toda a árvore.

---

### Parâmetro `child` (opcional)

`ListenableBuilder` pode receber **`child:`** fixo — passado ao `builder` como 2.º arg para não reconstruir subtree estática. No PI usam só `builder: (context, _)`.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `Listenable`? | Interface “avisa-me quando mudar” |
| O que é `listenable:`? | Qual objecto o `ListenableBuilder` escuta |
| Quem notifica? | `notifyListeners()` ou `ValueNotifier.value =` |
| Exemplo PI | Tema claro/escuro/sistema |

**Ideia:** `listenable:` = “**rebuilda isto** quando aquele objecto disser que mudou” — reacção a estado global sem `setState` no pai.

---

## Dart / Flutter — `void Function(CatalogStartup)? onInvestir`

No cursor (`perfil_screen.dart`):

```dart
/// Repassado a [FavoritosScreen] — "Investir Agora" abre o Balcão (ex.: [DashboardScreen]).
final void Function(CatalogStartup)? onInvestir;
```

Parâmetro **opcional** do widget: callback invocado quando o utilizador escolhe **investir** numa startup concreta.

---

### Desmontar o tipo

| Parte | Significado |
|-------|-------------|
| **`void`** | A função **não devolve** valor |
| **`Function(CatalogStartup)`** | Recebe **um** argumento: [`CatalogStartup`](lib/catalog/models/catalog_startup.dart) |
| **`?` no fim** | Tipo **nullable** — pode ser **`null`** (callback não fornecido) |

Equivalente com **`typedef`** (estilo mais legível):

```dart
typedef OnInvestirCallback = void Function(CatalogStartup);
final OnInvestirCallback? onInvestir;
```

---

### Padrão: callback / injecção

`PerfilScreen` **não sabe** como abrir o Balcão — só **repassa** o callback:

```dart
FavoritosScreen(onInvestir: widget.onInvestir)
```

Quem **define** o comportamento é o **pai** com estado global das tabs:

```dart
// dashboard_screen.dart
PerfilScreen(
  onInvestir: _abrirBalcaoParaStartup,
)

void _abrirBalcaoParaStartup(CatalogStartup startup) {
  setState(() {
    _balcaoStartup = startup;
    _balcaoNavCount++;
    _mainNavIndex = 2;        // tab Balcão
    _activatedMainTabs.add(2);
  });
}
```

**Desacoplamento:** Perfil/Favoritos/Catálogo não importam lógica de navegação do shell — só chamam `onInvestir?.call(startup)`.

---

### Cadeia completa no PI

```mermaid
flowchart TD
  D[DashboardScreen _abrirBalcaoParaStartup]
  D --> P[PerfilScreen onInvestir]
  D --> C[CatalogScreen onInvestir]
  P --> F[FavoritosScreen]
  F --> CARD[CatalogStartupCard]
  C --> CARD
  CARD --> DET[StartupDetailScreen Investir Agora]
  DET -->|Navigator.pop startup| CARD
  CARD -->|onInvestir?.call result| D
  D --> B[BalcaoTabScreen initialMesaStartup]
```

1. Utilizador abre detalhe (card favorito ou catálogo)
2. Toca **“Investir Agora”** → detalhe faz `Navigator.pop(startup)`
3. Card recebe `result` → **`onInvestir?.call(result)`**
4. Callback sobe até **`DashboardScreen`** → muda para tab **Balcão** com startup seleccionada

---

### Chamada segura: `?.call`

```dart
if (result != null) {
  onInvestir?.call(result);
}
```

| Sintaxe | Efeito |
|---------|--------|
| **`onInvestir?.call(result)`** | Só chama se `onInvestir != null` |
| **`onInvestir!(result)`** | Forçaria — crash se null |
| **`onInvestir(result)`** | Mesmo que `.call` quando não null |

Em **testes** ou ecrãs isolados, `onInvestir` pode ficar **`null`** — fluxo de detalhe funciona, só não abre Balcão.

---

### Onde aparece

| Widget | Papel |
|--------|--------|
| **`DashboardScreen`** | Implementa `_abrirBalcaoParaStartup` |
| **`PerfilScreen`** | Repassa a Favoritos |
| **`CatalogScreen`** | Repassa aos cards |
| **`FavoritosScreen`** | Repassa aos cards |
| **`CatalogStartupCard`** | Chama após `pop` do detalhe |

No detalhe, o botão usa **`VoidCallback onInvest`** local (`() => _redirectToBalcao`) — pop com `CatalogStartup`; o card traduz isso em **`onInvestir`**.

---

### `void Function(T)?` vs `ValueChanged<T>`

Flutter define:

```dart
typedef ValueChanged<T> = void Function(T value);
```

`void Function(CatalogStartup)?` = **`ValueChanged<CatalogStartup>?`** — mesmo conceito; o PI usa a forma explícita em vários sítios.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Callback opcional “investir nesta startup” |
| Argumento | `CatalogStartup` escolhida |
| Quem implementa? | `DashboardScreen` → abre Balcão |
| Por quê optional? | Testes / widgets sem shell |
| Como chama? | `onInvestir?.call(startup)` |

**Ideia:** `onInvestir` = **fio** que liga “Investir Agora” no catálogo/favoritos à **tab Balcão** do dashboard, sem acoplar ecrãs filhos ao shell.

## Flutter — `fit:` e `BoxFit`

No cursor (`perfil_screen.dart`, avatar):

```dart
Image.network(
  url,
  width: 72,
  height: 72,
  fit: BoxFit.cover,
  errorBuilder: ...
)
```

**`fit:`** = parâmetro de **`Image`**, **`Image.file`**, **`FittedBox`**, **`DecorationImage`**, etc. — diz **como encaixar** a imagem na caixa `width` × `height`.

---

### O que é `BoxFit`

Enum que controla escala e recorte quando a **proporção** da imagem ≠ proporção da caixa.

| Valor | Comportamento |
|-------|----------------|
| **`BoxFit.cover`** | **Preenche** a caixa toda; pode **cortar** bordas |
| **`BoxFit.contain`** | **Cabe** inteira na caixa; pode ficar **letterbox** (faixas vazias) |
| **`BoxFit.fill`** | Estica para preencher — **distorce** |
| **`BoxFit.fitWidth`** | Largura = caixa; altura proporcional (pode cortar verticalmente) |
| **`BoxFit.fitHeight`** | Altura = caixa; largura proporcional |
| **`BoxFit.scaleDown`** | Como `contain`, mas **não amplia** além do tamanho original |
| **`BoxFit.none`** | Tamanho intrínseco; alinhado no canto |

---

### Por que `BoxFit.cover` no avatar

Avatar: **`72×72`** + **`ClipOval`** (círculo).

Fotos reais são retangulares (4:3, 16:9, portrait…).

| Se usasses | Resultado |
|------------|-----------|
| **`cover`** | Círculo **cheio**, sem faixas; corta o que sobra |
| **`contain`** | Foto inteira visível, mas **bordas vazias** dentro do círculo |
| **`fill`** | Círculo cheio mas rosto **achatado** |

**`cover`** = padrão para avatares, logos quadrados, splash fullscreen.

Mesmo padrão em `startup_logo_avatar.dart`, `socio_detail_screen.dart`, `create_account_screen.dart`.

---

### Outros `BoxFit` no PI

| Ficheiro | `fit` | Motivo |
|----------|-------|--------|
| **`mescla_brand_logo.dart`** | `contain` | Logo **inteiro** visível, sem cortar texto |
| **`mescla_detail_header.dart`** | `contain` | Marca no header |
| **`carteira_app_bar_logo.dart`** | `scaleDown` | Não upscale pixelado |
| **`valuation_evolution_chart_card.dart`** | `scaleDown` | Ícone pequeno no gráfico |
| **`splash_screen.dart`** | `cover` | Vídeo/imagem fullscreen |

Comentário em `mescla_brand_logo.dart`:

> *BoxFit.contain dentro do mesmo SizedBox mantém o tamanho visual*

---

### Diagrama (`cover` vs `contain`)

```
Caixa 72×72          cover              contain
┌────────┐      ┌────────┐         ┌────────┐
│        │      │ ██████ │         │  ┌──┐  │
│        │      │ ██████ │         │  │██│  │
│        │      │ ██████ │         │  └──┘  │
└────────┘      └────────┘         └────────┘
                (corta)            (letterbox)
```

---

### `fit:` vs `width` / `height`

- **`width` / `height`** — tamanho da **caixa** onde a imagem é desenhada
- **`fit:`** — como a **bitmap** se adapta **dentro** dessa caixa

Sem `fit`, o default de `Image` é **`BoxFit.scaleDown`** (só encolhe se for grande demais).

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `fit:`? | Modo de encaixe da imagem na caixa |
| Valor no avatar | **`BoxFit.cover`** |
| Por quê? | Círculo cheio, sem distorcer |
| Alternativa logo | **`contain`** — ver tudo, sem crop |

**Ideia:** `fit:` = “**estica, encolhe ou corta** a imagem para caber aqui?” — no avatar, **corta** (`cover`) para o círculo ficar bonito.

## Flutter / Material 3 — `theme.colorScheme.surfaceContainerHigh`

No cursor (`perfil_screen.dart`, `_PerfilConfigRow`):

```dart
final iconCircle = theme.brightness == Brightness.light
    ? const Color(0xFFE5E7EB)
    : theme.colorScheme.surfaceContainerHigh;
```

Cor do **círculo atrás do ícone** (Lista de Desejos, Segurança, etc.) no **tema escuro**.

---

### O que é

Parte do **`ColorScheme`** do **Material Design 3**: família de tons **`surface*`** para **elevação por cor** (não só sombra).

Em vez de branco/cinza fixo, o Flutter gera **degraus** de superfície a partir da **seed** do tema:

| Token M3 | Papel (mais claro → mais “elevado”) |
|----------|-------------------------------------|
| **`surface`** | Fundo base do ecrã |
| **`surfaceContainerLowest`** | Container mais subtil |
| **`surfaceContainerLow`** | … |
| **`surfaceContainer`** | Meio |
| **`surfaceContainerHigh`** | Container **um pouco mais destacado** |
| **`surfaceContainerHighest`** | Container **mais destacado** da família |

**`surfaceContainerHigh`** = cinza/tom ligeiramente **mais claro** que `surface` no dark — bom para **chips, círculos de ícone, áreas secundárias**.

---

### Por que só no escuro aqui

| Modo | Cor do círculo do ícone |
|------|-------------------------|
| **Claro** | `#E5E7EB` fixo (Figma / design manual) |
| **Escuro** | **`surfaceContainerHigh`** (harmonia M3 automática) |

No bloco CONTA do mesmo ecrã usam **`surfaceContainerHighest`** (um degrau **acima**) para o cartão inteiro:

```dart
final fundoConta = theme.brightness == Brightness.light
    ? _cinzaConta
    : theme.colorScheme.surfaceContainerHighest;
```

Hierarquia visual no dark:

```
surface (fundo app)
  └─ surfaceContainerHighest (bloco CONTA)
       └─ surfaceContainerHigh (círculo do ícone) — ligeiramente diferente
```

---

### Centralizado em `AppColors`

`themeMutedSurface` no escuro **também** usa `surfaceContainerHigh`:

```dart
static Color themeMutedSurface(ThemeData theme) {
  if (theme.brightness == Brightness.light) {
    return const Color(0xFFF3F4F6);
  }
  return theme.colorScheme.surfaceContainerHigh;
}
```

Outros tokens no PI:

| Helper / sítio | Token dark |
|----------------|------------|
| `themeMutedSurface` | `surfaceContainerHigh` |
| `searchFieldFillForTheme` | `surfaceContainerHighest` |
| `progressTrack` | `surfaceContainerHighest` |
| Bloco CONTA Perfil | `surfaceContainerHighest` |
| Círculo ícone Perfil | `surfaceContainerHigh` |

Comentário em `app_colors.dart`:

> *Harmonia com a tela Perfil (Material 3: surface / onSurface)*

---

### Como obter

```dart
final theme = Theme.of(context);
final cor = theme.colorScheme.surfaceContainerHigh;
```

Vem do **`ThemeData`** / **`ColorScheme.fromSeed`** definido em `buildMesclaLightTheme` / `buildMesclaDarkTheme` — muda automaticamente com claro/escuro.

---

### `surfaceContainerHigh` vs cores soltas

| | **Token M3** | **`Color(0xFF...)` fixo** |
|---|--------------|---------------------------|
| Dark/light | Adapta com o scheme | Manual por modo |
| Consistência | Alinhado com resto M3 | Risco de “halo” ou contraste errado |
| PI | Preferido no **dark** | Muitos **light** ainda usam hex do Figma |

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Tom de **superfície elevada** (M3) |
| Onde no Perfil? | Fundo circular do ícone (dark) |
| vs `Highest`? | **High** = menos contraste; **Highest** = bloco maior (CONTA) |
| Por quê? | Dark mode legível sem branco puro |

**Ideia:** `surfaceContainerHigh` = “**cinza um pouco mais claro que o fundo**” — destaca o ícone no Perfil escuro mantendo harmonia Material 3.

## Segurança — biometria antes de mudar MFA (`seguranca_privacidade_screen.dart` 183–187)

Trecho em **`_onMfaDeliveryChanged`** (trocar canal do código MFA: e-mail ↔ SMS):

```dart
final BiometricAuthOutcome prova =
    await BiometricAuthService.instance.authenticate(
  localizedReason:
      'Confirme com a biometria para alterar o canal do código MFA.',
  skipPluginAvailabilityPrecheck: true,
);
if (prova != BiometricAuthOutcome.success) {
  ScaffoldMessenger.of(context).showSnackBar(
    SnackBar(content: Text(BiometricAuthService.messageForOutcome(prova))),
  );
  return;  // não altera MFA
}
```

---

### Contexto (quando corre)

Só **depois** de verificar:

```dart
final bool prefBio = await UserFirestoreService.fetchBiometricEnabled();
final bool inscrito = await BiometricEnrollmentStorage.isEnrolledForUser(uidMfa);
if (prefBio && inscrito) {
  // ← biometria aqui
}
```

| Condição | Significado |
|----------|-------------|
| **`prefBio`** | Utilizador activou biometria nas definições Mescla (Firestore) |
| **`inscrito`** | Este aparelho guardou o UID em `BiometricEnrollmentStorage` (Keychain/Keystore) |

Se biometria **não** está activa → salta o bloco e segue para alterar MFA (com outros passos: telefone, senha, etc.).

**Mesmo padrão** em `_onTwoFactorChanged` (ligar/desligar 2FA) — só muda o texto de `localizedReason`.

---

### O que faz `authenticate`

Wrapper do pacote **`local_auth`** (`BiometricAuthService`):

1. (Opcional) verifica se o dispositivo suporta biometria
2. Chama o **SO** — Face ID, Touch ID, digital Android, etc.
3. Devolve **`BiometricAuthOutcome`** — nunca envia dados biométricos ao servidor

Comentário no serviço:

> *Nunca enviamos dados biométricos para o servidor — só um resultado local sim/não*

---

### Parâmetros desta chamada

| Parâmetro | Valor | Papel |
|-----------|-------|--------|
| **`localizedReason`** | Texto PT sobre MFA | Mensagem no diálogo **nativo** do SO |
| **`skipPluginAvailabilityPrecheck: true`** | Pula `deviceCanUseBiometrics()` | Vai **directo** ao `authenticate` do SO |

Por que **`skipPluginAvailabilityPrecheck: true`**?

O utilizador **já** activou biometria; em alguns Samsung/Android `deviceCanUseBiometrics()` pode dar falso negativo (rosto = `BiometricType.weak`) e **bloquear** operações sensíveis indevidamente. Nas operações críticas confiam no SO.

Mesmo flag em: desbloqueio (`biometric_unlock_screen`), sacar PIX, compra no Balcão.

---

### Resultado `prova` (`BiometricAuthOutcome`)

| Valor | O que acontece na UI |
|-------|----------------------|
| **`success`** | Continua → lê canal actual → grava novo MFA no Firestore |
| **`cancelledByUser`** | SnackBar “Autenticação cancelada.” → **return** |
| **`notAvailable`** | Biometria indisponível |
| **`lockedOut`** | Muitas tentativas falhadas |
| **`error`** | Erro genérico → pede senha noutros fluxos |

`messageForOutcome(prova)` traduz para português no SnackBar.

---

### Fluxo resumido

```mermaid
flowchart TD
  A[Utilizador muda E-mail/SMS MFA] --> B{prefBio e inscrito?}
  B -->|não| C[Segue fluxo MFA]
  B -->|sim| D[authenticate localizedReason]
  D --> E{prova == success?}
  E -->|não| F[SnackBar + return]
  E -->|sim| C
  C --> G{SMS sem telefone?}
  G --> H[LinkPhone / senha / Firestore]
```

---

### Segurança (intenção)

Alterar **como recebes o código MFA** é acção sensível — alguém com o telefone desbloqueado poderia redireccionar códigos.

**Step-up authentication:** “prova que és tu **agora**” (biometria local) antes de mudar Firestore.

Alternativa quando biometria falha: noutros sítios pedem **senha** (`_promptAccountPassword`); neste bloco específico, falha biométrica = **aborta** a mudança.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Desafio biométrico local antes de mudar canal MFA |
| Quem chama? | `BiometricAuthService.instance` (singleton) |
| `localizedReason`? | Texto no popup do SO |
| `skipPluginAvailabilityPrecheck`? | Confia no SO; evita falso “indisponível” |
| Falhou? | SnackBar + não altera MFA |

**Ideia:** linhas 183–187 = **“confirma com a cara/dedo antes de mudar onde o código MFA chega”** — reforço local, zero biometria no servidor.

## Flutter — `SizedBox.shrink()`

Widget que ocupa **zero espaço** no layout — caixa **0×0** pixels.

No cursor (`seguranca_privacidade_screen.dart`):

```dart
StreamBuilder<String>(
  stream: UserFirestoreService.watchMfaDeliveryMethod(),
  builder: (context, snapMfa) {
    if (snapMfa.connectionState == ConnectionState.waiting &&
        !snapMfa.hasData) {
      return const SizedBox.shrink();
    }
    ...
  },
)
```

Enquanto o stream MFA **ainda não enviou** o primeiro valor → **não desenha nada** (sem spinner, sem flash de UI).

---

### O que é

Atalho do construtor nomeado:

```dart
const SizedBox.shrink()
// equivalente a:
const SizedBox(width: 0, height: 0)
```

| Propriedade | Valor |
|-------------|--------|
| Largura | **0** |
| Altura | **0** |
| Filhos | Nenhum |

Continua a ser um **widget válido** na árvore — só não ocupa área visível nem empurra irmãos.

---

### Por que usar (vs alternativas)

| Opção | Problema |
|-------|----------|
| **`null` no builder** | Inválido — `builder` tem de devolver `Widget` |
| **`Container()` vazio** | Funciona, mas menos idiomático |
| **`SizedBox(height: 0)`** | Igual, sem o nome `shrink` |
| **`CircularProgressIndicator`** | Ocuparia espaço / piscaria loading desnecessário |

**`shrink`** = “placeholder **invisível**”.

---

### Usos no PI

**1. Stream/Future à espera (sem loading visual)**

`seguranca_privacidade_screen.dart` — canal MFA a carregar.

**2. Tabs lazy no dashboard**

```dart
_activatedMainTabs.contains(1)
    ? CarteiraScreen(...)
    : const SizedBox.shrink(),
```

Tab ainda não visitada → **slot vazio** no `IndexedStack` (não monta ecrã pesado).

**3. Lista vazia / condição falsa**

```dart
if (metrics.isEmpty) return const SizedBox.shrink();
if (serie.isEmpty) return const SizedBox.shrink();
```

**4. Fallback opcional**

```dart
trailing ?? const SizedBox.shrink(),  // mescla_header_row.dart
```

**5. `if (ativo) ...` no Perfil**

Só mostra bloco MFA quando 2FA está ligado; quando desligado, widgets dentro do `if` **não existem** — `shrink` é para estados **transitórios** dentro de um builder.

---

### `const`

Quase sempre **`const SizedBox.shrink()`** — widget imutável, barato em rebuilds.

---

### vs `SizedBox()` / `SizedBox(height: 12)`

| Widget | Efeito |
|--------|--------|
| **`SizedBox.shrink()`** | 0×0 — invisível |
| **`SizedBox(height: 12)`** | Espaçamento vertical fixo |
| **`SizedBox.expand()`** | Preenche todo o espaço do pai |

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Widget **0×0** |
| Para quê? | “Nada aqui” sem quebrar o layout |
| No teu cursor | Espera do stream MFA sem spinner |
| No dashboard | Tab não activada = corpo vazio |

**Ideia:** `SizedBox.shrink()` = **widget vazio** — ocupa lugar na árvore, **zero** na tela.

## Flutter — `scheme.primary.withValues(alpha: 0.35)`

No cursor (`app_colors.dart`):

```dart
/// Sombra do botão principal (roxo semitransparente).
static Color primaryShadow(ColorScheme scheme) =>
    scheme.primary.withValues(alpha: 0.35);
```

---

### Desmontar a expressão

| Parte | Significado |
|-------|-------------|
| **`scheme`** | `ColorScheme` do tema (`Theme.of(context).colorScheme`) |
| **`scheme.primary`** | Cor **principal** da marca (roxo `#6234EA` no Mescla) |
| **`.withValues(alpha: 0.35)`** | Nova cor = mesmo tom, **35% de opacidade** |
| **`primaryShadow(...)`** | Helper reutilizável para `shadowColor` de botões |

---

### O que faz `withValues`

API moderna do Flutter para alterar componentes de **`Color`** (substitui em parte **`withOpacity`**):

```dart
color.withValues(alpha: 0.35)   // transparência 0.0 … 1.0
color.withValues(red: 1.0)      // outros canais, se precisares
```

| `alpha` | Efeito |
|---------|--------|
| **1.0** | Opaco (100%) |
| **0.35** | 35% opaco — **65% transparente** |
| **0.0** | Totalmente transparente |

A cor **RGB** base mantém-se (roxo da marca); só o canal **alpha** muda.

---

### Para que serve aqui

Usado em **`shadowColor`** de `ElevatedButton` / `FilledButton` / `Material`:

```dart
FilledButton(
  style: FilledButton.styleFrom(
    shadowColor: AppColors.primaryShadow(theme.colorScheme),
  ),
  ...
)
```

Sítios no PI: login, criar conta, 2FA, **Investir Agora**, adicionar fundos, Balcão, etc.

**Efeito visual:** sombra **roxa suave** por baixo do botão primário — reforça a marca em vez de sombra cinza genérica.

Comentário no ficheiro:

> *Sombra do botão principal (roxo semitransparente)*

---

### Por que `scheme.primary` e não hex fixo

| | **`scheme.primary.withValues(...)`** | **`Color(0xFF6234EA).withValues(...)`** |
|---|----------------------------------------|----------------------------------------|
| Tema claro/escuro | Segue `ColorScheme` | Fixo |
| Se mudar seed no `app_theme` | Sombra **acompanha** | Terias de actualizar à mão |

No Mescla, `primary` é sempre `seedPurple`, mas o padrão escala com o tema.

---

### `withValues` vs `withOpacity`

| API | Nota |
|-----|------|
| **`withOpacity(0.35)`** | Antiga; ainda funciona |
| **`withValues(alpha: 0.35)`** | Recomendada (Flutter 3.27+); evita perda de precisão em alguns casos de cor |

No projeto usam **`withValues`** de forma consistente (hero cards, vídeo demo, hints com `alpha: 0.7`, etc.).

---

### Outros exemplos no PI

```dart
Colors.black.withValues(alpha: 0.06)   // sombra suave de cartão
Colors.white.withValues(alpha: 0.22)   // overlay no hero
primary.withValues(alpha: 0.12)        // fundo chip sócio (perfil)
```

Mesma ideia: **cor sólida + alpha** para overlays e sombras.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é? | Roxo primário a **35% opacidade** |
| Para quê? | `shadowColor` de CTAs |
| `scheme`? | `ColorScheme` do `ThemeData` |
| `alpha: 0.35`? | Sombra visível mas não pesada |

**Ideia:** `withValues(alpha: 0.35)` = “**este roxo, mais transparente**” — sombra de botão alinhada à marca.

## Flutter — `extends PageTransitionsBuilder`

No cursor (`app_theme.dart`):

```dart
class MesclaFadeSlidePageTransitionsBuilder extends PageTransitionsBuilder {
  const MesclaFadeSlidePageTransitionsBuilder();

  @override
  Widget buildTransitions<T>(...) {
    final curved = CurvedAnimation(
      parent: animation,
      curve: Curves.easeOutCubic,
      reverseCurve: Curves.easeInCubic,
    );
    return FadeTransition(
      opacity: curved,
      child: SlideTransition(
        position: Tween<Offset>(
          begin: const Offset(0, 0.03),
          end: Offset.zero,
        ).animate(curved),
        child: child,
      ),
    );
  }
}
```

---

### O que é `extends PageTransitionsBuilder`

**Herança** em Dart: a tua classe **é um** `PageTransitionsBuilder` e **substitui** o comportamento padrão do Flutter para animar **troca de ecrãs** (`Navigator.push`).

| Conceito | Papel |
|----------|--------|
| **`PageTransitionsBuilder`** | Classe **abstracta** do SDK — define *como* animar entrada/saída de páginas |
| **`extends`** | “A minha classe **implementa** esse contrato” |
| **`@override buildTransitions`** | Método obrigatório — devolve o widget animado |

O Flutter chama **`buildTransitions`** quando uma **`MaterialPageRoute`** (ou rota que use o tema) entra ou sai da pilha.

---

### Parâmetros de `buildTransitions`

| Parâmetro | Significado |
|-----------|-------------|
| **`route`** | A rota que está a transicionar |
| **`context`** | Contexto da navegação |
| **`animation`** | 0.0 → 1.0 na **entrada** da nova página |
| **`secondaryAnimation`** | Animação da página **de baixo** (efeito em conjunto) |
| **`child`** | O **conteúdo** da nova página (ecrã destino) |

Tu envolves **`child`** em `FadeTransition` + `SlideTransition` — fade + subida de **3%** (`Offset(0, 0.03)`).

Comentário no ficheiro:

> *fade + micro-deslocamento … ~300 ms, próximo do que muitas apps usam*

---

### Onde entra no tema

```dart
PageTransitionsTheme get mesclaPageTransitionsTheme {
  return PageTransitionsTheme(
    builders: <TargetPlatform, PageTransitionsBuilder>{
      for (final TargetPlatform p in TargetPlatform.values)
        p: const MesclaFadeSlidePageTransitionsBuilder(),
    },
  );
}

ThemeData(
  pageTransitionsTheme: mesclaPageTransitionsTheme,
  ...
)
```

**Todas** as plataformas (Android, iOS, web, …) usam o **mesmo** builder Mescla.

Afecta rotas que respeitam **`ThemeData.pageTransitionsTheme`** — tipicamente **`MaterialPageRoute`** “simples”.

---

### vs `MesclaMaterialRoute.fadeSlide`

Duplicação **intencional** da mesma animação:

| Mecanismo | Quando |
|-----------|--------|
| **`PageTransitionsBuilder`** (tema) | `MaterialPageRoute` genérico |
| **`PageRouteBuilder`** (`mescla_material_route.dart`) | Catálogo → detalhe, Balcão — onde o tema **às vezes não aplica** |

Comentário em `mescla_material_route.dart`:

> *pageTransitionsTheme não se aplica a todos os casos de MaterialPageRoute*

Por isso **`MesclaMaterialRoute.fadeSlide`** garante fade+slide **sempre** nesses fluxos críticos.

---

### Por que não usar só o SDK M3

Comentário:

> *O SDK nem sempre expõe FadeThroughPageTransitionsBuilder (depende da versão do Flutter)*

Classe **própria** = transição **estável** em qualquer versão do Flutter da equipa.

---

### `extends` aqui vs widgets

| | **Widget** (`extends StatelessWidget`) | **`PageTransitionsBuilder`** |
|---|------------------------------------------|------------------------------|
| Desenha UI estática? | Sim | Não — só **anima** o `child` da rota |
| Onde corre | `build(context)` | `buildTransitions(...)` na navegação |

Não é um ecrã — é um **plugin de animação** no sistema de rotas.

---

### Resumo

| Pergunta | Resposta |
|----------|----------|
| O que é `extends PageTransitionsBuilder`? | Classe custom de **transição entre páginas** |
| O que implementa? | `buildTransitions` → fade + slide |
| Onde regista? | `pageTransitionsTheme` no `ThemeData` |
| Alternativa explícita | `MesclaMaterialRoute.fadeSlide` |

**Ideia:** `extends PageTransitionsBuilder` = “**quando fizeres push com MaterialPageRoute, anima assim**” — identidade visual Mescla em toda a navegação por tema.

---

## Flutter — animação de transição Mescla (`Curves`, `Tween`, `Offset`)

Trecho em `app_theme.dart` (e igual em `MesclaMaterialRoute.fadeSlide`):

```dart
final curved = CurvedAnimation(
  parent: animation,
  curve: Curves.easeOutCubic,
  reverseCurve: Curves.easeInCubic,
);
return FadeTransition(
  opacity: curved,
  child: SlideTransition(
    position: Tween<Offset>(
      begin: const Offset(0, 0.03),
      end: Offset.zero,
    ).animate(curved),
    child: child,
  ),
);
```

Quatro peças ligadas: **curva de entrada**, **curva de saída**, **interpolação de posição**, **valores início/fim**.

---

### `animation` (contexto)

`PageRoute` fornece `animation` de **0.0 → 1.0** no push (entrada) e **1.0 → 0.0** no pop (volta).

Linear seria movimento “robótico”; **`CurvedAnimation`** + **`Curves`** tornam o movimento **orgânico**.

---

### `Curves.easeOutCubic` (entrada / push)

Usado em **`curve:`** do `CurvedAnimation` — quando a página **entra**.

| Ideia | Detalhe |
|-------|---------|
| **easeOut** | Começa **rápido**, termina **devagar** |
| **Cubic** | Curva polinómio grau 3 (suave, sem salto) |

Sensação: a nova tela “assenta” no lugar — comum em Material / apps modernos.

---

### `Curves.easeInCubic` (`reverseCurve`)

Usado quando a animação corre **ao contrário** (pop / `Navigator.pop`).

| Ideia | Detalhe |
|-------|---------|
| **easeIn** | Começa **devagar**, acelera no fim |
| Par com easeOut | Entrada e saída **simétricas** em sensação |

**`reverseCurve`** = curva aplicada quando `animation` desce de 1 → 0.

---

### `Tween<Offset>`

**Tween** = “**entre**” dois valores — interpola ao longo do tempo.

```dart
Tween<Offset>(
  begin: const Offset(0, 0.03),
  end: Offset.zero,
).animate(curved)
```

| Parte | Significado |
|-------|-------------|
| **`Tween<Offset>`** | Interpola **posição 2D** (não número, não cor) |
| **`begin` / `end`** | Valores em **t = 0** e **t = 1** |
| **`.animate(curved)`** | Liga ao `Animation<double>` já com curva → `Animation<Offset>` |

`SlideTransition` lê **`position`** — desloca o `child` em frações da **própria largura/altura** do widget.

---

### `Offset(0, 0.03)` e `Offset.zero`

`Offset` usa coordenadas **relativas** (não pixels):

| Valor | Significado |
|-------|-------------|
| **`Offset(0, 0.03)`** | 0% horizontal, **3% para baixo** em relação à altura do filho |
| **`Offset.zero`** | `(0, 0)` — posição final “normal” |

**Micro-deslocamento:** a página entra **ligeiramente mais abaixo** e sobe até o sítio — junto com o fade, parece “subir e aparecer”.

Em `mescla_material_route.dart` usam **`0.035`** (3,5%) — quase igual, transição explícita nas rotas críticas.

```dart
// Eixo Y positivo em Flutter = para BAIXO na tela
begin: Offset(0, 0.03)  → começa um pouco abaixo
end: Offset.zero         → posição final
```

---

### Como encaixa tudo

```mermaid
flowchart LR
  A[animation 0→1] --> B[CurvedAnimation easeOutCubic]
  B --> C[Tween Offset 0.03→0]
  B --> D[FadeTransition opacity]
  C --> E[SlideTransition]
  D --> E
  E --> F[Nova tela]
```

| Camada | Efeito |
|--------|--------|
| **Fade** | Opacidade 0 → 1 |
| **Slide** | Sobe ~3% da altura |
| **easeOutCubic** | Desacelera no fim |
| **easeInCubic** | Ao voltar, acelera a saída |

Duração vem da rota (~300 ms no tema; 320 ms em `MesclaMaterialRoute`).

---

### Resumo por símbolo

| Símbolo | O que é |
|---------|---------|
| **`Curves.easeOutCubic`** | Entrada rápida → lenta |
| **`Curves.easeInCubic`** | Saída lenta → rápida (pop) |
| **`Tween<Offset>`** | Interpolar posição entre dois `Offset` |
| **`Offset(0, 0.03)`** | Começa 3% mais abaixo |
| **`Offset.zero`** | Posição final centrada |

**Ideia:** não animas “à mão” frame a frame — **`Curves`** modelam o ritmo, **`Tween<Offset>`** modelam o caminho, **`Offset(0, 0.03)`** é o “quase imperceptível” que diferencia o Mescla de um fade seco.
