## `passwordReset.ts` — types antes do `export` e `region` no `onCall`

### Para que servem `type SendResponse`, `VerifyResponse` e `ConfirmResponse`?

São **aliases de tipo do TypeScript**: nomes reutilizáveis para descrever o formato exato do que cada etapa do fluxo devolve.

```ts
type SendResponse = { sent: true };
type VerifyResponse = { verified: true; sessionToken: string };
type ConfirmResponse = { updated: true };
```

No arquivo elas aparecem nas assinaturas, por exemplo `async function handleSend(...): Promise<SendResponse>`.

**O que ganhamos com isso:**

- **Documentação no código** — sem ler o corpo da função já sabemos o “contrato” de resposta de `send`, `verify` e `confirm`.
- **Segurança em tempo de compilação** — se alguém retornar `{ sent: false }` ou esquecer `sessionToken`, o TypeScript acusa erro antes de rodar.
- **Autocomplete no editor** — ao trabalhar com o retorno, o IDE sugere os campos corretos.
- **Refatoração mais segura** — mudar o formato da resposta em um lugar propaga o aviso onde o tipo é usado.

**Importante:** esses `type` **não existem em runtime** (não viram código JavaScript). Só existem para o compilador/analisador. O cliente (Flutter) continua recebendo JSON normal; no Dart o contrato é outro (maps, classes, etc.).

No `passwordReset.ts` cada `action` tem um formato de resposta diferente; os três types deixam isso explícito em vez de usar `any` ou um objeto genérico.

---

### Para que serve `region: "us-central1"` no `onCall`?

Define **em qual região do Google Cloud** essa Cloud Function é implantada e executada.

```ts
export const passwordReset = onCall({ region: "us-central1" }, async (request) => { ... });
```

Callable Functions (`onCall`) são chamadas pelo app com `httpsCallable('passwordReset')`, mas o SDK precisa saber **a mesma região** do deploy. No projeto, o Flutter faz:

```dart
FirebaseFunctions.instanceFor(region: 'us-central1')
```

Se o backend estiver em `us-central1` e o app chamar outra região (ou o padrão errado), a chamada **não encontra a função** (erro do tipo função inexistente / NOT_FOUND).

**Por que importa na prática:**

| Aspecto | Efeito |
|--------|--------|
| **Descoberta da função** | Região do deploy = região na chamada do cliente |
| **Latência** | A função roda no datacenter da região (ex.: EUA — Iowa em `us-central1`) |
| **Consistência do projeto** | Várias callables (`twoFactor`, `listStartups`, `passwordReset`, etc.) usam a mesma região para um único `instanceFor` no app |

`us-central1` é uma região muito usada como padrão em tutoriais e no Firebase; não é a mais próxima do Brasil, mas o time padronizou tudo nela para não misturar regiões.

**Resumo:** `region` não é “decorativo” — é parte do endereço lógico da função. Backend e app **têm que combinar**.

## TypeScript — `email?: string` (o `?` e o `:`)

### O que é cada símbolo?

Em `email?: string`:

| Parte | Nome | Significado |
|-------|------|-------------|
| `email` | nome do parâmetro | variável que a função recebe |
| `:` | separador de tipo | em TypeScript, lê-se “é do tipo…” |
| `?` depois do nome | parâmetro **opcional** | quem chama pode não passar esse argumento, ou passar `undefined` |
| `string` | tipo | quando existe valor, deve ser texto |

Ou seja: **`:` não é “dois pontos de null safety”** — é só a sintaxe de anotação de tipo do TypeScript (`nome: Tipo`).

O **`?` no parâmetro** significa “opcional”. Para efeito de tipo, `email?: string` é quase o mesmo que `email: string | undefined` (pode faltar ou vir `undefined`).

### É null safety?

**Parecido na ideia, mas não é o null safety do Dart.**

- No **Dart**, `String?` = pode ser `null`; `String` = não pode.
- No **TypeScript**, o opcional em parâmetro (`email?`) combina com `undefined`. `null` é outro caso — dá para tipar `string | null` se quiser.

O TypeScript também tem *strict null checks*: se você marcar só `string` (sem `?` e sem `| undefined`), o compilador reclama quando você usa o valor sem garantir que existe.

No `passwordReset.ts`, o fluxo real é:

```ts
const email = normalizeString(request.data?.email);  // retorna string | undefined
return handleSend(email);                            // por isso handleSend aceita email?
```

`normalizeString` devolve `undefined` quando o cliente manda número, objeto, string vazia, etc. Por isso `handleSend(email?: string)` faz sentido: a função **espera** que às vezes não haja e-mail válido e trata com `if (!email || !isEmailPlausible(email))`.

### Por que validar com `if (!email)` se já tem tipo?

O `?` / `| undefined` é **em tempo de compilação**. Em **runtime** JavaScript não impede nada — dados vêm da rede (`request.data`). As checagens `if (!email)` são a defesa real; depois delas o TypeScript entende que `email` é `string` “de verdade” (narrowing).

### Outro `?` no mesmo arquivo (propriedade opcional)

```ts
const err = e as { code?: string; message?: string };
```

Aqui o `?` está **dentro de um tipo de objeto**: `code` e `message` podem existir ou não no erro capturado. Mesma ideia: opcional / pode ser `undefined`, não “nullable do Dart” literalmente.

### Comparação rápida Dart × TypeScript

| Situação | Dart | TypeScript (exemplo do projeto) |
|----------|------|----------------------------------|
| Pode não vir valor | `String? email` | `email?: string` ou `email: string \| undefined` |
| Obrigatório | `String email` | `email: string` |
| Separador nome/tipo | espaço: `String email` | dois pontos: `email: string` |

**Resumo:** `email?: string` = parâmetro opcional, tipo texto quando presente; o `:` separa nome e tipo; a validação manual (`!email`) é o que protege em produção, no mesmo espírito do null safety do Flutter, mas com regras do TypeScript.

## `passwordResetRepository.ts` — `VerifyResetCodeResult` com `=` e `|` em várias linhas

### O trecho

```ts
export type VerifyResetCodeResult =
  | { ok: true; sessionToken: string }
  | { ok: false; reason: "not_found" | "expired" | "max_attempts" | "invalid" };
```

### Para que serve o `=`?

Aqui estamos **definindo um alias de tipo** (um nome novo para um tipo que já existe na sintaxe):

```ts
export type NomeDoTipo = ... definição ...
```

O `=` liga o **nome** (`VerifyResetCodeResult`) à **definição** do lado direito. É como:

```ts
const x = 10;        // valor em runtime
type T = string;     // tipo em compile-time (some no JS)
```

Não é comparação (`===`). É “este nome **é** este tipo”.

### Para que serve o `|`?

Em TypeScript, **`|` em tipos = união (“OU”)**: o valor pode ser **uma forma OU outra**.

Neste caso, `verifyResetCode` devolve **ou**:

1. sucesso: `{ ok: true, sessionToken: "abc..." }`
2. falha: `{ ok: false, reason: "invalid" }` (e outros `reason` permitidos)

Isso chama **union type** (tipo união). Quando o campo `ok` distingue os casos (`true` vs `false`), é uma **discriminated union** — o “discriminador” é `ok`. No handler (`passwordReset.ts`) fazem `if (result.ok)` e o TypeScript sabe que, no ramo `true`, existe `sessionToken`; no `false`, existe `reason`.

O `|` **dentro** de `reason: "not_found" | "expired" | ...` é o mesmo operador, mas em strings literais: `reason` só pode ser um desses quatro textos fixos (autocomplete e erro se escrever `"typo"`).

### Por que quebra linha com `|` no início?

**Só estilo / legibilidade.** Estas duas formas são **equivalentes** para o compilador:

```ts
// Uma linha
type A = { ok: true } | { ok: false };

// Várias linhas, | no início de cada ramo (convenção comum)
type B =
  | { ok: true }
  | { ok: false };
```

Colocar o `|` no começo da linha deixa claro que cada linha é **mais um membro da mesma união**, igual listar itens em uma tabela. Não muda comportamento nem runtime.

### Como isso aparece no código

`verifyResetCode` retorna objetos que batem com esse tipo:

```ts
return { ok: false, reason: "not_found" };
// ...
return { ok: true, sessionToken };
```

Quem consome (`handleVerify` em `passwordReset.ts`) faz:

```ts
if (result.ok) {
  return { verified: true, sessionToken: result.sessionToken };
}
switch (result.reason) { ... }
```

Depois de `if (result.ok)`, no `else` o TypeScript já sabe que `result` é `{ ok: false; reason: ... }` — não precisa de cast.

O mesmo padrão se repete em `ConsumeResetSessionResult` (linhas 108–110 do repositório).

### Comparação com Dart (se conhecer sealed classes)

Ideia parecida com um **result type** ou sealed class com variantes sucesso/erro, mas em TypeScript é só tipagem estática — em runtime continua sendo objetos JavaScript normais.

**Resumo:** `=` define o alias de tipo; `|` une variantes (“OU este formato OU aquele”); quebra de linha com `|` à esquerda é formatação para ler melhor.

## Balcão — `Math.max(0, ...)` ao liberar escrow

### Onde aparece

Exemplo em `cancelOrder.ts`:

```ts
{ [POSITION_FIELD_TOKENS_LOCKED]: Math.max(0, locked - quantity) }
{ [WALLET_FIELD_BRL_LOCKED]: Math.max(0, locked - releaseBrl) }
```

O mesmo padrão existe em `editOrder`, `executeP2pMatch`, `executeDirectP2pBuy`, etc., sempre que o código **reduz** BRL ou tokens bloqueados (escrow).

### O que faz

`Math.max(0, valor)` devolve o **maior** entre `0` e `valor`. Se a subtração der negativo, o resultado gravado no Firestore fica **0**, nunca um número negativo.

### Por quê?

Ao cancelar ou executar uma ordem, o fluxo ideal é:

- `locked` = quanto já está reservado na carteira (`brlLockedInOrders`) ou na posição (`tokensLockedInOrders`)
- `quantity` / `releaseBrl` = quanto **esta ordem** tinha reservado
- Nova reserva = `locked - quantity` (ou `locked - releaseBrl`)

Se os dados estiverem desalinhados (ordem parcialmente executada, cancelamento duplicado, bug legado, etc.), a subtração pode dar **-5 tokens** ou **-100 BRL** bloqueados. Isso não faz sentido no domínio — escrow negativo quebraria o cálculo de saldo disponível.

`Math.max(0, ...)` é uma **rede de segurança**: no pior caso, zera o escrow em vez de persistir valor inválido.

**Resumo:** não é “arredondar para cima”; é **impedir saldo bloqueado negativo** ao liberar reserva.

## Balcão — `1e-9` nas comparações de saldo

### O que é

`1e-9` é notação científica para **0,000000001** (um bilionésimo). No código do balcão funciona como **epsilon** — uma margem minúscula nas comparações de saldo.

Exemplo em `editOrder.ts`:

```ts
if (disponivelComOrdemAtual + 1e-9 < quantity) {
  throw new HttpsError("failed-precondition", "...");
}
```

### Por quê?

Em JavaScript, números decimais (`number`) usam ponto flutuante IEEE 754 e **não são exatos**. Operações como `10 * 0.1` ou `quantity * pricePerToken` podem produzir `99.99999999999999` em vez de `100`.

Com comparação estrita:

```js
99.99999999999999 < 100  // true → rejeita a ordem injustamente
```

Com epsilon:

```js
99.99999999999999 + 1e-9 < 100  // false → aceita (saldo suficiente na prática)
```

Traduzindo a condição `disponivel + 1e-9 < total`: **só considera saldo insuficiente se faltar mais do que uma fração irrelevante** — na prática, menos de um nanocêntimo de BRL.

### Onde aparece no módulo `balcao`

| Arquivo | Comparação |
|---------|------------|
| `addBuyOrder` | BRL disponível vs valor total da ordem |
| `addSellOrder` | tokens disponíveis vs quantidade |
| `editOrder` | saldo (incluindo o que a ordem atual já reserva) vs novo valor |
| `executeP2pMatch` | saldo, escrow e tokens do comprador/vendedor no match |
| `executeDirectP2pBuy` | BRL e tokens na compra directa de oferta |

Também existe `1e-12` em comparações de **preço** (ex.: cruzamento de book), porque preços por token podem ter casas decimais diferentes.

### Não é “dar desconto”

`1e-9` BRL é **0,000000001 reais** — irrelevante no negócio. Serve só para evitar **falsos negativos** por imprecisão de `float`, não para permitir operações sem saldo real.

**Resumo:** `1e-9` = tolerância numérica mínima; `Math.max(0, ...)` = piso zero no escrow. São defesas diferentes: uma na **comparação**, outra na **gravação**.

## Firestore — `{ merge: true }` no `set()`

### O trecho (ex.: `editOrder.ts`)

```ts
trx.set(
  positionRef,
  {
    [POSITION_FIELD_TOKENS_LOCKED]: Math.max(0, locked - oldQty + quantity),
  },
  { merge: true }
);
```

O terceiro argumento de `set()` são **opções**. `{ merge: true }` muda o comportamento do `set`.

### O que faz

No Firestore existem duas formas principais de gravar um documento:

| Método | Comportamento |
|--------|----------------|
| `set(dados)` **sem** merge | **Substitui** o documento inteiro. Campos que não estão em `dados` **somem**. |
| `set(dados, { merge: true })` | **Mescla**: atualiza só os campos enviados; o resto do documento **permanece**. |
| `update(dados)` | Também altera só campos indicados, mas **falha** se o documento não existir. |

### Por que usar `merge: true` aqui?

A posição em `sim_wallet/{uid}/positions/{startupId}` tem vários campos, por exemplo:

- `tokensHeld`
- `costBasisBrl`
- `startupName`, `tokenSigla`, `category`
- `tokensLockedInOrders` (escrow)
- `updatedAt`

Neste trecho só queremos mudar **`tokensLockedInOrders`**. Sem merge:

```ts
trx.set(positionRef, { tokensLockedInOrders: 50 });
// Apaga tokensHeld, costBasisBrl, startupName, etc. — documento corrompido
```

Com merge:

```ts
trx.set(positionRef, { tokensLockedInOrders: 50 }, { merge: true });
// Só atualiza tokensLockedInOrders; os outros campos ficam intactos
```

O mesmo vale para `brlLockedInOrders` na carteira (`WALLET_ROOT/{uid}`), onde `brlBalance` e outros campos não podem ser apagados por acidente.

### `set` com merge vs `update`

- **`update`**: documento **tem que existir**; só campos listados.
- **`set` + `merge: true`**: se o documento **não existir**, cria com os campos enviados; se existir, mescla.

No balcão usa-se `set` + merge quando convém **criar ou atualizar** parcialmente (ex.: primeira reserva de escrow numa posição que já tinha outros dados, ou carteira que ainda não tinha `brlLockedInOrders`).

### Quando **não** usa merge no projeto

Quando a intenção é gravar o documento **completo** de uma vez — ex.: criar ordem nova com todos os campos (`uid`, `quantity`, `pricePerToken`, `status`, …). Aí `set` sem merge (ou com objeto completo) faz sentido.

**Resumo:** `{ merge: true }` = “atualiza **só estes campos**, não apagues o resto do documento”.

## Balcão — o que é **escrow** (garantia / reserva)

### Conceito geral

**Escrow** (do inglês, “depósito em garantia”) é quando um valor fica **separado e bloqueado** para cumprir um compromisso futuro — ainda é teu, mas **não podes gastar outra vez** enquanto o compromisso estiver aberto.

Exemplos do mundo real:

- Compra de imóvel: parte do dinheiro fica numa conta de garantia até a escritura.
- Marketplace: o pagamento fica retido até confirmares que recebeste o produto.

No MesclaInvest (simulado), o balcão P2P usa escrow para **garantir que ordens abertas podem ser executadas** se houver match.

### Como o projeto implementa

Há **dois tipos** de escrow, conforme o lado da ordem:

| Lado | O que reserva | Campo no Firestore | Onde |
|------|----------------|-------------------|------|
| **Ordem de compra** | BRL (`quantity × pricePerToken`) | `brlLockedInOrders` | `sim_wallet/{uid}` |
| **Ordem de venda** | Tokens | `tokensLockedInOrders` | `sim_wallet/{uid}/positions/{startupId}` |

Constantes em `constants.ts`:

- `WALLET_FIELD_BRL_LOCKED` → `"brlLockedInOrders"`
- `POSITION_FIELD_TOKENS_LOCKED` → `"tokensLockedInOrders"`

### Saldo “total” vs saldo “disponível”

O escrow **não debita** o saldo principal de imediato (na criação da ordem). Ele **marca uma parte como reservada**:

```text
BRL disponível  = brlBalance − brlLockedInOrders
Tokens disponíveis = tokensHeld − tokensLockedInOrders
```

Isso está em `escrowMath.ts`:

- `readAvailableBrl()` — quanto BRL ainda podes usar em **nova** ordem de compra
- `readAvailableTokens()` — quantos tokens ainda podes vender

`orderBuyLockBrl(qty, price)` calcula quanto BRL uma ordem de compra precisa reservar: `qty × price`.

### Fluxo resumido

```mermaid
flowchart LR
  subgraph compra [Ordem de compra aberta]
    B[brlBalance]
    L1[brlLockedInOrders ↑]
    B --> L1
  end
  subgraph venda [Ordem de venda aberta]
    T[tokensHeld]
    L2[tokensLockedInOrders ↑]
    T --> L2
  end
  subgraph fim [Match ou cancelamento]
    M[Escrow liberado ou consumido no trade]
  end
  L1 --> M
  L2 --> M
```

1. **Criar ordem** — aumenta o locked (reserva).
2. **Editar ordem** — ajusta o locked (liberta o antigo, reserva o novo).
3. **Cancelar ordem** — diminui o locked (`Math.max(0, ...)`); BRL/tokens voltam ao “disponível”.
4. **Match executado** — o escrow é **consumido** no trade (BRL debitado de facto, tokens transferidos); o locked desce em paralelo.

### Por que existe?

Sem escrow, um investidor poderia:

- Publicar ordem de compra de R$ 10.000 **sem** ter esse valor livre.
- Publicar venda de 100 tokens **já vendidos** noutra ordem.

O match engine assumiria liquidez que não existe → trades inválidos, saldos negativos, inconsistência entre carteira e livro de ordens.

Com escrow, **cada ordem aberta já tem garantia** antes de entrar no book.

### Escrow ≠ pagamento imediato

Na **ordem de compra limit** no book, o BRL fica em `brlLockedInOrders` — ainda está em `brlBalance`, mas indisponível para outras compras.

Na **compra directa** de uma oferta (`executeDirectP2pBuy`), não há ordem intermédia: debita-se `brlBalance` de imediato (sem passar pelo locked da mesma forma).

### Relação com funções que já estudaste

| Peça | Papel no escrow |
|------|-----------------|
| `escrowMath.ts` | Lê saldo disponível descontando locked |
| `addBuyOrder` / `addSellOrder` | Aumentam locked ao criar ordem |
| `cancelOrder` / `editOrder` | Libertam ou reajustam locked |
| `executeP2pMatch` | Usa locked no match e atualiza carteiras |
| `Math.max(0, …)` | Evita locked negativo ao liberar |
| `1e-9` | Compara saldo disponível vs reserva sem erro de float |

**Resumo:** escrow no balcão = **reserva temporária** de BRL (compras) ou tokens (vendas) enquanto a ordem está aberta, para o order book só aceitar ordens executáveis.

## Firestore — o que é `trx` em `db.runTransaction(async (trx) => { ... })`

### Significado do nome

`trx` é abreviatura informal de **transaction** (transação). É só o **nome do parâmetro** da função callback — poderia ser `transaction`, `t` ou qualquer outro; o time escolheu `trx` por ser curto e comum em código financeiro/banco de dados.

### O que é na prática

Quando o código faz:

```ts
await db.runTransaction(async (trx) => {
  const sellSnap = await trx.get(sellRef);
  // ...
  trx.set(buyerWalletRef, { brlBalance: buyerBalance - amountBrl }, { merge: true });
  trx.update(sellRef, { ... });
});
```

o Firestore abre uma **transação atómica**: um bloco de leituras e escritas que:

1. **Ou tudo commita junto** — todas as alterações vão para o banco de uma vez.
2. **Ou nada commita** — se der erro ou conflito, **nenhuma** escrita parcial fica gravada.

Isso evita estados inconsistentes (ex.: debitar o comprador mas não creditar o vendedor).

### `trx` vs `db` “normal”

| | `db.get()` / `db.set()` fora de transação | `trx.get()` / `trx.set()` **dentro** de `runTransaction` |
|---|-------------------------------------------|----------------------------------------------------------|
| Atomicidade | Cada operação é independente | Várias operações formam **um pacote** |
| Concorrência | Outro processo pode alterar o doc entre teu `get` e teu `set` | Firestore **reexecuta** a transação se os dados mudaram entretanto |
| Uso no balcão | Leituras simples, índices, metadados | Trades P2P, cancelamento, escrow — onde saldo + ordem + posição têm de bater certo |

Dentro do callback **deves** usar `trx.get`, `trx.set`, `trx.update`, `trx.delete` — não misturar com `db.set` no meio da mesma transação lógica.

### Fluxo simplificado

```mermaid
sequenceDiagram
  participant Code as executeDirectP2pBuy
  participant FS as Firestore
  Code->>FS: runTransaction(trx => ...)
  FS->>Code: trx.get(sellRef), trx.get(wallet)...
  Code->>Code: valida saldo, preço, status
  Code->>FS: trx.set / trx.update (vários docs)
  alt tudo OK
    FS->>FS: commit atómico
  else erro ou conflito
    FS->>FS: abort / retry
  end
```

### Por que aparece tanto no balcão

Operações como `executeDirectP2pBuy`, `executeP2pMatch`, `cancelOrder`, `addBuyOrder` tocam **vários documentos** ao mesmo tempo (carteira comprador, carteira vendedor, posições, ordem, startup, ledger). `trx` garante que o trade é **tudo ou nada**.

**Resumo:** `trx` = objeto da **transação Firestore**; abreviação de *transaction*; usado para ler e escrever de forma atómica e segura sob concorrência.

## JavaScript/TypeScript — `outer:` e `break outer` no `matchEngine.ts`

### O trecho

```ts
let matchedThisRound = false;
outer:
for (const sell of sells) {
  for (const buy of buys) {
    if (sell.uid === buy.uid) continue;
    if (sell.pricePerToken > buy.pricePerToken + 1e-12) continue;

    const result = await executeP2pMatch(startupId, sell, buy);
    if (!result.matched) continue;

    matchedThisRound = true;
    break outer;   // ← sai dos DOIS loops de uma vez
  }
}
```

### O que é `outer:`?

`outer:` é um **rótulo (label)** em JavaScript/TypeScript — um nome colocado **antes** de um statement (aqui, o `for` externo). Não executa nada sozinho; serve de **alvo** para `break` ou `continue`.

- `outer` = nome escolhido pelo autor (poderia ser `loopVendas`, `matchLoop`, etc.)
- Os dois pontos `:` fazem parte da sintaxe do label

### Para que serve aqui?

Há **dois `for` aninhados**:

1. **Externo** — percorre ordens de **venda**
2. **Interno** — percorre ordens de **compra**

Quando encontra um par que deu match (`executeP2pMatch` retorna `matched: true`), o motor quer:

- marcar `matchedThisRound = true`
- **parar de procurar** outros pares nesta rodada (só um match por iteração do motor)

Com `break` **sem** label, só sairia do loop **interno** (compras) e continuaria no próximo `sell` — indesejado.

Com `break outer`, sai do loop **externo e interno** de uma vez.

### Comparação

| Comando | Efeito neste código |
|---------|---------------------|
| `continue` (no loop interno) | Próxima ordem de **compra** |
| `break` (sem label) | Sai só do loop de **compras**; tenta próximo **sell** |
| `break outer` | Sai dos **dois** loops — acabou a rodada de matching |

### Fluxo mental

```text
Para cada venda (outer)
  Para cada compra (inner)
    preços cruzam? self-trade? → continue
    match falhou? → continue (tenta outra compra)
    match OK → matchedThisRound = true → break outer
```

Depois, fora dos loops:

```ts
if (!matchedThisRound) return;  // nenhum par executou nesta rodada
// senão, o for externo (i < 50) repete: busca ordens de novo e tenta outro match
```

### Alternativas (sem label)

Daria para usar uma função auxiliar com `return`, ou uma flag `found` com `if (!found)` nos dois loops — o label deixa o código mais directo em loops duplos.

**Resumo:** `outer:` = rótulo do loop externo; `break outer` = “match feito, **sai dos dois `for`** e segue para a próxima fase do motor”.

## TypeScript — `Record<string, unknown>`

### O que é

`Record` é um **tipo utilitário** do TypeScript para descrever um **objeto com chaves e valores tipados**.

Sintaxe geral:

```ts
Record<Chave, Valor>
```

Significa: “objeto cujas chaves são do tipo `Chave` e cujos valores são do tipo `Valor`”.

### Exemplo no projeto (`reconcileStartupCaptureCore.ts`)

```ts
function readEsperadaBrl(data: Record<string, unknown> | undefined): number {
  const raw = data[STARTUP_FIELD_CAPTACAO_ESPERADA];
  // ...
}

const m = doc.data() as Record<string, unknown>;
const sd = startupSnap.data() as Record<string, unknown>;
```

Aqui: **`Record<string, unknown>`** = objeto com **qualquer chave string** (`"captacao_esperada"`, `"op"`, `"amountBrl"`, …) e **valor de tipo desconhecido** até inspecionares com `typeof`, `if`, etc.

### Por que usar com Firestore?

`doc.data()` devolve dados JSON do Firestore — em runtime é um objeto JavaScript, mas o TypeScript **não sabe** quais campos existem nem os tipos de cada um.

| Abordagem | Problema / vantagem |
|-----------|---------------------|
| `any` | Desliga a verificação de tipos — fácil errar |
| Interface fixa (`StartupDoc`) | Ótimo quando o schema é estável |
| `Record<string, unknown>` | Meio-termo: é um objeto indexável por string, mas **obriga** a validar antes de usar |

Por isso o código faz:

```ts
const raw = data[STARTUP_FIELD_CAPTACAO_ESPERADA];
if (typeof raw === "number" && Number.isFinite(raw)) { ... }
```

O tipo diz “não confies cegamente”; as checagens em runtime garantem segurança.

### Equivalência

Estas formas são **muito parecidas** para chaves string:

```ts
Record<string, unknown>
{ [key: string]: unknown }
```

`Record` é só sintaxe mais curta e legível.

### Variantes comuns

```ts
Record<string, number>           // mapa string → número
Record<string, string>           // mapa string → string
Record<"buy" | "sell", number>   // chaves fixas (união literal)
```

No `startupRepository.ts` também aparece `Record<string, unknown>` para sub-objetos como `grafico_valuation` e `tokens_emitidos` — objetos aninhados cujo formato pode variar.

### `Record` vs `type` / `interface`

| | `Record<string, unknown>` | `interface StartupDoc { ... }` |
|---|---------------------------|--------------------------------|
| Schema | Aberto — qualquer chave string | Fechado — campos conhecidos |
| Uso típico | Dados crus do Firestore, parsing defensivo | Contrato estável da API |
| Autocomplete | Só nas chaves que você constantes/strings | Campos definidos na interface |

### Comparação com Dart (se ajudar)

Ideia próxima de `Map<String, dynamic>` — mapa com chaves texto e valores ainda por tipar — mas em TypeScript `Record` é **só compile-time**; em runtime continua sendo `{}` normal.

**Resumo:** `Record<string, unknown>` = “objeto indexado por strings, valores ainda não tipados”; usado ao ler Firestore/JSON para **forçar validação** antes de usar cada campo.

## Callable — `request.data?.action` no `simulateWallet` (e outras functions)

### O que é `action`

`action` é um **campo de texto** que o app envia no corpo da chamada (`request.data`) para dizer **qual operação** executar dentro da mesma Cloud Function.

No Flutter (`simulated_wallet_service.dart`):

```dart
await _fn().httpsCallable('simulateWallet').call({
  'action': 'credit_pix_simulated',
  'amountBrl': amountBrl,
});
```

No backend (`simulateWallet.ts`):

```ts
const actionRaw = typeof request.data?.action === "string"
  ? request.data.action.trim().toLowerCase()
  : "";
```

### Valores aceitos em `simulateWallet`

| `action` | O que faz |
|----------|-----------|
| `credit_pix_simulated` | Credita BRL na carteira (PIX demo) |
| `withdraw_pix_simulated` | Debita BRL (saque simulado) |
| `trade_buy` | Compra tokens (precisa `startupId`, `tokens`, …) |
| `trade_sell` | Venda tokens |

Se não for nenhuma delas, no final:

```ts
throw new HttpsError("invalid-argument", "Ação não reconhecida. Use ...");
```

### Por que existe (padrão “uma function, várias ações”)

Em vez de criar quatro Cloud Functions separadas (`creditWallet`, `withdrawWallet`, …), o projeto expõe **uma** callable `simulateWallet` e usa `action` como **interruptor** (`if` / ramos):

```text
simulateWallet(request)
  ├─ action = credit_pix_simulated  → credita saldo + ledger
  ├─ action = withdraw_pix_simulated → debita + ledger
  ├─ action = trade_buy             → compra + posição + startup
  └─ action = trade_sell            → venda + posição + startup
```

O mesmo padrão aparece em:

- `passwordReset` — `action`: `send` | `verify` | `confirm`
- `twoFactor` — `action`: `send` | `verify`

### O que significa `request.data?.action`

Dois pedaços:

| Parte | Significado |
|-------|-------------|
| `request.data` | Objeto JSON que o cliente mandou na callable |
| `?.` | **Optional chaining** — se `data` for `null`/`undefined`, a expressão vira `undefined` em vez de dar erro |
| `.action` | Acessa a propriedade `action` desse objeto |

Ou seja: “pega o campo `action` do payload, **se existir payload**”.

Depois o código valida:

```ts
typeof request.data?.action === "string"
```

porque o cliente poderia mandar `action: 123` ou omitir o campo — aí `actionRaw` fica `""` e cai no erro “ação não reconhecida”.

### `action` (pedido) vs `op` (ledger)

Não confundir:

| Campo | Onde | Papel |
|-------|------|--------|
| `request.data.action` | Entrada da callable | Escolhe **qual ramo** executar agora |
| `ledger.op` | Documento gravado no Firestore | Regista **o tipo da movimentação** no histórico (`trade_buy`, `credit_pix_simulated`, …) |

Ex.: o app manda `action: 'trade_buy'`; dentro da transação grava-se `op: "trade_buy"` no ledger.

**Resumo:** `.action` = propriedade do payload que **roteia** a callable; `?.` protege quando `data` não veio; é o contrato app ↔ backend para “o que fazer” numa única function.

## Wallet — `assertPositiveIntegerTokens`

### Onde está e onde é usada

Definida em `functions/src/wallet/shared/validation.ts`.

Chamada em `simulateWallet.ts` quando `action` é `trade_buy` ou `trade_sell`:

```ts
const tokens = assertPositiveIntegerTokens(request.data?.tokens);
```

Também é usada **dentro** de `assertAmountMatchesTrade` para garantir que `tokens` é válido antes de comparar `amountBrl` com `tokens × preço`.

### O código

```ts
export function assertPositiveIntegerTokens(raw: unknown): number {
  const n = Number(raw);
  if (!Number.isFinite(n) || !Number.isInteger(n) || n <= 0) {
    throw new HttpsError(
      "invalid-argument",
      "Informe uma quantidade de tokens válida."
    );
  }
  return n;
}
```

### O que faz (em português claro)

1. Recebe `raw` — valor vindo do app (`request.data.tokens`), tipo **desconhecido** (`unknown`).
2. Converte com `Number(raw)` (aceita número ou string `"3"`).
3. **Rejeita** com `HttpsError` se:
   - não for finito (`NaN`, `Infinity`);
   - não for **inteiro** (`2.466` → erro);
   - for `≤ 0` (zero ou negativo).
4. Se passar, **devolve** o `number` já validado (para usar no resto da function).

É uma função **assert** (afirma/garante): ou retorna um inteiro válido ou **interrompe** a callable com erro para o cliente.

### Por que tokens têm de ser inteiro

No modelo do projeto, **não se negocia fração de token** no balcão/carteira simulada — só unidades inteiras (1, 2, 100 tokens). Por isso `Number.isInteger(n)` é obrigatório.

### Exemplos (testes em `simulateWallet.unit.test.ts`)

| Entrada | Resultado |
|---------|-----------|
| `2` | OK → retorna `2` |
| `"3"` | OK → retorna `3` |
| `2.466` | Erro — não é inteiro |
| `0` | Erro — não é positivo |
| `-1` | Erro — não é positivo |

### Relação com o fluxo `trade_buy` / `trade_sell`

```text
App manda: action, amountBrl, tokens, startupId, ...
     ↓
assertPositiveIntegerTokens(tokens)  → quantidade inteira > 0
readRequiredStartupTokenPriceBrl(...) → preço oficial no Firestore
assertAmountMatchesTrade(amountBrl, tokens, preço) → BRL bate com tokens × cotação
     ↓
runTransaction (atualiza carteira, posição, ledger, startup)
```

Sem essa validação, alguém poderia mandar `tokens: 2.5` ou `tokens: -10` e corromper posições/ledger.

### Parecido no módulo balcão

Em `balcao/shared/orderValidation.ts` existe `assertPositiveIntegerQuantity` — mesma ideia, outro nome de campo (`quantity` nas ordens P2P). Wallet usa `tokens` na callable `simulateWallet`.

**Resumo:** `assertPositiveIntegerTokens` = validação de entrada que garante **quantidade de tokens inteira e positiva**; se falhar, a operação nem chega à transação Firestore.

## O que significa **assert** (duas coisas no projeto)

### 1. Prefixo `assert` no **nome das funções** (`assertPositiveIntegerTokens`, …)

No código de negócio (`validation.ts`, `orderValidation.ts`), **assert** no nome significa:

> **“Exijo que esta condição seja verdadeira; se não for, paro com erro.”**

Padrão típico:

```ts
export function assertPositiveIntegerTokens(raw: unknown): number {
  const n = Number(raw);
  if (!condição_ok) {
    throw new HttpsError("invalid-argument", "...");
  }
  return n;  // valor já validado
}
```

| Se passar | Se falhar |
|-----------|-----------|
| Retorna o valor tipado (ex.: `number`) | Lança `HttpsError` → callable responde erro ao app |
| O código seguinte pode confiar nos dados | **Não** chega a `runTransaction` / Firestore |

**Por que o nome `assert…` e não `validate…`?** É convenção comum em TypeScript/backend:

- **`assertX`** — “garante X ou explode” (muitas vezes retorna o valor já validado).
- **`validateX`** — às vezes só devolve `true/false` ou um objeto de erro, sem lançar.

No MesclaInvest, as `assert*` **sempre lançam** `HttpsError` com código HTTP semântico (`invalid-argument`, `failed-precondition`).

Funções `assert*` no projeto:

| Função | Módulo | Garante |
|--------|--------|---------|
| `assertPositiveIntegerTokens` | wallet | tokens inteiro > 0 |
| `assertAmountMatchesTrade` | wallet | `amountBrl` ≈ tokens × preço |
| `assertPositiveIntegerQuantity` | balcão | quantidade inteira > 0 |
| `assertPositivePrice` | balcão | preço > 0 |
| `assertStartupId` | balcão | id não vazio |
| `assertOrderTotalWithinLimits` | balcão | total da ordem dentro do limite |

**Analogia:** porteiro na entrada — ou deixa passar com documento ok, ou barra antes do evento (transação) começar.

### 2. `assert` importado nos **testes** (`node:assert/strict`)

No `simulateWallet.unit.test.ts`:

```ts
import assert from "node:assert/strict";

test("...", () => {
  assert.equal(assertPositiveIntegerTokens(2), 2);
  assert.throws(() => assertPositiveIntegerTokens(2.466), /quantidade/);
});
```

Aqui **`assert` é outra coisa**: biblioteca padrão do Node.js para **testes automatizados**.

| Método | Uso no teste |
|--------|----------------|
| `assert.equal(a, b)` | Verifica que `a === b` |
| `assert.throws(fn, /regex/)` | Verifica que `fn()` **lançou** erro |
| `assert.doesNotThrow(fn)` | Verifica que `fn()` **não** lançou |

Não vai para produção; só roda com `npm test`. Se a expectativa falhar, o teste fica vermelho.

**Não confundir:**

```ts
assertPositiveIntegerTokens(2)     // função do projeto — valida entrada real
assert.equal(x, 2)                 // biblioteca de teste — verifica expectativa
```

### Fluxo mental

```text
Produção (simulateWallet):
  request.data.tokens
       → assertPositiveIntegerTokens()  ← guarda de negócio
       → transação Firestore

Testes (simulateWallet.unit.test.ts):
  assertPositiveIntegerTokens(2.466)   ← função sob teste
       → assert.throws(...)            ← “esperávamos erro, deu certo?”
```

**Resumo:** **assert** nas funções = validação que **obriga** uma regra ou falha a callable; **assert** nos testes = ferramenta do Node para **confirmar** que o código se comporta como esperado.

## Wallet — `clip(s, max)` (sanitização de strings)

### O código (`validation.ts`)

```ts
export function clip(s: unknown, max: number): string {
  if (typeof s !== "string") {
    return "";
  }
  const t = s.trim();
  return t.length > max ? t.slice(0, max) : t;
}
```

### O que faz

`clip` **limpa e limita** textos vindos do app antes de gravar no Firestore (ledger, metadados de trade, etc.).

| Passo | Efeito |
|-------|--------|
| Não é `string` | Devolve `""` (ex.: `null`, número, objeto) |
| `trim()` | Remove espaços no início e no fim |
| `length > max` | Corta o texto nos primeiros `max` caracteres (`slice(0, max)`) |

O nome **clip** vem de “recortar” — como cortar uma string que passou do tamanho máximo.

### Exemplos (testes)

| Entrada | `max` | Saída |
|---------|-------|--------|
| `"  abc  "` | 10 | `"abc"` |
| `"abcdefgh"` | 4 | `"abcd"` |
| `null` | 10 | `""` |

### Onde é usado (`simulateWallet.ts`)

| Campo | `max` | Uso |
|-------|-------|-----|
| `headline` | 120 | Título no extrato (PIX, trade) |
| `pixTipo` | 40 | Tipo de chave PIX no saque |
| `pixDestHint` | 120 | Dica do destino PIX |
| `startupId` | 200 | ID da startup (depois valida se não vazio) |
| `startupName` | 200 | Nome denormalizado no ledger |
| `tokenSigla` | 24 | Sigla do token |
| `category` | 80 | Categoria da startup |

Exemplo:

```ts
headline: clip(request.data?.headline, 120) || "Crédito simulado PIX",
```

Se o cliente não mandar headline (ou mandar lixo), usa texto padrão.

### Por que existe (não é só “estética”)

1. **Segurança / abuso** — evita que alguém envie strings de megabytes e polua documentos Firestore ou logs.
2. **Consistência** — campos auditáveis ficam com tamanho previsível na UI e nas queries.
3. **Robustez** — `unknown` + `typeof s !== "string"` evita crash se o app mandar tipo errado.
4. **Diferente de `assert*`** — `clip` **não lança erro**; corrige/sanitiza. `assertStartupId` depois **rejeita** se `clip(...)` virou `""`.

### `clip` vs `assert`

| | `clip` | `assertPositiveIntegerTokens` |
|---|--------|--------------------------------|
| Se inválido | Ajusta (`""` ou corta) | Lança `HttpsError` |
| Objetivo | Sanitizar texto | Bloquear operação |
| Típico para | Headlines, nomes, hints | Quantidades, preços, regras de negócio |

**Resumo:** `clip` = **trim + limite de caracteres** em strings do cliente antes de persistir; protege tamanho e tipo sem derrubar a callable.

## Flutter — `WidgetsBinding.instance.addPostFrameCallback`

### O trecho (`biometric_unlock_screen.dart`)

```dart
@override
void initState() {
  super.initState();
  // Dispara o diálogo do sistema logo após o primeiro frame (evita build sobre build).
  WidgetsBinding.instance.addPostFrameCallback((_) => _tentarDesbloquear());
}
```

### O que é

`WidgetsBinding` liga o teu código ao **ciclo de frames** do Flutter (build → layout → paint).

`addPostFrameCallback` **agenda uma função** para correr **depois** do próximo frame ser desenhado na tela — ou seja, **depois** do `build()` atual terminar e o layout estar pronto.

### Para que serve aqui

`_tentarDesbloquear()` abre o diálogo nativo de biometria (Face ID / digital) e pode chamar `setState` / `Navigator`.

Se chamasses isso **directamente dentro de `initState()`** (sem post-frame):

- ainda estás no meio da **montagem** do widget;
- podes provocar **“setState() called during build”** ou comportamento estranho ao mostrar overlay/dialog em cima de um ecrã que ainda não terminou o primeiro paint.

Com `addPostFrameCallback`:

1. `initState` corre → regista o callback.
2. Flutter faz o primeiro `build` → o utilizador vê o ecrã “Desbloqueio seguro”.
3. **Depois** do frame → corre `_tentarDesbloquear()` → aparece o prompt de biometria.

O comentário no código resume: **“evita build sobre build”**.

### Analogia rápida

```text
initState + chamada imediata  →  “abrir porta enquanto a casa ainda está a ser construída”
addPostFrameCallback          →  “espera a casa ficar pronta, depois toca à campainha”
```

### Outros usos no projeto

O mesmo padrão aparece em:

- `splash_screen.dart` — navegar para o próximo ecrã após o splash pintar;
- `verification_code_screen.dart` — focar campo OTP;
- `carteira_screen.dart` — scroll / `BuildContext` já válido;
- `balcao_compra_senha_screen.dart` — oferta de biometria após o ecrã montar.

### Relação com `mounted`

Dentro de `_tentarDesbloquear` o código usa `if (!mounted) return` **depois** de `await` — porque o widget pode ter sido removido da árvore enquanto o diálogo de biometria estava aberto. O post-frame callback só resolve o timing do **primeiro** disparo; `mounted` protege os **async** seguintes.

### Alternativas (só referência)

- Chamar biometria no botão apenas (sem auto) — não precisaria de post-frame no `initState`.
- `Future.microtask` / `scheduleMicrotask` — também adia, mas o padrão Flutter recomendado para “após o frame” é `addPostFrameCallback`.

**Resumo:** `addPostFrameCallback` = **executa isto logo depois do primeiro frame desenhado**; usado para diálogos, navegação e `setState` que não devem correr no meio do `build`/`initState`.

## Dart / Flutter — `RegExp(r'[0-9]')` (`create_account_screen.dart`)

### O que é `RegExp`

**Expressão regular** em Dart: um padrão de texto. O prefixo `r'...'` é **raw string** — a barra `\` não precisa de escape duplo (ex.: `r'\d'` vs `'\\d'`).

`[0-9]` significa: **qualquer um** dos caracteres entre `0` e `9` — ou seja, **um dígito**.

| Padrão | Significa |
|--------|-----------|
| `[0-9]` | Um dígito (`0`…`9`) |
| `[A-Z]` | Uma letra maiúscula |
| `[^A-Za-z0-9]` | Um caractere que **não** é letra nem número (especial) |

### Uso 1 — máscara de telefone e CPF (linha ~55)

```dart
final _phoneFormatter = MaskTextInputFormatter(
  mask: '(##) #####-####',
  filter: {'#': RegExp(r'[0-9]')},
);

final _cpfFormatter = MaskTextInputFormatter(
  mask: '###.###.###-##',
  filter: {'#': RegExp(r'[0-9]')},
);
```

No pacote `mask_text_input_formatter`:

- `#` na máscara = posição que o utilizador **preenche**;
- `filter: {'#': RegExp(r'[0-9]')}` = **só aceita dígitos** em cada `#`.

Assim o utilizador **não consegue digitar letras** no telefone ou CPF — só números, com parênteses, espaços e hífen **fixos** pela máscara.

Exemplo telefone: `(11) 98765-4321` — os símbolos vêm da máscara; os algarismos passam pelo filtro `[0-9]`.

### Uso 2 — regra de senha “tem número” (linha ~101)

```dart
bool get _passwordHasNumber {
  final value = _passwordController.text;
  return RegExp(r'[0-9]').hasMatch(value);
}
```

Aqui **não** formata entrada — **verifica** se a senha contém **pelo menos um** dígito em qualquer posição.

- `hasMatch(value)` → `true` se **existir** algum caractere que case com `[0-9]`;
- usado na checklist visual da senha (junto com maiúscula, especial, 8 caracteres, etc.).

### Comparação dos dois usos no mesmo ficheiro

| Local | Papel do `RegExp(r'[0-9]')` |
|-------|------------------------------|
| `_phoneFormatter` / `_cpfFormatter` | **Bloquear** teclas inválidas enquanto digita |
| `_passwordHasNumber` | **Validar** depois de digitar (regra de política de senha) |

Outras regras no mesmo ecrã:

```dart
RegExp(r'[A-Z]').hasMatch(value)      // tem maiúscula
RegExp(r'[^A-Za-z0-9]').hasMatch(value) // tem especial
```

### Resumo em uma frase

`RegExp(r'[0-9]')` = “caracter **numérico**”; na máscara **só deixa entrar dígitos**; na senha **confirma que existe pelo menos um dígito**.

## Dart — o operador `=>` (arrow / função expressão)

No ficheiro `first_access_onboarding_screen.dart` (e em todo o Flutter) o `=>` **não é comparação** (`>=`) nem seta de tipo. É sintaxe de **corpo expressão**: “calcula e devolve isto”.

### 1. Getter com uma expressão (linha 59 — onde estás)

```dart
bool get _emailOk => _user?.emailVerified ?? false;
```

Equivale a:

```dart
bool get _emailOk {
  return _user?.emailVerified ?? false;
}
```

- `get _emailOk` — propriedade calculada (sem parênteses ao usar: `_emailOk`).
- `=>` — o **return** está implícito; só pode haver **uma expressão** à direita.

Outros no mesmo ficheiro:

```dart
User? get _user => FirebaseAuth.instance.currentUser;
bool get _canContinue => _emailOk && _phoneOk;
```

### 2. Função anónima curta (callback)

```dart
setState(() => _syncingUser = true);
```

Equivale a:

```dart
setState(() {
  _syncingUser = true;
});
```

- `() => ...` — função sem nome passada a `setState`.
- Útil quando o corpo é **uma linha** (atribuição, return simples).

Navegação:

```dart
builder: (_) => const LinkPhoneForMfaScreen(...)
(route) => false
```

- `_` — parâmetro ignorado (não usas o nome).
- `=>` — devolve o widget ou `false` (remover rotas da pilha).

### 3. `createState` em `StatefulWidget`

```dart
State<FirstAccessOnboardingScreen> createState() =>
    _FirstAccessOnboardingScreenState();
```

Mesma ideia: método que só **retorna** um objeto — forma curta de escrever.

### Regras práticas

| Forma | Quando usar |
|-------|-------------|
| `=> expressão` | Corpo de **uma** expressão (getter, callback curto) |
| `{ ... return x; }` | Várias linhas, `if`, loops, vários `return` |

**Não confundir:**

| Símbolo | Significado |
|---------|-------------|
| `=>` | Corpo expressão / arrow function |
| `>=` | Maior ou igual (comparação) |
| `??` | Se null, usa o valor à direita (`?? false` na linha 59) |

Na linha 59, `_user?.emailVerified ?? false` significa: se `_user` for null ou `emailVerified` for null, usa `false`.

**Resumo:** `=>` em Dart = **atalho para “devolve / executa esta expressão”**; em getters substitui `{ return ...; }`; em `() =>` define uma função lambda de uma linha.

## Dart — `import 'dart:math' show min;`

### O trecho (`phone_sms_verification_screen.dart`)

```dart
import 'dart:math' show min;
// ...
final focusIndex = min(take.length, 5);
_digitFocusNodes[focusIndex].requestFocus();
```

### O que é `dart:math`

Biblioteca **padrão** do Dart com funções matemáticas: `min`, `max`, `sqrt`, `sin`, `Random`, etc.

### O que faz `show min`

Import **selectivo**: desta biblioteca entra **só** a função `min` no ficheiro.

| Import | O que fica disponível |
|--------|---------------------|
| `import 'dart:math';` | Tudo (`min`, `max`, `pi`, `Random`, …) |
| `import 'dart:math' show min;` | **Apenas** `min` |
| `import 'dart:math' hide Random;` | Tudo menos `Random` |

**Por que importar só `min`?**

1. **Clareza** — quem lê o ficheiro sabe que só se usa `min`.
2. **Namespace** — evita trazer nomes que não usas (e possíveis conflitos raros com outros símbolos).
3. **Hábito comum** em Dart/Flutter para imports mínimos.

Não muda o comportamento da app em runtime de forma visível; é organização e intenção.

### Para que serve `min(a, b)` aqui

`min` devolve o **menor** dos dois números.

O ecrã tem **6** caixas OTP, índices **0 a 5**. Ao colar dígitos (`_applyDigitsFromPaste`):

- `take` tem no máximo 6 caracteres;
- preenche as caixas 0…`take.length - 1`;
- `focusIndex` = onde pôr o cursor a seguir.

```dart
final focusIndex = min(take.length, 5);
```

| Dígitos colados (`take.length`) | `min(length, 5)` | Foco vai para |
|--------------------------------|------------------|---------------|
| 1 | 1 | 2.ª caixa |
| 3 | 3 | 4.ª caixa |
| 6 | **5** (cap) | 6.ª caixa (última) |

Sem o `min`, com 6 dígitos seria `focusIndex = 6` — **fora do array** `_digitFocusNodes[6]` → crash.

Ou seja: `min` **limita o índice de foco ao último campo válido** (índice 5).

Alternativa equivalente sem `dart:math`:

```dart
final focusIndex = take.length > 5 ? 5 : take.length;
```

### Resumo

| Parte | Significado |
|-------|-------------|
| `dart:math` | Biblioteca oficial com `min` / `max` / etc. |
| `show min` | Importa só `min` |
| `min(take.length, 5)` | Foco nunca passa da 6.ª caixa (índice 5) |

## Flutter — `SystemUiOverlayStyle` e `AnnotatedRegion`

### O trecho (`recover_password_screen.dart`)

```dart
import 'package:flutter/services.dart';

return AnnotatedRegion<SystemUiOverlayStyle>(
  value: AppColors.shellOverlayStyle(theme.brightness),
  child: Scaffold(
    body: Container(
      decoration: BoxDecoration(gradient: LinearGradient(...)),
      ...
```

### O que é `SystemUiOverlayStyle`

Classe do Flutter (`flutter/services.dart`) que descreve como pintar a **UI do sistema operativo** por cima do teu app — não é widget Material, é a “moldura” do telemóvel:

| Propriedade típica | Controla |
|--------------------|----------|
| `statusBarColor` | Cor da **barra de estado** (topo: hora, bateria, sinal) |
| `statusBarIconBrightness` | Ícones da status bar **escuros ou claros** (Android) |
| `statusBarBrightness` | Variante para iOS (lógica invertida em relação ao Android) |
| `systemNavigationBarColor` | Cor da **barra de navegação** (botões/gestos em baixo) |
| `systemNavigationBarIconBrightness` | Ícones da barra inferior |

**Objetivo:** os ícones do sistema (brancos vs pretos) e o fundo das barras **combinarem** com o teu ecrã (gradiente escuro, fundo branco, etc.) — legibilidade e aspecto profissional.

### Por que importa

Sem ajustar, no Android a status bar pode ficar **preta por defeito** ou com ícones **ilegíveis** (ícones brancos em fundo claro, ou o contrário).

O comentário em `app_colors.dart` diz isso explicitamente para AppBar clara:

```dart
/// AppBar / status bar em tom claro (evita fundo preto por transparência no Android).
```

### `AnnotatedRegion<SystemUiOverlayStyle>`

Envolve a árvore de widgets e diz ao Flutter: **neste ecrã**, aplica este estilo às barras do sistema.

```dart
AnnotatedRegion<SystemUiOverlayStyle>(
  value: AppColors.shellOverlayStyle(theme.brightness),
  child: Scaffold(...),
)
```

- `value` — o estilo a usar enquanto este ecrã estiver visível;
- ao sair do ecrã, o estilo anterior (ou o do ecrã seguinte) volta.

### `AppColors.shellOverlayStyle` no projeto

```dart
static SystemUiOverlayStyle shellOverlayStyle(Brightness brightness) {
  if (brightness == Brightness.dark) {
    return SystemUiOverlayStyle.light.copyWith(
      statusBarColor: Colors.transparent,
      systemNavigationBarColor: gradientBottomDark,
      systemNavigationBarIconBrightness: Brightness.light,
    );
  }
  return SystemUiOverlayStyle.dark.copyWith(
    statusBarColor: Colors.transparent,
  );
}
```

| Tema | Ideia |
|------|--------|
| **Escuro** | Ícones **claros** na status bar (`SystemUiOverlayStyle.light` = ícones light); barra de baixo escura; status bar transparente para o gradiente “subir” |
| **Claro** | `SystemUiOverlayStyle.dark` → ícones **escuros** na status bar; combina fundo claro |

`copyWith` altera só alguns campos do preset `.light` / `.dark`.

### Onde mais aparece

Quase todos os ecrãs de auth, balcão, carteira e catálogo usam o mesmo padrão `AnnotatedRegion` + `shellOverlayStyle` ou `systemUiLightAppBar` — consistência visual em todo o app.

### Resumo

`SystemUiOverlayStyle` = **receita de cores/brilho das barras do sistema**; `AnnotatedRegion` = **aplica essa receita neste ecrã** para a status bar e a navigation bar não “brigarem” com o gradiente ou o tema claro/escuro.

## Flutter — `_stadiumBorder` (`recover_password_screen.dart`)

### O código

```dart
OutlineInputBorder _stadiumBorder(Color color) {
  return OutlineInputBorder(
    borderRadius: BorderRadius.circular(999),
    borderSide: BorderSide(color: color),
  );
}
```

Uso no `TextField` do e-mail:

```dart
enabledBorder: _stadiumBorder(fieldStroke),
focusedBorder: _stadiumBorder(colorScheme.primary),
border: _stadiumBorder(fieldStroke),
```

### O que é

Método **privado** da classe (`_` no início) que devolve a **borda** de um `TextField` / `InputDecoration` com formato de **pílula** (“stadium” / estádio — retângulo com lados totalmente arredondados).

- **`OutlineInputBorder`** — contorno à volta do campo (não só linha em baixo).
- **`BorderRadius.circular(999)`** — raio muito grande; em campos baixos o canto fica **semicircular** → aspecto de cápsula. O `999` é truque comum (“infinito o suficiente”) em vez de calcular metade da altura.
- **`BorderSide(color: color)`** — cor da linha passada por parâmetro.

### Por que existe (DRY)

O mesmo formato repete-se em três estados do campo:

| Propriedade | Quando | Cor típica |
|-------------|--------|------------|
| `border` | Estado base | `fieldStroke` |
| `enabledBorder` | Campo habilitado, sem foco | `fieldStroke` |
| `focusedBorder` | Campo com foco | `colorScheme.primary` (roxo da marca) |

Em vez de copiar `OutlineInputBorder(...)` três vezes, **uma função** centraliza o formato; só muda a **cor** conforme o estado.

### “Stadium” vs outros formatos

| Forma | `borderRadius` típico |
|-------|------------------------|
| Retângulo | `0` ou pequeno (8) |
| Stadium / pílula | ~metade da altura ou `999` |
| Círculo | `BorderRadius.circular(largura/2)` em quadrado |

No Mescla Invest, campos de auth (login, recuperar senha, etc.) seguem este visual arredondado alinhado ao cartão com `BorderRadius.circular(30)`.

### Resumo

`_stadiumBorder` = helper que cria **borda oval/pílula** para `TextField`; o `_` indica uso só neste ficheiro; `999` arredonda ao máximo; cores diferentes para normal vs focado.

## Dart / Flutter — `double.infinity`

### O trecho (`signup_verification_flow_screen.dart`)

```dart
return Scaffold(
  body: Container(
    width: double.infinity,
    height: double.infinity,
    decoration: BoxDecoration(
      gradient: LinearGradient(...),
    ),
    child: const SafeArea(...),
  ),
);
```

### O que é

`double.infinity` é o valor **infinito positivo** do tipo `double` em Dart — o mesmo conceito matemático de ∞, representável no hardware com limites finitos.

Em **layout Flutter**, quando usas `width` ou `height: double.infinity`, não queres “pixels infinitos” de verdade. Queres dizer ao filho:

> **“Ocupa todo o espaço que o pai me permitir dar.”**

O pai (`Scaffold` → `body`) oferece uma **constraint máxima** (largura e altura do ecrã). O filho com `infinity` expande até esse máximo.

### Por que no gradiente de fundo

Sem `infinity`, um `Container` só com `decoration` (gradiente) e sem filho com tamanho fixo pode **encolher** ao mínimo e o gradiente não cobre o ecrã todo — faixas vazias em baixo ou nas laterais.

Com:

```dart
width: double.infinity,
height: double.infinity,
```

o `Container` **preenche o corpo inteiro** do `Scaffold`; o `LinearGradient` pinta a tela toda (dentro do `SafeArea` no filho).

Padrão repetido em `login_screen`, `recover_password_screen`, `create_account_screen`, etc.

### Outros usos no projeto

| Uso | Significado |
|-----|-------------|
| `width: double.infinity` num botão | Botão **largura total** da `Column` |
| `.clamp(0.0, double.infinity)` | Limite **superior sem teto** — só garante mínimo ≥ 0 |
| `SizedBox(width: double.infinity, child: button)` | Força o filho a esticar na horizontal |

Exemplo em `recover_password_screen.dart`:

```dart
(constraints.maxHeight - 24).clamp(0.0, double.infinity)
```

“Altura mínima do scroll: pelo menos 0, sem limite máximo artificial” (evita valor negativo).

### `infinity` vs tamanho explícito

| Abordagem | Quando |
|-----------|--------|
| `double.infinity` | “O mais largo/alto que o pai permitir” (flexível, vários ecrãs) |
| `MediaQuery.of(context).size` | Tamanho físico do ecrã em pixels (menos comum para fundo simples) |
| `Expanded` / `Flexible` | Outra forma de pedir espaço extra num `Row`/`Column` |

### Cuidado

- Em contextos **sem** constraint máxima finita (ex.: `Row` sem largura definida), `width: double.infinity` pode causar **erro de layout** (“unbounded constraints”).
- Dentro de `Scaffold.body` ou `Column` com `crossAxisAlignment: stretch`, costuma funcionar bem.

**Resumo:** `double.infinity` em dimensões Flutter = **“expande ao máximo permitido pelo pai”**; no fundo com gradiente, garante que a cor/gradiente cobre o ecrã inteiro.

## Flutter — `onMultiDigit` e `_OtpPasteFormatter`

### O trecho (`verification_code_screen.dart`)

```dart
class _OtpPasteFormatter extends TextInputFormatter {
  _OtpPasteFormatter(this.onMultiDigit);
  final void Function(String digits) onMultiDigit;

  @override
  TextEditingValue formatEditUpdate(...) {
    final digits = newValue.text.replaceAll(RegExp(r'\D'), '');
    if (digits.length > 1) {
      WidgetsBinding.instance.addPostFrameCallback((_) {
        onMultiDigit(digits);
      });
      return oldValue;  // não deixa 6 chars num campo de 1
    }
    return TextEditingValue(text: digits, ...);
  }
}

// No TextField de cada dígito:
inputFormatters: [
  FilteringTextInputFormatter.digitsOnly,
  _OtpPasteFormatter(_applyDigitsFromPaste),
  LengthLimitingTextInputFormatter(1),
],
```

### O que é `onMultiDigit`

**Callback** (função passada como parâmetro): “quando o utilizador colar ou inserir **mais de um dígito** de uma vez, chama esta função com a string de dígitos”.

- Tipo: `void Function(String digits)` — recebe só dígitos (letras removidas).
- No ecrã de verificação, a implementação concreta é **`_applyDigitsFromPaste`**.

```dart
void _applyDigitsFromPaste(String raw) {
  final take = digits.length > 6 ? digits.substring(0, 6) : digits;
  for (var i = 0; i < 6; i++) {
    _digitControllers[i].text = i < take.length ? take[i] : '';
  }
  setState(() {});
  final focusIndex = min(take.length, 5);
  _digitFocusNodes[focusIndex].requestFocus();
}
```

### Problema que resolve

O OTP usa **6 `TextField`s**, cada um com `LengthLimitingTextInputFormatter(1)` — só **1** caractere por caixa ao digitar.

Se o utilizador **cola** `482910` no primeiro campo, sem tratamento especial:

- ou o formatter corta e só entra `4`;
- ou há conflito com o limite de 1 caractere.

`_OtpPasteFormatter` detecta `digits.length > 1`, **não** altera aquele campo (`return oldValue`) e delega para `onMultiDigit`, que **distribui** os dígitos pelas 6 caixas.

### Fluxo

```mermaid
flowchart LR
  Paste[Cola 482910 no campo 0]
  Formatter[_OtpPasteFormatter]
  Callback[onMultiDigit / _applyDigitsFromPaste]
  UI[Preenche 6 campos + foco]
  Paste --> Formatter
  Formatter -->|length > 1| Callback
  Callback --> UI
```

`addPostFrameCallback` adia o callback para **depois** do frame — evita `setState` / alterar outros controllers no meio do `formatEditUpdate`.

### Onde mais aparece

Mesma classe/callback em:

- `two_factor_verification_screen.dart`
- `phone_sms_verification_screen.dart`

Padrão reutilizado para OTP por e-mail, 2FA e SMS.

### Nomeação

| Nome | Papel |
|------|--------|
| `onMultiDigit` | Nome **genérico** no formatter (contrato: “vários dígitos de uma vez”) |
| `_applyDigitsFromPaste` | Implementação **específica** deste ecrã |

**Resumo:** `onMultiDigit` = callback invocado na **colagem** (ou entrada múltipla) de dígitos; distribui o código pelos 6 campos OTP em vez de ficar preso a 1 dígito por `TextField`.

## Flutter — `KeyEventResult` (OTP e tecla Backspace)

### O trecho (`verification_code_screen.dart`)

```dart
Focus(
  onKeyEvent: (node, event) {
    if (event is! KeyDownEvent) {
      return KeyEventResult.ignored;
    }
    if (event.logicalKey != LogicalKeyboardKey.backspace) {
      return KeyEventResult.ignored;
    }
    if (_digitControllers[index].text.isNotEmpty) {
      return KeyEventResult.ignored;
    }
    if (index == 0) {
      return KeyEventResult.ignored;
    }
    _digitFocusNodes[index - 1].requestFocus();
    final prev = _digitControllers[index - 1].text;
    if (prev.isNotEmpty) {
      _digitControllers[index - 1].text =
          prev.substring(0, prev.length - 1);
    }
    return KeyEventResult.handled;
  },
  child: TextField(...),
)
```

### O que é `KeyEventResult`

Enum do Flutter que o callback `Focus.onKeyEvent` **devolve** para dizer se aquele evento de teclado foi tratado por este widget ou não.

| Valor | Significado |
|-------|-------------|
| `KeyEventResult.ignored` | “Não tratei — outros widgets / comportamento padrão podem processar” |
| `KeyEventResult.handled` | “Já tratei — não precisas de fazer mais nada com esta tecla” |

Há também `skipRemainingHandlers` em APIs mais novas; neste projeto usam só `ignored` e `handled`.

### Comportamento UX que o código implementa

Cenário: **6 caixas OTP**, uma tecla por caixa. O utilizador apaga com **Backspace**:

- Se a caixa **atual tem dígito** → `ignored` → o `TextField` apaga normalmente na caixa atual.
- Se a caixa **está vazia** e não é a primeira → o foco vai para a **caixa anterior** e apaga o último dígito lá (como apps bancários / SMS).
- Se é a **primeira** caixa vazia → `ignored` (nada especial).
- Se a tecla **não** é Backspace, ou não é `KeyDownEvent` → `ignored`.

Só no caso “caixa vazia + backspace + não é índice 0” faz lógica custom e devolve **`handled`**, para o sistema não repetir o backspace noutro sítio.

### Fluxo simplificado

```text
Backspace na caixa i
  ├─ i tem texto?     → ignored (TextField apaga)
  ├─ i == 0 vazia?    → ignored
  └─ i > 0 vazia?     → foco i-1, apaga dígito anterior → handled
```

### Por que `Focus` + `onKeyEvent`

O `TextField` sozinho, com `LengthLimitingTextInputFormatter(1)`, não move o foco para trás ao apagar numa caixa já vazia. O `Focus` intercepta a tecla **antes** e implementa navegação entre campos.

`event is! KeyDownEvent` — ignora `KeyUpEvent` (soltar tecla), para não executar duas vezes.

### Onde mais aparece

Mesmo bloco em `two_factor_verification_screen.dart` e `phone_sms_verification_screen.dart`.

**Resumo:** `KeyEventResult` = resposta “tratei ou ignorei esta tecla”; aqui melhora o **backspace** no OTP multi-caixa.

## Dart — operador `??` (null-coalescing)

### O trecho (`phone_mfa_service.dart`, linha 36)

```dart
FirebaseAuth get _auth => _authOverride ?? FirebaseAuth.instance;
```

### O que faz

`a ?? b` significa:

> Se `a` **não é null**, usa `a`.  
> Se `a` **é null**, usa `b`.

É o operador de **fusão nula** (*null-coalescing*) — muito usado com tipos nullable (`FirebaseAuth?`, `String?`, etc.).

Na linha 36:

| Situação | Resultado de `_auth` |
|----------|----------------------|
| Testes injetam `PhoneMfaService(auth: mockAuth)` | `mockAuth` |
| App normal (`_authOverride` é null) | `FirebaseAuth.instance` |

Permite **testar** com Auth falso sem mudar o resto do código.

### Outros exemplos no mesmo ficheiro

```dart
return error.message ?? 'Dados inválidos.';
```

Se `error.message` for null, mostra texto padrão.

```dart
_lastSendUtc ??= DateTime.now().toUtc();
```

Operador **`??=`** (atribuição): só atribui se a variável for **null** (primeiro envio de SMS).

### Comparação com operadores parecidos

| Operador | Significado |
|----------|-------------|
| `??` | Valor à esquerda, ou fallback se null |
| `??=` | Atribui à direita só se a variável for null |
| `?.` | Acesso seguro (se null, expressão toda vira null) |
| `!` | Afirma “não é null” (crash se estiver errado) |

Exemplo já visto noutro ecrã:

```dart
bool get _emailOk => _user?.emailVerified ?? false;
```

- `?.` — se `_user` for null, não acede a `emailVerified`;
- `?? false` — se o resultado for null, usa `false`.

### Não confundir

| | |
|---|---|
| `??` | Fallback quando **null** |
| `||` | OR lógico (também trata valores “falsy” em JS; em Dart `||` é só bool) |

**Resumo:** `??` = “usa isto; se for null, usa o plano B” — na linha 36, plano B é o Firebase real da app.

## Dart — `extension` (`balcao_operacao_tipo.dart`)

### O trecho

```dart
enum BalcaoOperacaoTipo {
  compra,
  venda,
}

extension BalcaoOperacaoTipoX on BalcaoOperacaoTipo {
  String get verboInfinitivo {
    switch (this) {
      case BalcaoOperacaoTipo.compra:
        return 'Comprar';
      case BalcaoOperacaoTipo.venda:
        return 'Vender';
    }
  }
}
```

### O que é `extension`

Permite **adicionar métodos e getters** a um tipo que já existe (enum, classe, `String`, etc.) **sem alterar o ficheiro original** do tipo e sem herança.

Sintaxe:

```dart
extension NomeDaExtension on TipoAlvo {
  // membros novos
}
```

Uso na app:

```dart
final op = BalcaoOperacaoTipo.compra;
final texto = op.verboInfinitivo;  // "Comprar"
```

Parece um método “dentro” do enum, mas está definido na extension.

### Para que serve aqui

O `enum` só distingue **compra** vs **venda** (lógica, `switch`, navegação).

A extension concentra **texto de UI** derivado do enum:

| Valor | `verboInfinitivo` |
|-------|-------------------|
| `compra` | `"Comprar"` |
| `venda` | `"Vender"` |

Evita espalhar `if (operacao == compra) 'Comprar' else 'Vender'` em várias telas — um sítio só.

O sufixo `X` em `BalcaoOperacaoTipoX` é convenção comum (“extension de BalcaoOperacaoTipo”).

### Extension vs método dentro do enum

Dart moderno permite métodos **dentro** do próprio `enum`:

```dart
enum BalcaoOperacaoTipo {
  compra,
  venda;

  String get verboInfinitivo { ... }
}
```

`extension` é útil quando:

- queres manter o enum **mínimo** e a UI noutro bloco;
- estendes tipos de **bibliotecas** que não podes editar (`String`, `BuildContext`, etc.);
- agrupas helpers por tema (`PixChaveUiFormatacao on PixChaveUi` no projeto).

### Outros exemplos no projeto

- `ValuationPeriodLabel on ValuationPeriod` — rótulos de período no catálogo.
- `PixChaveUiFormatacao on PixChaveUi` — formatação de chave PIX na carteira.

### Limitações (saber para o PI)

- Extensions **não** criam subtipo novo — em runtime continua a ser o mesmo `enum`.
- Não podes adicionar **campos de instância** reais (só getters/métodos calculados).
- Só aplicam onde o tipo é conhecido em compile-time (import do ficheiro da extension).

**Resumo:** `extension` = “cola comportamento extra num tipo existente”; aqui, traduz `BalcaoOperacaoTipo` para texto de botão/título.

## Dart — `is num` e `as int` (dados do Firestore)

### O trecho (`balcao_quantidade_tokens_screen.dart`)

```dart
final tokensHeld = posData?['tokensHeld'] is num
    ? (posData!['tokensHeld'] as num).toDouble()
    : 0.0;

final tokensLocked = posData?['tokensLockedInOrders'] is int
    ? posData!['tokensLockedInOrders'] as int
    : posData?['tokensLockedInOrders'] is num
        ? (posData!['tokensLockedInOrders'] as num).toInt()
        : 0;
```

`posData` vem de `posSnap.data()` — um `Map<String, dynamic>?`. Os valores dos campos **não têm tipo fixo** até você inspecionar.

### O que é `is num`

**`is`** = teste de tipo em **runtime** (pergunta: “este valor é deste tipo?”).

- `valor is num` → `true` se o valor for **número** em Dart (`int` **ou** `double`).
- `num` é a **classe base** de números em Dart; `int` e `double` estendem `num`.

Exemplos:

| Valor vindo do Firestore | `is num` | `is int` |
|--------------------------|----------|----------|
| `42` | true | true |
| `42.0` | true | true (inteiro) |
| `3.14` | true | false |
| `"42"` | false | false |
| `null` / campo ausente | false | false |

Por isso `tokensHeld` usa `is num` e depois `.toDouble()` — aceita tanto inteiro quanto decimal antes de normalizar.

### O que é `as int`

**`as`** = **cast** (conversão de tipo): “trata este valor como `int`”.

- Só deve ser usado **depois** de ter certeza (com `is int`, ou lógica equivalente).
- Se o valor **não for** `int` em runtime → **exceção** (`type cast` error).

No código:

```dart
posData?['tokensLockedInOrders'] is int
    ? posData!['tokensLockedInOrders'] as int   // seguro: já confirmou is int
```

O ramo `is num` + `.toInt()` cobre quando o Firestore/JavaScript devolveu **double** (ex.: `5.0`) em vez de `int` puro.

### Por que não usar só `as int` direto?

Dados de Firestore chegam como **`dynamic`**:

- Um campo pode não existir → `null`.
- Pode vir `int`, `double`, ou tipo errado se alguém gravou manualmente.
- Firestore/JSON às vezes representa números como **double** mesmo para valores inteiros.

Sem `is`, um `as int` em valor `null` ou `"abc"` **quebra a app**.

O padrão **defensivo** do projeto:

1. **`is`** — confirma o tipo.
2. **`as`** — converte (quando já sabe que é seguro).
3. **`: valorDefault`** — se nada bater, usa `0` ou `0.0`.

### O `!` junto (`posData!`)

Depois de `posData?['tokensHeld'] is num`, o Dart **não** garante sozinho que `posData` não é null (porque o teste foi no **valor** do campo, não no mapa).

O `!` diz: “neste ramo, **sei** que `posData` não é null” (assertion). Se estiver errado → crash. Aqui faz sentido porque só entras no ramo se o campo existiu como `num` dentro desse mapa.

### Comparação rápida

| Operador | O que faz | Se falhar |
|----------|-----------|-----------|
| `is Tipo` | Pergunta se é daquele tipo | Devolve `false` (não lança) |
| `as Tipo` | Força tratar como aquele tipo | **Lança exceção** se tipo errado |
| `is! Tipo` | “Não é daquele tipo” | Devolve bool |

### É null safety?

**Sim, no ecossistema Dart.** Combina com tipos nullable (`Map?`, `dynamic`) e evita usar números inválidos no cálculo:

```dart
return tokensHeld.floor() - tokensLocked;  // tokens disponíveis para venda
```

Sem as checagens, `tokensHeld` poderia ser lixo e o balcão mostraria saldo errado.

### Resumo

| Peça | Papel |
|------|--------|
| `is num` | “É número?” (int ou double) |
| `is int` | “É inteiro exato?” |
| `as int` / `as num` | Converte depois do teste |
| `.toDouble()` / `.toInt()` | Normaliza para o tipo que a UI/lógica precisa |
| `0` / `0.0` | Fallback se campo ausente ou inválido |

**Ideia geral:** Firestore = tipos soltos; `is` verifica, `as` converte com segurança relativa, default evita crash.

## Flutter — `mounted` (State)

### O que é

`mounted` é uma propriedade **`bool`** da classe `State` (em `StatefulWidget`). Indica se aquele `State` **ainda está ligado à árvore de widgets** — ou seja, se o ecrã ainda está “vivo” na app.

| Valor | Significado |
|-------|-------------|
| `mounted == true` | O widget ainda está na árvore; podes usar `setState`, `context`, `Navigator`, etc. |
| `mounted == false` | O widget já foi **removido** (`dispose()` já correu) — **não** deves atualizar UI nem usar `context` |

Só existe em classes que estendem `State<...>` (não em `StatelessWidget`).

### Por que existe

Operações **assíncronas** (`await`) demoram. Enquanto esperas:

- o utilizador pode **voltar atrás** (pop);
- trocar de tab;
- fechar o ecrã;
- o Flutter **destrói** o `State`.

Quando o `await` termina, o código continua a correr — mas o ecrã **já pode não existir**. Se ignorares isso:

```dart
await firestore.get(...);
setState(() => ...);           // ❌ erro: setState() called after dispose()
Navigator.of(context).push(...); // ❌ context inválido
```

`if (!mounted) return;` **aborta** antes de tocar na UI num widget morto.

### Onde aparece no `balcao_quantidade_tokens_screen.dart`

**Depois de `await` no Firestore:**

```dart
final posSnap = await SimulatedWalletPaths.positionsCol(uid).doc(fid).get();
if (!mounted) return 0;
// ... usa os dados
```

Enquanto o Firestore respondia, o utilizador pode ter saído do ecrã. Em vez de continuar (e eventualmente `setState` noutro sítio), devolve `0` e para.

**Depois de vários `await` na validação:**

```dart
final precoResolved = await _resolverPrecoMercadoNegocio(fid);
if (!mounted) return false;
// ...
final brlDisponivel = await _consultarBrlDisponivelCompra(user.uid);
if (!mounted) return false;
setState(() => _erroValidacao = '...');
```

Cada `await` é um ponto onde o ecrã pode ter sido destruído.

**Depois do diálogo de confirmação:**

```dart
final aplicouOk = await _aplicarValidacaoCompleta();
if (!mounted) return;

final confirmou = await showDialog<bool>(...);

if (!mounted || confirmou != true) return;

await Navigator.of(context).push(...);
```

- Após `_aplicarValidacaoCompleta()` — validação longa com vários awaits internos.
- Após `showDialog` — o utilizador pode ter fechado o ecrã **por baixo** do diálogo ou navegado noutro sítio enquanto o modal estava aberto.
- Só depois de `mounted` ok é seguro fazer `Navigator.push`.

### Ciclo de vida (resumo)

```mermaid
stateDiagram-v2
  [*] --> mounted_true: initState / insert na árvore
  mounted_true --> mounted_false: dispose (ecrã removido)
  mounted_false --> [*]
```

Entre `initState` e `dispose`, `mounted` é `true`.

### Quando usar

| Situação | Usar `if (!mounted) return`? |
|----------|------------------------------|
| Logo **depois** de qualquer `await` antes de `setState` | ✅ Sim |
| Antes de `Navigator`, `ScaffoldMessenger`, `showDialog` com `context` | ✅ Sim |
| Código **síncrono** no meio do `build` | ❌ Não precisa (ainda estás montado) |
| Dentro de `dispose` | ❌ `mounted` já é false |

### Relação com o que já estudaste

Em `addPostFrameCallback` / biometria, o comentário diz que **`mounted` protege os async seguintes** — o post-frame só resolve o timing do primeiro disparo; cada `await` depois ainda precisa de `if (!mounted)`.

### Erro típico sem `mounted`

> *setState() called after dispose()*  
> *Looking up a deactivated widget's ancestor is unsafe*

Significa: código async tentou atualizar um ecrã que já foi removido.

**Resumo:** `mounted` = “este ecrã ainda está na app?”; `if (!mounted) return` depois de `await` evita crash e atualizações fantasma quando o utilizador já saiu.

## Flutter — `AnnotatedRegion`, `SingleChildScrollView`, `CrossAxisAlignment.stretch` (`balcao_quantidade_tokens_screen.dart`)

### O trecho no `build`

```dart
return AnnotatedRegion<SystemUiOverlayStyle>(
  value: overlay,
  child: Scaffold(
    appBar: AppBar(
      systemOverlayStyle: overlay,
      ...
    ),
    body: SingleChildScrollView(
      padding: const EdgeInsets.fromLTRB(20, 20, 20, 32),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.stretch,
        children: [
          Text(...),
          TextField(...),
          FilledButton(...),
        ],
      ),
    ),
  ),
);
```

---

### `AnnotatedRegion<SystemUiOverlayStyle>`

**Controla a aparência das barras do sistema** (status bar no topo, navigation bar em baixo) — hora, bateria, gestos do Android/iOS.

| Peça | Papel |
|------|--------|
| `SystemUiOverlayStyle` | “Receita”: ícones claros/escuros, cores transparentes, etc. |
| `value: overlay` | Estilo vindo de `AppColors.shellOverlayStyle(theme.brightness)` |
| `AnnotatedRegion` | Aplica esse estilo **enquanto este ecrã está visível** |

Por que envolve o `Scaffold`?

- O fundo do ecrã (`bodyBg`) pode ser escuro ou claro; os ícones da status bar têm de **contrastar** (legíveis).
- `AppBar` também recebe `systemOverlayStyle: overlay` — reforça o mesmo estilo na barra superior.

Sem isso, no Android a status bar pode ficar com ícones ilegíveis ou fundo preto por defeito.

**Não é widget visual** — não desenha nada na tela; só fala com o SO.

---

### `SingleChildScrollView`

Widget que torna o **conteúdo rolável** quando não cabe na altura do ecrã.

| Sem scroll | Com `SingleChildScrollView` |
|------------|----------------------------|
| Teclado ou ecrã pequeno → **overflow** (listras amarelas/pretas de erro) | Utilizador **desliza** para ver campo, botão, mensagens de erro |
| `Column` fixa no `body` | `Column` dentro do scroll |

Neste ecrã faz sentido porque há:

- nome da startup + cotação;
- `StreamBuilder` com saldo disponível;
- `TextField` de quantidade;
- mensagem de erro;
- total estimado;
- botão **Continuar**.

Num telemóvel baixo ou com **teclado numérico aberto**, tudo isso pode passar da altura útil — o scroll evita que o layout “rebente”.

`padding: EdgeInsets.fromLTRB(20, 20, 20, 32)` — margem interna do scroll (respiro nas bordas e espaço extra em baixo para o botão não colar na navigation bar).

**Regra:** `SingleChildScrollView` tem **um** filho (`child: Column`). A `Column` empilha widgets na vertical; o scroll envolve o bloco inteiro.

Alternativa em listas longas: `ListView` — aqui a lista é curta e fixa, por isso `Column` + scroll basta.

---

### `CrossAxisAlignment.stretch`

Propriedade da **`Column`** (e `Row` tem equivalente). Define como os filhos se alinham **no eixo transversal** (horizontal, numa `Column` vertical).

```dart
Column(
  crossAxisAlignment: CrossAxisAlignment.stretch,
  children: [...],
)
```

| Valor | Efeito na `Column` |
|-------|---------------------|
| `start` (padrão) | Filhos só ocupam a **largura do conteúdo** (texto estreito, botão pequeno) |
| `center` | Centrados na horizontal |
| `stretch` | Filhos **esticam à largura máxima** que a `Column` recebe do pai |

Com **`stretch`**:

- `TextField` fica **largura total** (melhor UX).
- `FilledButton` **Continuar** ocupa a largura inteira — padrão de apps mobile.
- `Text` também usa toda a largura (útil para quebras de linha longas no saldo disponível).

Sem `stretch`, o botão ficaria só do tamanho do texto “Continuar” e o campo não preencheria o cartão.

Diagrama mental:

```text
Column (largura = ecrã − padding)
├─ crossAxisAlignment: start     →  [Continuar]     (estreito)
└─ crossAxisAlignment: stretch   →  [── Continuar ──]  (full width)
```

A `Column` dentro do `SingleChildScrollView` recebe constraint de largura finita (largura do ecrã); `stretch` faz os filhos usarem **100%** dessa largura.

---

### Como os três trabalham juntos

```mermaid
flowchart TB
  AR[AnnotatedRegion — barras do SO]
  SC[Scaffold — estrutura do ecrã]
  SV[SingleChildScrollView — rolagem]
  COL[Column stretch — filhos full width]
  AR --> SC
  SC --> SV
  SV --> COL
```

1. **`AnnotatedRegion`** — status bar / nav bar legíveis com o tema.
2. **`Scaffold`** — AppBar + body.
3. **`SingleChildScrollView`** — body cabe em qualquer altura / com teclado.
4. **`Column` + `stretch`** — formulário e botão com layout de app profissional.

**Resumo:** `AnnotatedRegion` = estilo das barras do sistema; `SingleChildScrollView` = rolagem quando o conteúdo não cabe; `CrossAxisAlignment.stretch` = filhos da `Column` ocupam toda a largura disponível.
